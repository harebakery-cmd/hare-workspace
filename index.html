ems: \"center\", justifyContent: \"space-between\" }}>\r\n                      \u003clabel style={{ marginBottom: 0 }}>원산지\u003c/label>\r\n                      \u003cbutton type=\"button\" className=\"origin-list-toggle\" onClick={() => setOriginOpen(v => !v)}>\r\n                        저장된 표기 {originList.length > 0 ? `(${originList.length})` : \"\"}\r\n                        \u003cIconChevronDown size={11} className={\"chev\" + (originOpen ? \" open\" : \"\")} />\r\n                      \u003c/button>\r\n                    \u003c/div>\r\n                    \u003cdiv className=\"origin-combo\">\r\n                      \u003ctextarea value={origin} onChange={e => setOrigin(e.target.value)}\r\n                        onFocus={() => setOriginOpen(true)}\r\n                        onBlur={() => { saveOriginIfNew(origin); setTimeout(() => setOriginOpen(false), 120); }}\r\n                        placeholder=\"예) 프랑스산 버터, 국산 밀가루\" rows={2} />\r\n                      {originOpen && (\r\n                        \u003cdiv className=\"origin-panel\">\r\n                          {originListLoading ? (\r\n                            \u003cp className=\"db-status\">불러오는 중...\u003c/p>\r\n                          ) : (() => {\r\n                            const currentSegment = getCurrentOriginSegment(origin);\r\n                            const q = currentSegment.toLowerCase();\r\n                            const matches = q ? originList.filter(o => o.toLowerCase().includes(q)) : originList;\r\n                            const entries = splitOriginEntries(origin);\r\n                            const newEntryCount = entries.filter(e => !originList.includes(e)).length;\r\n                            return (\r\n                              \u003cdiv className=\"db-list origin-list\">\r\n                                {newEntryCount > 0 && (\r\n                                  \u003cbutton className=\"db-item origin-item-new\" onMouseDown={(e) => { e.preventDefault(); saveOriginIfNew(origin); setOriginOpen(false); }}>\r\n                                    \u003cspan className=\"db-item-name\">\r\n                                      {entries.length > 1\r\n                                        ? `＋ 새 표기 ${newEntryCount}개 저장 (쉼표로 구분됨)`\r\n                                        : `＋ \"${origin.trim()}\" 새 표기로 저장`}\r\n                                    \u003c/span>\r\n                                  \u003c/button>\r\n                                )}\r\n                                {matches.length === 0 && !origin.trim() && (\r\n                                  \u003cp className=\"db-empty\">아직 저장된 원산지 표기가 없어요.\u003cbr/>직접 입력하면 자동으로 목록에 저장됩니다.\u003c/p>\r\n                                )}\r\n                                {matches.map((o, i) => (\r\n                                  \u003cdiv key={o + i} className=\"db-item origin-item-row\">\r\n                                    \u003cbutton type=\"button\" className=\"origin-item-select\" onMouseDown={(e) => { e.preventDefault(); setOrigin(replaceCurrentOriginEntry(origin, o)); setOriginOpen(false); }}>\r\n                                      \u003cspan className=\"db-item-name\">{o}\u003c/span>\r\n                                    \u003c/button>\r\n                                    \u003cbutton type=\"button\" className=\"origin-item-delete\" title=\"이 표기 삭제\" onMouseDown={(e) => { e.preventDefault(); e.stopPropagation(); deleteOriginEntry(o); }}>\r\n                                      ✕\r\n                                    \u003c/button>\r\n                                  \u003c/div>\r\n                                ))}\r\n                              \u003c/div>\r\n                            );\r\n                          })()}\r\n                        \u003c/div>\r\n                      )}\r\n                    \u003c/div>\r\n                    \u003cp className=\"field-hint\">기존 표기를 선택하거나, 새로 입력하면 팀 전체가 공유하는 목록에 저장됩니다.\u003c/p>\r\n                  \u003c/section>\r\n                )}\r\n\r\n                {!showOriginField && (\r\n                  \u003csection className=\"field\">\r\n                    \u003clabel>안내 메시지 (선택)\u003c/label>\r\n                    \u003cinput value={message} onChange={e => setMessage(e.target.value)} placeholder=\"예) 필요하신 고객님은 직원을 불러주세요!\" />\r\n                  \u003c/section>\r\n                )}\r\n\r\n                \u003csection className=\"field\">\r\n                  \u003cdiv style={{ display: \"flex\", alignItems: \"center\", justifyContent: \"space-between\" }}>\r\n                    \u003clabel style={{ marginBottom: 0 }}>금액\u003c/label>\r\n                    \u003cbutton type=\"button\" className={\"discount-toggle\" + (discountOpen ? \" active\" : \"\")}\r\n                      onClick={() => setDiscountOpen(v => !v)} title=\"가격 할인 표기\">\r\n                      \u003cIconPercent size={11} /> 할인\r\n                    \u003c/button>\r\n                  \u003c/div>\n                  \u003cdiv className=\"price-input-grid\">\n                    \u003cdiv className=\"price-input-item\">\n                      \u003cspan>낱개 금액 (기본)\u003c/span>\n                      \u003cinput className=\"price-label-edit\" value={priceLabel} onChange={e => setPriceLabel(e.target.value)} maxLength={12} placeholder=\"낱개\" aria-label=\"낱개 표시 문구\" />\n                      \u003cdiv className=\"price-wrap\">\n                        \u003cinput value={price} onChange={e => setPrice(e.target.value)} onBlur={() => setPrice(formatPriceText(price))} placeholder=\"예) 3,800\" aria-label=\"낱개 금액\" />\n                        \u003cspan className=\"price-suffix\">원\u003c/span>\n                      \u003c/div>\n                    \u003c/div>\n                    \u003cdiv className=\"price-input-item\">\n                      \u003cspan>세트 금액 (하단 · 선택)\u003c/span>\n                      \u003cinput className=\"price-label-edit\" value={bundlePriceLabel} onChange={e => setBundlePriceLabel(e.target.value)} maxLength={12} placeholder=\"세트\" aria-label=\"세트 표시 문구\" />\n                      \u003cdiv className=\"price-wrap\">\n                        \u003cinput value={bundlePrice} onChange={e => setBundlePrice(e.target.value)} onBlur={() => setBundlePrice(formatPriceText(bundlePrice))} placeholder=\"예) 10,000\" aria-label=\"세트 금액\" />\n                        \u003cspan className=\"price-suffix\">원\u003c/span>\n                      \u003c/div>\n                    \u003c/div>\n                  \u003c/div>\n                  {discountOpen && (\r\n                    \u003cdiv className=\"discount-wrap\">\r\n                      \u003cinput type=\"number\" min={1} max={99} value={discountPercent}\r\n                        onChange={e => setDiscountPercent(e.target.value)} placeholder=\"숫자 직접 입력, 예) 20\" />\r\n                      \u003cspan className=\"discount-suffix\">% 할인\u003c/span>\r\n                    \u003c/div>\r\n                  )}\r\n                \u003c/section>\r\n\r\n                {showOriginField && (\r\n                  \u003csection>\r\n                    \u003cdiv style={{ display: \"flex\", alignItems: \"center\", justifyContent: \"space-between\", marginBottom: 6 }}>\r\n                      \u003clabel className=\"label-eyebrow\" style={{ marginBottom: 0 }}>알레르기 유발물질\u003c/label>\r\n                      {allergens.length > 0 && \u003cbutton className=\"clear-link\" onClick={() => setAllergens([])}>전체 해제\u003c/button>}\r\n                    \u003c/div>\r\n                    \u003cdiv className=\"allergen-chips\">\r\n                      {ALLERGENS.map(a => {\r\n                        const active = allergens.includes(a);\r\n                        return (\r\n                          \u003cbutton key={a} className={\"allergen-chip\" + (active ? \" active\" : \"\")} onClick={() => toggleAllergen(a)}>\r\n                            {active && \u003cIconCheck size={8} strokeWidth={3} />}\r\n                            {a}\r\n                          \u003c/button>\r\n                        );\r\n                      })}\r\n                    \u003c/div>\r\n                    {allergens.length === 0 && \u003cp className=\"hint\">선택 없으면 \"해당없음\" 표기\u003c/p>}\r\n                  \u003c/section>\r\n                )}\r\n\r\n                \u003cdiv className=\"actions-row\">\r\n                  \u003cbutton className=\"btn-add\" disabled={!name.trim()} onClick={addToQueue}>\r\n                    \u003cIconPlus size={13} /> 인쇄 목록에 추가\r\n                  \u003c/button>\r\n                  \u003cbutton className=\"btn-save-card\" disabled={!name.trim() || savingCard} onClick={saveCardToLibrary} title=\"저장된 카드 목록에 저장\">\r\n                    \u003cIconBookmark size={13} /> {savingCard ? \"저장 중...\" : \"카드로 저장\"}\r\n                  \u003c/button>\r\n                  \u003cbutton className=\"btn-reset\" title=\"입력 내용 리셋\" aria-label=\"입력 내용 리셋\" onClick={resetForm}>\r\n                    \u003cIconRefresh size={13} /> 리셋\r\n                  \u003c/button>\r\n                \u003c/div>\r\n              \u003c/div>\r\n            \u003c/aside>\r\n\r\n            \u003cmain className=\"main\">\r\n              \u003cdiv className=\"righttabs\">\r\n                \u003cbutton className={\"righttab-btn\" + (rightTab === \"preview\" ? \" active\" : \"\")} onClick={() => setRightTab(\"preview\")}>\r\n                  \u003cIconEye size={12} /> 미리보기\r\n                \u003c/button>\r\n                \u003cbutton className={\"righttab-btn\" + (rightTab === \"queue\" ? \" active\" : \"\")} onClick={() => setRightTab(\"queue\")}>\r\n                  \u003cIconPrinter size={12} /> 인쇄 목록 ({queue.length})\r\n                \u003c/button>\r\n                \u003cbutton className={\"righttab-btn\" + (rightTab === \"saved\" ? \" active\" : \"\")} onClick={() => setRightTab(\"saved\")}>\r\n                  \u003cIconBookmark size={12} /> 저장된 카드 ({savedCards.length})\r\n                \u003c/button>\r\n              \u003c/div>\r\n\r\n              {rightTab === \"preview\" && (\r\n                \u003cdiv className={\"preview-pane\" + (previewDark ? \" dark\" : \"\")}>\r\n                  \u003cdiv className=\"preview-top-row\">\r\n                    \u003cp className=\"preview-caption\">\r\n                      {CARD_TYPE_LIST.find(c => c.id === cardType)?.label} — {settings.sizes[cardType].width}×{settings.sizes[cardType].height}mm\r\n                    \u003c/p>\r\n                    \u003cbutton className=\"preview-mode-btn\" onClick={() => setPreviewDark(v => !v)}>\r\n                      {previewDark ? \u003cIconSun size={12} /> : \u003cIconMoon size={12} />}\r\n                      {previewDark ? \"라이트 모드\" : \"다크 모드\"}\r\n                    \u003c/button>\r\n                  \u003c/div>\r\n                  \u003cShowCard card={currentCard} settings={settings} designs={designs} />\r\n                  \u003cp className=\"preview-note\">입력 내용이 실시간으로 반영됩니다\u003c/p>\r\n                \u003c/div>\r\n              )}\r\n\r\n              {rightTab === \"queue\" && (\r\n                \u003cdiv className=\"queue-pane\">\r\n                  {queue.length === 0 ? (\r\n                    \u003cdiv className=\"queue-empty\">\r\n                      \u003cIconPrinter size={32} style={{ opacity: .2 }} />\r\n                      \u003cp className=\"t1\">인쇄 목록이 비어있습니다\u003c/p>\r\n                      \u003cp className=\"t2\">왼쪽에서 카드를 작성하고 추가하세요\u003c/p>\r\n                    \u003c/div>\r\n                  ) : (\r\n                    \u003cReact.Fragment>\r\n                      \u003cdiv className=\"queue-head\">\r\n                        \u003cp className=\"queue-head-info\">총 {queue.length}장 — A4 2열 배치 인쇄\u003c/p>\r\n                        \u003cbutton className=\"queue-clear\" onClick={() => setQueue([])}>전체 삭제\u003c/button>\r\n                      \u003c/div>\r\n                      \u003cdiv className=\"queue-items\">\r\n                        {queue.map((card, idx) => (\r\n                          \u003cdiv key={card.id} className=\"queue-item\">\r\n                            \u003cspan className=\"queue-idx\">{idx + 1}\u003c/span>\r\n                            \u003cdiv className=\"queue-thumb\">\r\n                              \u003cShowCard card={card} settings={settings} designs={designs} scale={SCREEN_SCALE * 0.42} />\r\n                            \u003c/div>\r\n                            \u003cdiv className=\"queue-info\">\r\n                              \u003cp className=\"queue-name\">{card.name}\u003c/p>\r\n                              \u003cp className=\"queue-sub\">{CARD_TYPE_LIST.find(c => c.id === card.type)?.label}{card.price && ` · ${card.priceLabel == null ? \"낱개\" : card.priceLabel} ₩${formatPriceText(card.price)}`}{card.setPrice && ` · ${card.setPriceLabel == null ? \"세트\" : card.setPriceLabel} ₩${formatPriceText(card.setPrice)}`}\u003c/p>\n                              {card.allergens && card.allergens.length > 0 && \u003cp className=\"queue-allergen\">{getAllergenLabels(card.allergens)}\u003c/p>}\r\n                            \u003c/div>\r\n                            \u003cbutton className=\"queue-del\" onClick={() => setQueue(prev => prev.filter(c => c.id !== card.id))}>\r\n                              \u003cIconTrash size={13} />\r\n                            \u003c/button>\r\n                          \u003c/div>\r\n                        ))}\r\n                      \u003c/div>\r\n                    \u003c/React.Fragment>\r\n                  )}\r\n                \u003c/div>\r\n              )}\r\n\r\n              {rightTab === \"saved\" && (\r\n                \u003cdiv className=\"queue-pane\">\r\n                  {savedCardsLoading ? (\r\n                    \u003cdiv className=\"queue-empty\">\r\n                      \u003cIconRefresh size={28} className=\"spin\" style={{ opacity: .3 }} />\r\n                      \u003cp className=\"t1\">불러오는 중...\u003c/p>\r\n                    \u003c/div>\r\n                  ) : savedCards.length === 0 ? (\r\n                    \u003cdiv className=\"queue-empty\">\r\n                      \u003cIconBookmark size={32} style={{ opacity: .2 }} />\r\n                      \u003cp className=\"t1\">저장된 카드가 없습니다\u003c/p>\r\n                      \u003cp className=\"t2\">왼쪽 폼에서 \"카드로 저장\"을 누르면 여기에 쌓여, 다음에 바로 인쇄 목록에 불러올 수 있어요\u003c/p>\r\n                    \u003c/div>\r\n                  ) : (\r\n                    \u003cReact.Fragment>\r\n                      \u003cdiv className=\"queue-head\">\r\n                        \u003cp className=\"queue-head-info\">총 {savedCards.length}개 저장됨 — 팀 전체가 공유합니다\u003c/p>\r\n                      \u003c/div>\r\n                      \u003cdiv className=\"queue-items\">\r\n                        {savedCards.map((card) => (\r\n                          \u003cdiv key={card.id} className=\"queue-item saved-item\">\r\n                            \u003cdiv className=\"queue-thumb\">\r\n                              \u003cShowCard card={card} settings={settings} designs={designs} scale={SCREEN_SCALE * 0.42} />\r\n                            \u003c/div>\r\n                            \u003cdiv className=\"queue-info\">\r\n                              \u003cp className=\"queue-name\">{card.name}\u003c/p>\r\n                              \u003cp className=\"queue-sub\">{CARD_TYPE_LIST.find(c => c.id === card.type)?.label}{card.price && ` · ${card.priceLabel == null ? \"낱개\" : card.priceLabel} ₩${formatPriceText(card.price)}`}{card.setPrice && ` · ${card.setPriceLabel == null ? \"세트\" : card.setPriceLabel} ₩${formatPriceText(card.setPrice)}`}\u003c/p>\n                              {card.allergens && card.allergens.length > 0 && \u003cp className=\"queue-allergen\">{getAllergenLabels(card.allergens)}\u003c/p>}\r\n                            \u003c/div>\r\n                            \u003cdiv className=\"saved-item-actions\">\r\n                              \u003cbutton className=\"saved-load-btn\" onClick={() => addSavedToQueue(card)} title=\"인쇄 목록에 추가\">\r\n                                \u003cIconPrinter size={12} /> 인쇄 목록에\r\n                              \u003c/button>\r\n                              \u003cbutton className=\"btn-ghost-sm\" onClick={() => loadSavedToForm(card)} title=\"폼에 불러와서 수정\">\r\n                                \u003cIconRefresh size={11} /> 폼에 불러오기\r\n                              \u003c/button>\r\n                              \u003cbutton className=\"queue-del\" onClick={() => deleteSavedCard(card.id)}>\r\n                                \u003cIconTrash size={13} />\r\n                              \u003c/button>\r\n                            \u003c/div>\r\n                          \u003c/div>\r\n                        ))}\r\n                      \u003c/div>\r\n                    \u003c/React.Fragment>\r\n                  )}\r\n                \u003c/div>\r\n              )}\r\n            \u003c/main>\r\n          \u003c/React.Fragment>\r\n        )}\r\n\r\n        {mainTab === \"origin-label\" && (\r\n          \u003cdiv className=\"originlabel-wrap\">\r\n            \u003caside className=\"originlabel-side\">\r\n              \u003csection className=\"originlabel-register\">\n                \u003cp className=\"originlabel-register-title\">원산지 이미지 자료 등록\u003c/p>\n                \u003cdiv className=\"originlabel-upload-guide\">\n                  \u003cp className=\"originlabel-upload-guide-title\">📎 원라벨 이미지 업로드 방법\u003c/p>\n                  \u003col>\n                    \u003cli>제품 DB에 등록된 것과 \u003cstrong>동일한 원산지 문구\u003c/strong>를 입력하세요.\u003c/li>\n                    \u003cli>같은 문구의 원라벨이 여러 종류면 \u003cstrong>구분값\u003c/strong>(예: CJ, 곰표)을 입력하세요.\u003c/li>\n                    \u003cli>\u003cstrong>자료 확인\u003c/strong>으로 기존 사진을 확인한 뒤, 사진을 최대 6장 선택하세요.\u003c/li>\n                    \u003cli>사진은 자동 압축·업로드되며 완료 후 별도 저장 버튼 없이 바로 공유됩니다.\u003c/li>\n                  \u003c/ol>\n                  \u003cp className=\"originlabel-upload-guide-note\">JPG·PNG·WEBP 지원 · 사진 원본은 Cloudinary에 저장되고 Firebase에는 문구와 사진 주소만 저장됩니다. 사진을 누르면 해당 사진이 삭제됩니다.\u003c/p>\n                \u003c/div>\n                \u003ctextarea\n                  value={originLabelRegisterText}\r\n                  onChange={(e) => setOriginLabelRegisterText(e.target.value)}\r\n                  placeholder=\"예) 밀가루(밀:미국산)\"\r\n                />\r\n                \u003cinput\r\n                  value={originLabelRegisterVariant}\r\n                  onChange={(e) => setOriginLabelRegisterVariant(e.target.value)}\r\n                  placeholder=\"원라벨 구분 (선택) 예: CJ, 곰표\"\r\n                />\r\n                \u003cdiv className=\"originlabel-register-actions\">\r\n                  \u003cbutton type=\"button\" className=\"btn-reset\" onClick={() => loadOriginLabelRegisterLibrary(originLabelRegisterText)}>\r\n                    자료 확인\r\n                  \u003c/button>\r\n                  \u003clabel className=\"originlabel-upload\">\r\n                    \u003cIconUpload size={11} /> 사진 선택 (자동 압축)\r\n                    \u003cinput type=\"file\" accept=\"image/jpeg,image/png,image/webp\" multiple\r\n                      onChange={(e) => { addOriginLabelRegisterImages(e.target.files); e.target.value = \"\"; }} />\r\n                  \u003c/label>\r\n                  \u003cspan className=\"originlabel-count\">{originLabelRegisterImages.length}/6장 · 자동 압축 후 파일당 5MB 이하\u003c/span>\r\n                \u003c/div>\r\n                {originLabelRegisterLoading && \u003cp className=\"field-hint\">자료를 불러오는 중입니다.\u003c/p>}\r\n                {originLabelRegisterError && \u003cp className=\"field-hint\" style={{ color: \"#c0392b\" }}>{originLabelRegisterError}\u003c/p>}\r\n                {originLabelRegisterImages.length > 0 && (\r\n                  \u003cdiv className=\"originlabel-library-preview\">\r\n                    {originLabelRegisterImages.map(img => (\r\n                      \u003cbutton key={img.id} type=\"button\" className=\"originlabel-image\" style={{ width: 54, height: 42, aspectRatio: \"auto\", padding: 0 }} onClick={() => removeOriginLabelRegisterImage(img.id)} title=\"클릭하면 삭제됩니다\">\r\n                        \u003cimg src={img.src} alt={img.name} />\r\n                      \u003c/button>\r\n                    ))}\r\n                  \u003c/div>\r\n                )}\r\n              \u003c/section>\r\n\r\n              \u003csection>\r\n                \u003cspan className=\"label-eyebrow\">제품명 검색\u003c/span>\r\n                \u003cinput\r\n                  className=\"originlabel-search\"\r\n                  value={originLabelSearch}\r\n                  onChange={(e) => setOriginLabelSearch(e.target.value)}\r\n                  placeholder=\"제품명 또는 원산지 텍스트 검색\"\r\n                />\r\n              \u003c/section>\r\n\r\n              {productsLoading ? (\r\n                \u003cdiv className=\"queue-empty\">\r\n                  \u003cIconRefresh size={24} className=\"spin\" style={{ opacity: .3 }} />\r\n                  \u003cp className=\"t1\">불러오는 중...\u003c/p>\r\n                \u003c/div>\r\n              ) : productsError ? (\r\n                \u003cdiv className=\"originlabel-empty\">\r\n                  \u003cdiv>\r\n                    \u003cp className=\"t1\">제품 DB를 불러오지 못했습니다\u003c/p>\r\n                    \u003cp className=\"t2\">{productsError}\u003c/p>\r\n                  \u003c/div>\r\n                \u003c/div>\r\n              ) : filteredOriginLabelProducts.length === 0 ? (\r\n                \u003cdiv className=\"originlabel-empty\">\r\n                  \u003cdiv>\r\n                    \u003cp className=\"t1\">검색된 제품이 없습니다\u003c/p>\r\n                    \u003cp className=\"t2\">제품명 또는 원산지 텍스트를 다시 확인해주세요.\u003c/p>\r\n                  \u003c/div>\r\n                \u003c/div>\r\n              ) : (\r\n                \u003cdiv className=\"originlabel-card-list\">\r\n                  {filteredOriginLabelProducts.map(product => {\r\n                    const card = productToOriginLabelCard(product);\r\n                    const alreadyAdded = originLabelItems.some(item => item.card.id === card.id);\r\n                    return (\r\n                      \u003cdiv key={card.id} className=\"originlabel-saved-card\">\r\n                        \u003cdiv className=\"originlabel-saved-info\">\r\n                          \u003cp className=\"originlabel-saved-name\">{card.name}\u003c/p>\r\n                          \u003cp className=\"originlabel-saved-meta\">{card.origin || \"원산지 없음\"}\u003c/p>\r\n                        \u003c/div>\r\n                        \u003cbutton className=\"originlabel-add-btn\" disabled={alreadyAdded} onClick={() => addOriginLabelProduct(product)}>\r\n                          \u003cIconPlus size={10} /> {alreadyAdded ? \"추가됨\" : \"추가\"}\r\n                        \u003c/button>\r\n                      \u003c/div>\r\n                    );\r\n                  })}\r\n                \u003c/div>\r\n              )}\r\n            \u003c/aside>\r\n\r\n            \u003cmain className=\"originlabel-main\">\r\n              \u003cdiv className=\"originlabel-toolbar\">\r\n                \u003cdiv>\r\n                  \u003cp className=\"originlabel-title\">원라벨 목록\u003c/p>\r\n                  \u003cp className=\"originlabel-sub\">제품 DB에서 선택한 쇼카드에 같은 원산지 텍스트의 이미지 자료를 붙여 A4로 저장합니다.\u003c/p>\r\n                \u003c/div>\r\n                {originLabelItems.length > 0 && (\r\n                  \u003cbutton className=\"queue-clear\" onClick={() => setOriginLabelItems([])}>전체 삭제\u003c/button>\r\n                )}\r\n              \u003c/div>\r\n\r\n              {originLabelItems.length === 0 ? (\r\n                \u003cdiv className=\"originlabel-empty\">\r\n                  \u003cdiv>\r\n                    \u003cp className=\"t1\">원라벨 목록이 비어있습니다\u003c/p>\r\n                    \u003cp className=\"t2\">왼쪽에서 제품을 검색해 추가하거나, 원산지 이미지 자료를 먼저 등록해주세요.\u003c/p>\r\n                  \u003c/div>\r\n                \u003c/div>\r\n              ) : (\r\n                \u003cdiv className=\"originlabel-list\">\r\n                  {originLabelItems.map(item => (\r\n                    \u003cdiv key={item.id} className=\"originlabel-item\">\r\n                      \u003cdiv className=\"originlabel-item-head\">\r\n                        \u003cdiv className=\"originlabel-item-info\">\r\n                          \u003cp className=\"originlabel-item-name\">{item.card.name}\u003c/p>\r\n                          \u003cp className=\"originlabel-item-origin\">{item.card.origin || \"원산지 없음\"}\u003c/p>\r\n                          {(item.variantOptions || []).length > 1 && (\r\n                            \u003cdiv className=\"originlabel-variant-row\">\r\n                              \u003cselect\r\n                                className=\"originlabel-variant-select\"\r\n                                value={item.selectedOriginLabelKey || \"\"}\r\n                                onChange={(e) => applyOriginLabelVariant(item.id, e.target.value)}\r\n                                title=\"원라벨 이미지 선택\"\r\n                              >\r\n                                {(item.variantOptions || []).map(option => (\r\n                                  \u003coption key={option.key} value={option.key}>\r\n                                    {option.origin} / {originLabelVariantLabel(option)}\r\n                                  \u003c/option>\r\n                                ))}\r\n                              \u003c/select>\r\n                              \u003cbutton\r\n                                type=\"button\"\r\n                                className=\"originlabel-save-btn\"\r\n                                disabled={item.selectionSaving}\r\n                                onClick={() => saveOriginLabelSelection(item.id)}\r\n                              >\r\n                                {item.selectionSaving ? \"저장중\" : item.selectionSaved ? \"저장됨\" : \"저장\"}\r\n                              \u003c/button>\r\n                              {item.selectionError && \u003cspan className=\"field-hint\" style={{ color: \"#c0392b\", margin: 0 }}>{item.selectionError}\u003c/span>}\r\n                            \u003c/div>\r\n                          )}\r\n                        \u003c/div>\r\n                        \u003cdiv className=\"originlabel-actions\">\r\n                          \u003cspan className=\"originlabel-count\">{(item.images || []).length}/6장\u003c/span>\r\n                          \u003cbutton className=\"queue-del\" onClick={() => removeOriginLabelItem(item.id)}>\r\n                            \u003cIconTrash size={13} />\r\n                          \u003c/button>\r\n                        \u003c/div>\r\n                      \u003c/div>\r\n\r\n                      \u003cdiv className=\"originlabel-preview\">\r\n                        \u003cp className=\"originlabel-preview-title\">기본 쇼카드\u003c/p>\r\n                        \u003cdiv className=\"originlabel-showcard-preview\">\r\n                          \u003cShowCard card={item.card} settings={settings} designs={designs} scale={SCREEN_SCALE * 0.42} />\r\n                        \u003c/div>\r\n                      \u003c/div>\r\n\r\n                      {item.imageLoading && (\r\n                        \u003cp className=\"field-hint\">저장된 원산지 이미지를 불러오는 중입니다.\u003c/p>\r\n                      )}\r\n\r\n                      {item.imageError && (\r\n                        \u003cp className=\"field-hint\" style={{ color: \"#c0392b\" }}>{item.imageError}\u003c/p>\r\n                      )}\r\n\r\n                      {(item.images || []).length > 0 && (\r\n                        \u003cdiv className=\"originlabel-images\">\r\n                          {(item.images || []).map(img => (\r\n                            \u003cdiv key={img.id} className=\"originlabel-image\">\r\n                              \u003cimg src={img.src} alt={img.name} />\r\n                            \u003c/div>\r\n                          ))}\r\n                        \u003c/div>\r\n                      )}\r\n\r\n                      \u003cdiv className=\"originlabel-preview\">\r\n                        \u003cp className=\"originlabel-preview-title\">A4 미리보기\u003c/p>\r\n                        \u003cOriginLabelMiniSheet item={item} settings={settings} designs={designs} />\r\n                      \u003c/div>\r\n\r\n                      {(item.images || []).length === 0 && !item.imageLoading && (\r\n                        \u003cp className=\"field-hint\">같은 원산지 텍스트로 등록된 이미지 자료가 아직 없습니다.\u003c/p>\r\n                      )}\r\n                    \u003c/div>\r\n                  ))}\r\n                \u003c/div>\r\n              )}\r\n            \u003c/main>\r\n          \u003c/div>\r\n        )}\r\n\r\n        {mainTab === \"manage\" && (\r\n          \u003cManageTab settings={settings} setSettings={setSettings} designs={designs} setDesigns={setDesigns}\r\n            onSave={saveManageChanges} saving={manageSaving} savedAt={manageSavedAt} error={manageError} loaded={manageLoaded}\r\n            reloadProducts={loadProducts} reloadOrigins={loadOrigins} />\r\n        )}\r\n      \u003c/div>\r\n    \u003c/div>\r\n  );\r\n}\r\n\r\nReactDOM.createRoot(document.getElementById(\"root\")).render(\u003cApp />);\r\n\u003c/script>\r\n\u003c/body>\r\n\u003c/html>\r\n"}</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
const sources=JSON.parse(document.getElementById('app-sources').textContent);
const scrollContainer=document.getElementById('scroll-container');
const navBtns=[...document.querySelectorAll('.nav-btn')];
const views=[...document.querySelectorAll('.spa-page')];
const pageTitle=document.getElementById('page-title');
const sidebar=document.getElementById('sidebar');
const overlay=document.getElementById('sidebar-overlay');
const mobileMenuBtn=document.getElementById('mobile-menu-btn');
// Visual preview only: no login or privileged write is granted by this flag.
// Replace this with verified admin claims when authentication is implemented.
let adminPreview=false;
document.getElementById('admin-category').hidden=!adminPreview;
let overlayTimer;
const titles={'view-dashboard':'홈','view-order':'제품 발주표','view-newprod':'신제품 등록','view-production':'생산 일지','view-origin':'원산지(원라벨관리)','view-showcard':'쇼카드','view-schedule':'스케줄 매니저','view-docs':'직원 연락처 및 서류','view-admin':'Firebase 연동','view-accounts':'아이디 · 권한 관리'};
function toggleMobileSidebar(show){
 const wasOpen=mobileMenuBtn.getAttribute('aria-expanded')==='true';
 if(wasOpen===show)return;
 sidebar.classList.toggle('is-open',show);
 sidebar.inert=!show;
 sidebar.setAttribute('aria-hidden',String(!show));
 mobileMenuBtn.setAttribute('aria-expanded',String(show));
 mobileMenuBtn.setAttribute('aria-label',show?'메뉴 닫기':'메뉴 열기');
 mobileMenuBtn.querySelector('path').setAttribute('d',show?'M6 6l12 12M6 18L18 6':'M4 6h16M4 12h16M4 18h16');
 overlay.classList.toggle('is-open',show);
 scrollContainer.inert=show;
 if(!show&&sidebar.contains(document.activeElement))mobileMenuBtn.focus();
}
sidebar.inert=true;
sidebar.setAttribute('aria-hidden','true');
document.addEventListener('keydown',event=>{
 if(event.key!=='Tab'||mobileMenuBtn.getAttribute('aria-expanded')!=='true')return;
 const nodes=[mobileMenuBtn,...sidebar.querySelectorAll('button:not([disabled]),a[href]')].filter(el=>el.getClientRects().length);
 const index=nodes.indexOf(document.activeElement);
 event.preventDefault();
 nodes[(index+(event.shiftKey?-1:1)+nodes.length)%nodes.length].focus();
});
sidebar.querySelectorAll('a[href],button[data-external]').forEach(el=>el.addEventListener('click',()=>toggleMobileSidebar(false)));
function activeNav(target){
 navBtns.forEach(btn=>{
 const active=btn.dataset.target===target;
 ['bg-gray-900','text-white','dark:bg-white','dark:text-black'].forEach(c=>btn.classList.toggle(c,active));
 ['text-gray-600','dark:text-gray-400'].forEach(c=>btn.classList.toggle(c,!active));
 if(active)btn.setAttribute('aria-current','page');else btn.removeAttribute('aria-current');
 });
}
function loadApp(viewId){
 const frame=document.querySelector('#'+viewId+' iframe');
 if(!frame||frame.dataset.loaded)return;
 let source=sources[frame.dataset.app];
 if(frame.dataset.app==='showcard'){
 const mode=frame.dataset.mode;
 source=source.replace('useState("print")','useState('+JSON.stringify(mode)+')');
 const hiddenMode=mode==='origin-label'?'print':'origin-label';
 const escaped=hiddenMode.replace(/[.*+?^$\{\}()|[\]\\]/g,'\\$&');
 source=source.replace(new RegExp('<button className=\\{[^\\n]*onClick=\\{\\(\\) => setMainTab\\("'+escaped+'"\\)\\}>[\\s\\S]*?<\\/button>'),'');
 if(mode==='origin-label')source=source.replace('쇼카드 출력 시스템','원산지(원라벨관리)');
 }
 source=source.replace('</head>','<style>@media screen{html[data-portal-theme="dark"]{color-scheme:dark;--background:#20251f;--foreground:#f3f3ed;--card:#30362e;--card-foreground:#f3f3ed;--primary:#91bac9;--primary-foreground:#14262d;--secondary:#373e34;--secondary-foreground:#f3f3ed;--muted:#373e34;--muted-foreground:#b9bbb3;--border:#525b4c;--input-background:#282e25;--placeholder:#89917f}html[data-portal-theme="light"]{color-scheme:light}}</style></head>');
 source=source.replace(/<html\b/,'<html data-portal-theme="'+(HareTheme.isDark()?'dark':'light')+'"');
 frame.addEventListener('load',syncThemeUI);
 frame.srcdoc=source;
 frame.dataset.loaded='true';
}
function navigate(target,type='spa'){
 const viewId=type==='scroll'?'view-dashboard':target;
 if(!document.getElementById(viewId))return;
 if(!HareAdmin.canView(viewId)){if(!HareAdmin.currentUser())HareAdmin.open();else alert('이 화면을 사용할 권한이 없습니다. 관리자에게 화면 권한을 요청해주세요.');return;}
 if(window.HareUnified&&!HareUnified.canLeave())return;
 views.forEach(v=>v.classList.toggle('active',v.id===viewId));
 pageTitle.textContent=titles[viewId]||'홈';
 activeNav(target);
 loadApp(viewId);
 window.HareUnified?.render(viewId);
 HareAdmin.render(viewId);
 scrollContainer.scrollTop=0;
 toggleMobileSidebar(false);
 if(type==='scroll')requestAnimationFrame(()=>document.getElementById(target)?.scrollIntoView({behavior:'smooth',block:'start'}));
}
navBtns.forEach(btn=>btn.addEventListener('click',()=>navigate(btn.dataset.target,btn.dataset.type)));
document.querySelectorAll('[data-open]').forEach(btn=>btn.addEventListener('click',()=>navigate(btn.dataset.open)));
document.getElementById('home-btn').addEventListener('click',()=>navigate('view-dashboard'));
const adminLoginBtn=document.getElementById('admin-login-btn');
const loginDialog=document.getElementById('admin-login-dialog');
function closeLogin(){loginDialog.classList.add('hidden');loginDialog.classList.remove('flex');adminLoginBtn.focus()}
adminLoginBtn.addEventListener('click',()=>HareAdmin.open());
document.getElementById('admin-login-close').addEventListener('click',closeLogin);
loginDialog.addEventListener('click',event=>{if(event.target===loginDialog)closeLogin()});
function syncAccess(){
 adminPreview=HareAdmin.isLoggedIn();
 const category=document.getElementById('admin-category');category.hidden=!adminPreview;category.dataset.accessHidden=String(!adminPreview);
 const u=HareAdmin.currentUser();adminLoginBtn.textContent=u?u.name+' · 로그아웃':'로그인';
 document.querySelectorAll('[data-target],[data-open]').forEach(el=>{const id=el.dataset.target||el.dataset.open;if(!id?.startsWith('view-'))return;const allowed=['view-order','view-newprod','view-production','view-origin'].includes(id)||HareAdmin.canView(id);el.hidden=!allowed;el.dataset.accessHidden=String(!allowed);});
 const active=document.querySelector('.spa-page.active');
 if(active&&!HareAdmin.canView(active.id)){
  views.forEach(v=>v.classList.toggle('active',v.id==='view-dashboard'));pageTitle.textContent='홈';activeNav('view-dashboard');
 }
 ['view-accounts','view-admin'].forEach(id=>{if(!adminPreview)document.getElementById(id).innerHTML='';});
 window.HareUnified?.home();
}
window.addEventListener('hare-admin-change',syncAccess);
syncAccess();
mobileMenuBtn.addEventListener('click',()=>toggleMobileSidebar(mobileMenuBtn.getAttribute('aria-expanded')!=='true'));
overlay.addEventListener('click',()=>toggleMobileSidebar(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!loginDialog.classList.contains('hidden'))closeLogin();else if(mobileMenuBtn.getAttribute('aria-expanded')==='true')toggleMobileSidebar(false)}});
function syncThemeUI(){
 document.querySelectorAll('#theme-switcher [data-theme-mode]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.themeMode===HareTheme.getMode())));
 document.querySelectorAll('iframe[data-app]').forEach(frame=>{try{frame.contentDocument.documentElement.dataset.portalTheme=HareTheme.isDark()?'dark':'light';}catch{}});
}
document.querySelectorAll('#theme-switcher [data-theme-mode]').forEach(btn=>btn.addEventListener('click',()=>HareTheme.setMode(btn.dataset.themeMode)));
window.addEventListener('hare-theme-change',syncThemeUI);
HareTheme.refresh();
syncThemeUI();
window.HareUnified?.home();
document.querySelectorAll('[data-external]').forEach(btn=>btn.addEventListener('click',()=>{
 const key='harehare-link-'+btn.dataset.external;
 let url='';try{url=localStorage.getItem(key)||''}catch{}
 if(!url){url=prompt(btn.textContent.trim()+' 사이트 주소를 입력해주세요.','https://');if(!url)return;
 try{const parsed=new URL(url);if(!['https:','http:'].includes(parsed.protocol))throw new Error();url=parsed.href}catch{alert('올바른 http 또는 https 주소를 입력해주세요.');return}
 try{localStorage.setItem(key,url)}catch{}
 }
 window.open(url,'_blank','noopener,noreferrer');
 if(window.innerWidth<1024)toggleMobileSidebar(false);
}));
});
</script>
</body>
</html>
