bar-thumb{background:#c8c8c8;border-radius:6px}\n\n@media(max-width:900px){\n  header{min-height:64px;height:auto;padding:10px 14px;gap:8px}\n  .header-nav{order:3;width:100%;display:grid;grid-template-columns:repeat(3,1fr);margin:2px 0 0}\n  .hbtn{padding:8px 6px;text-align:center}\n  main{padding:22px 14px 42px}\n  .page-heading{margin-bottom:18px}\n  .page-heading h1{font-size:26px}\n  .form-layout{grid-template-columns:1fr}\n  .form-layout>div:last-child{position:static}\n  .history-toolbar{grid-template-columns:1fr 1fr;padding:14px}\n  .history-toolbar .section-title,.history-toolbar .history-search-wrap{grid-column:1/-1}\n  .history-actions{grid-column:1/-1;justify-content:flex-start}\n}\n@media(max-width:600px){\n  header{padding:9px 10px}\n  .logo{font-size:15px}\n  .sync-label{font-size:11px}\n  main{padding:16px 10px 36px}\n  .page-heading{align-items:flex-start;flex-direction:column}\n  .page-heading h1{font-size:24px}\n  .page-heading p{font-size:13px}\n  .card,.cost-panel{padding:16px;margin-bottom:12px;border-radius:20px}\n  .card-header{gap:8px;margin-bottom:14px;padding-bottom:12px}\n  .card-title{font-size:15px}\n  .section-index{width:24px;height:24px;margin-right:7px}\n  .store-grid,.allergen-grid{grid-template-columns:repeat(2,minmax(0,1fr))}\n  .stag,.atag{min-height:42px}\n  .origin-row{grid-template-columns:42px minmax(0,1fr)}\n  .origin-img-slot{width:76px;height:76px}\n  .history-toolbar{grid-template-columns:1fr;padding:12px;border-radius:20px}\n  .history-toolbar>*{grid-column:1!important}\n  .history-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));width:100%}\n  .history-actions #historyCount{grid-column:1/-1}\n  .history-card{border-radius:20px}\n  #registerBtn{position:sticky;bottom:10px;z-index:30;box-shadow:0 10px 28px rgba(0,0,0,.18)}\n  #tc{left:10px;right:10px;bottom:10px}\n  .toast{width:100%}\n}\n@media(prefers-reduced-motion:reduce){\n  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}\n}\n@media(prefers-reduced-transparency:reduce){\n  header,.modal-overlay,.admin-modal-overlay{backdrop-filter:none}\n  header{background:#fff}\n}\n@media(prefers-contrast:more){\n  .card,.cost-panel,.history-toolbar,.history-table-wrap,input,select,textarea{border-color:#737373}\n}\n\n/* 원산지 변경 공지 전광판 */\n.origin-notice{display:flex;align-items:center;gap:12px;overflow:hidden;background:#2f271e;color:#fff;border-radius:9px;margin:0 0 16px;padding:11px 14px;min-height:42px}\n.origin-notice-label{flex:0 0 auto;font-size:11px;font-weight:800;letter-spacing:.04em;color:#f5c56b}\n.origin-notice-viewport{overflow:hidden;min-width:0;flex:1;mask-image:linear-gradient(90deg,transparent,#000 3%,#000 97%,transparent)}\n.origin-notice-track{display:flex;width:max-content;animation:originNoticeMarquee var(--notice-duration,32s) linear infinite}\n.origin-notice-group{display:flex;align-items:center;flex-shrink:0;white-space:nowrap}\n.origin-notice-item{font-size:12px;font-weight:600;padding-right:46px}\n.origin-notice-item::after{content:\"✦\";color:#f5c56b;margin-left:46px}\n.origin-notice:hover .origin-notice-track{animation-play-state:paused}\n.origin-notice.empty .origin-notice-track{animation:none;width:100%}\n.origin-notice.empty .origin-notice-group[aria-hidden=\"true\"]{display:none}\n.origin-notice.empty .origin-notice-item{padding:0;color:rgba(255,255,255,.72);font-weight:500}\n.origin-notice.empty .origin-notice-item::after{display:none}\n@keyframes originNoticeMarquee{to{transform:translateX(-50%)}}\n.notice-admin-list{display:grid;gap:8px;margin-top:14px}\n.notice-admin-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}\n.notice-admin-copy{min-width:0;font-size:12px;line-height:1.6;color:var(--text2)}\n.notice-admin-copy strong{color:var(--text)}\n@media(prefers-reduced-motion:reduce){.origin-notice-track{animation:none!important}}\n\u003c/style>\n\n\u003c/head>\n\u003cbody>\n\n\u003cheader>\n  \u003cdiv class=\"logo\">신제품 등록 관리\u003cspan class=\"logo-sub\">전 지점 상품 정보와 알레르기 자료를 한 번에 관리합니다\u003c/span>\u003c/div>\n  \u003cnav class=\"header-nav\">\n    \u003cbutton class=\"hbtn active\" onclick=\"showPage('register')\">신제품 등록\u003c/button>\n    \u003cbutton class=\"hbtn\" onclick=\"showPage('history')\">등록 이력\u003c/button>\n    \u003cbutton class=\"hbtn\" onclick=\"showPage('settings')\">설정\u003c/button>\n  \u003c/nav>\n  \u003cdiv style=\"display:flex;align-items:center;gap:6px;margin-left:auto\">\n    \u003cdiv class=\"sync-dot\" id=\"syncDot\">\u003c/div>\n    \u003cspan class=\"sync-label\" id=\"syncLabel\">연결 중...\u003c/span>\n  \u003c/div>\n\u003c/header>\n\n\u003cdiv id=\"tc\">\u003c/div>\n\n\u003cmain>\n\u003cdiv id=\"page-register\" class=\"page active\">\n  \u003cdiv class=\"page-heading\">\n    \u003cdiv>\n      \u003ch1>신제품 등록\u003c/h1>\n      \u003cp>제품 정보 입력부터 원산지·알레르기 확인까지 순서대로 작성하세요.\u003c/p>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"form-layout\">\n    \u003cdiv>\n      \u003cdiv class=\"card\">\n        \u003cdiv class=\"card-header\">\n          \u003cdiv class=\"card-title\">\u003cspan class=\"section-index\">01\u003c/span>기본 정보\u003cspan class=\"card-badge\">필수\u003c/span>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"input-row\">\n          \u003cdiv class=\"fg\">\n            \u003clabel>제품이름 \u003cspan class=\"required\">*\u003c/span>\u003cspan style=\"font-size:10px;color:var(--text3);margin-left:4px\">매장 판매 제품과 동일하게 작성\u003c/span>\u003c/label>\n            \u003cinput type=\"text\" id=\"fName\" placeholder=\"예) 크림치즈베이글\" oninput=\"updatePreview()\">\n          \u003c/div>\n          \u003cdiv class=\"fg\">\n            \u003clabel>카테고리 \u003cspan class=\"required\">*\u003c/span>\u003c/label>\n            \u003cselect id=\"fCat\" onchange=\"updatePreview()\">\n              \u003coption value=\"식빵/발효빵/식사빵\">식빵/발효빵/식사빵\u003c/option>\n              \u003coption value=\"일반빵\" selected>일반빵\u003c/option>\n              \u003coption value=\"케이크/롤/파운드\">케이크/롤/파운드\u003c/option>\n              \u003coption value=\"쿠키/정과\">쿠키/정과\u003c/option>\n              \u003coption value=\"샌드위치/마카롱/초콜릿/잼/냉장\">샌드위치/마카롱/초콜릿/잼/냉장\u003c/option>\n              \u003coption value=\"시즌\">시즌\u003c/option>\n            \u003c/select>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"fg\">\n          \u003clabel>판매 금액 \u003cspan class=\"required\">*\u003c/span>\u003c/label>\n          \u003cdiv class=\"price-wrap\">\n            \u003cspan class=\"price-prefix\">₩\u003c/span>\n            \u003cinput type=\"number\" id=\"fPrice\" placeholder=\"0\" min=\"0\" step=\"100\" oninput=\"updatePreview()\">\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"fg\">\n          \u003clabel>판매 점포 \u003cspan style=\"font-size:10px;color:var(--text3)\">(선택 · 복수 선택 가능)\u003c/span>\u003c/label>\n          \u003cdiv class=\"store-grid\" id=\"storeGrid\">\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"fg\">\n          \u003clabel>비고 \u003cspan style=\"font-size:10px;color:var(--text3)\">(선택)\u003c/span>\u003c/label>\n          \u003ctextarea id=\"fNote\" rows=\"2\" placeholder=\"특이사항, 보관방법 등...\">\u003c/textarea>\n        \u003c/div>\n      \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"card-header\">\n      \u003cdiv class=\"card-title\">\u003cspan class=\"section-index\">02\u003c/span>원산지 정보\u003cspan class=\"card-badge\">필수\u003c/span>\u003cspan class=\"card-badge\">배합표 기준 3순위\u003c/span>\u003c/div>\n      \u003cspan style=\"font-size:11px;color:var(--text3)\" class=\"hide-mobile\">갤러리아점 기준\u003c/span>\n    \u003c/div>\n\u003cdiv class=\"origin-notice empty\" id=\"originNotice\" role=\"region\" aria-label=\"원산지 변경 공지\">\n  \u003cspan class=\"origin-notice-label\">원산지 변경 안내\u003c/span>\n  \u003cdiv class=\"origin-notice-viewport\">\u003cdiv class=\"origin-notice-track\" id=\"originNoticeTrack\">\n    \u003cdiv class=\"origin-notice-group\">\u003cspan class=\"origin-notice-item\">현재 등록된 원산지 변경 공지가 없습니다.\u003c/span>\u003c/div>\n    \u003cdiv class=\"origin-notice-group\" aria-hidden=\"true\">\u003cspan class=\"origin-notice-item\">현재 등록된 원산지 변경 공지가 없습니다.\u003c/span>\u003c/div>\n  \u003c/div>\u003c/div>\n\u003c/div>\n    \u003cdiv class=\"origin-rows\">\n      \u003cdiv class=\"origin-row\">\n        \u003cspan class=\"origin-rank\">1순위\u003cspan class=\"required\" style=\"font-size:10px\">*\u003c/span>\u003c/span>\n        \u003cdiv class=\"fg origin-combo\" style=\"margin:0\">\n          \u003cinput type=\"text\" id=\"origin1-text\" placeholder=\"예: 밀가루(밀:미국,캐나다산)\" autocomplete=\"off\"\n            oninput=\"handleRegistrationOriginInput('origin1-text')\"\n            onfocus=\"openOriginPanel('origin1-text')\" onblur=\"scheduleCloseOriginPanel('origin1-text')\">\n          \u003cdiv class=\"origin-panel\" id=\"origin1-text-panel\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"origin-row\">\n        \u003cspan class=\"origin-rank\">2순위\u003cspan class=\"required\" style=\"font-size:10px\">*\u003c/span>\u003c/span>\n        \u003cdiv class=\"fg origin-combo\" style=\"margin:0\">\n          \u003cinput type=\"text\" id=\"origin2-text\" placeholder=\"예: 설탕(원료당:호주산)\" autocomplete=\"off\"\n            oninput=\"handleRegistrationOriginInput('origin2-text')\"\n            onfocus=\"openOriginPanel('origin2-text')\" onblur=\"scheduleCloseOriginPanel('origin2-text')\">\n          \u003cdiv class=\"origin-panel\" id=\"origin2-text-panel\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"origin-row\">\n        \u003cspan class=\"origin-rank\">3순위\u003cspan class=\"required\" style=\"font-size:10px\">*\u003c/span>\u003c/span>\n        \u003cdiv class=\"fg origin-combo\" style=\"margin:0\">\n          \u003cinput type=\"text\" id=\"origin3-text\" placeholder=\"예: 버터(우유:국산)\" autocomplete=\"off\"\n            oninput=\"handleRegistrationOriginInput('origin3-text')\"\n            onfocus=\"openOriginPanel('origin3-text')\" onblur=\"scheduleCloseOriginPanel('origin3-text')\">\n          \u003cdiv class=\"origin-panel\" id=\"origin3-text-panel\">\u003c/div>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv style=\"margin-top:14px\">\n      \u003clabel style=\"display:flex;align-items:center;gap:0\">원산지 증빙 이미지 첨부 \u003cspan style=\"font-size:10px;color:var(--text3);margin-left:4px\">(최대 3개 · JPG/PNG/WEBP · 자동 압축 후 파일당 5MB 이하)\u003c/span>\n        \u003cspan class=\"tip-wrap\" id=\"originImgTipWrap\">\n          \u003cspan class=\"tip-icon\">?\u003c/span>\n          \u003cspan class=\"tip-box\" id=\"originImgTipBox\">\n            \u003cstrong>원산지 증빙 이미지\u003c/strong>\u003cbr>\n            납품서, 원산지 확인서 등\u003cbr>원산지를 증빙할 수 있는 서류를 사진으로 첨부하세요.\u003cbr>\n            \u003cspan class=\"tip-ex\" id=\"originGuideImgsArea\" style=\"display:none;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1)\">\n              \u003cdiv style=\"color:#aaa;font-size:11px;margin-bottom:6px\">📎 가이드 이미지\u003c/div>\n              \u003cdiv id=\"originGuideImgList\" style=\"display:flex;flex-direction:column;gap:6px\">\u003c/div>\n            \u003c/span>\n          \u003c/span>\n        \u003c/span>\n      \u003c/label>\n      \u003cdiv class=\"origin-images-wrap\">\n        \u003cdiv class=\"origin-img-slot\" id=\"imgSlot0\" onclick=\"triggerImgInput(0)\">\n          \u003cspan style=\"font-size:18px;margin-bottom:2px\">📷\u003c/span>\u003cspan>이미지 1\u003c/span>\u003cspan style=\"font-size:9px\">자동 압축 · 5MB 이하\u003c/span>\n          \u003cinput type=\"file\" accept=\"image/jpeg,image/png,image/webp\" id=\"imgInput0\" onchange=\"handleOriginImg(0,this)\" style=\"display:none\" onclick=\"event.stopPropagation()\">\n        \u003c/div>\n        \u003cdiv class=\"origin-img-slot\" id=\"imgSlot1\" onclick=\"triggerImgInput(1)\">\n          \u003cspan style=\"font-size:18px;margin-bottom:2px\">📷\u003c/span>\u003cspan>이미지 2\u003c/span>\u003cspan style=\"font-size:9px\">자동 압축 · 5MB 이하\u003c/span>\n          \u003cinput type=\"file\" accept=\"image/jpeg,image/png,image/webp\" id=\"imgInput1\" onchange=\"handleOriginImg(1,this)\" style=\"display:none\" onclick=\"event.stopPropagation()\">\n        \u003c/div>\n        \u003cdiv class=\"origin-img-slot\" id=\"imgSlot2\" onclick=\"triggerImgInput(2)\">\n          \u003cspan style=\"font-size:18px;margin-bottom:2px\">📷\u003c/span>\u003cspan>이미지 3\u003c/span>\u003cspan style=\"font-size:9px\">자동 압축 · 5MB 이하\u003c/span>\n          \u003cinput type=\"file\" accept=\"image/jpeg,image/png,image/webp\" id=\"imgInput2\" onchange=\"handleOriginImg(2,this)\" style=\"display:none\" onclick=\"event.stopPropagation()\">\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"card-header\">\n      \u003cdiv class=\"card-title\">\u003cspan class=\"section-index\">03\u003c/span>알레르기 유발물질\u003cspan class=\"card-badge\">필수\u003c/span>\u003cspan class=\"card-badge new-badge\">중복 선택 가능\u003c/span>\u003c/div>\n      \u003cbutton class=\"btn btn-ghost btn-sm\" onclick=\"clearAllergens()\">전체 해제\u003c/button>\n    \u003c/div>\n    \u003cdiv id=\"allergenRequiredMsg\" style=\"display:none;font-size:11px;color:var(--danger);background:rgba(192,57,43,.06);border:1px solid rgba(192,57,43,.15);border-radius:6px;padding:7px 10px;margin-bottom:10px;font-weight:500\">\n      ⚠️ 알레르기 유발물질을 선택하거나, 해당 없음을 확인해주세요\n    \u003c/div>\n    \u003cdiv style=\"font-size:11px;color:var(--text3);background:var(--surface2);border-radius:6px;padding:7px 10px;margin-bottom:10px\">\n      해당 알레르기가 없는 경우 아무것도 선택하지 않고 등록하세요 (자동으로 \"없음\"으로 처리됩니다)\n    \u003c/div>\n    \u003c!-- 알레르기 체크 가이드 이미지 영역 -->\n    \u003cdiv id=\"allergenGuideImgsArea\" style=\"display:none;margin-bottom:12px\">\n      \u003cdiv style=\"font-size:11px;font-weight:700;color:var(--danger);margin-bottom:7px;display:flex;align-items:center;gap:5px\">🌾 알레르기 체크 가이드\u003c/div>\n      \u003cdiv id=\"allergenGuideImgList\" style=\"display:flex;gap:8px;flex-wrap:wrap\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"allergen-grid\" id=\"allergenGrid\">\u003c/div>\n    \u003cdiv style=\"margin-top:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px\">\n      \u003cdiv style=\"font-size:12px;color:var(--text2)\">\n        선택됨: \u003cspan id=\"allergenCount\" style=\"color:var(--accent);font-weight:700;font-family:var(--mono)\">0\u003c/span>개\n      \u003c/div>\n      \u003cdiv class=\"custom-checkbox-wrap\" id=\"allergenConfirmWrap\" onclick=\"toggleAllergenConfirm()\">\n        \u003cinput type=\"checkbox\" id=\"allergenConfirm\" style=\"display:none\">\n        \u003cdiv class=\"custom-checkbox-box\">\u003cspan class=\"custom-checkbox-checkmark\">✓\u003c/span>\u003c/div>\n        \u003cspan class=\"custom-checkbox-label\">확인 완료 (알레르기 없음 포함)\u003c/span>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\">\n    \u003cdiv class=\"card-header\">\n      \u003cdiv class=\"card-title\">\u003cspan class=\"section-index\">04\u003c/span>배합표 입력\u003cspan class=\"card-badge\">원가 자동 계산\u003c/span>\u003c/div>\n      \u003cbutton class=\"btn btn-secondary btn-sm\" onclick=\"addIngRow()\">+ 재료 추가\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"input-row\" style=\"margin-bottom:14px\">\n      \u003cdiv class=\"fg\" style=\"margin:0\">\n        \u003clabel>생산량 (개)\u003c/label>\n        \u003cinput type=\"number\" id=\"fQty\" value=\"12\" min=\"1\" oninput=\"calcCosts()\">\n      \u003c/div>\n      \u003cdiv class=\"fg\" style=\"margin:0\">\n        \u003clabel style=\"display:flex;align-items:center\">오버헤드 \u003cspan style=\"font-family:var(--mono);font-size:10px;color:var(--accent);margin-left:3px\">%\u003c/span>\n          \u003cspan class=\"tip-wrap\">\u003cspan class=\"tip-icon\">?\u003c/span>\u003cspan class=\"tip-box\">\u003cstrong>오버헤드 (간접비율)\u003c/strong>\u003cbr>재료비 외에 발생하는 \u003cstrong>간접 운영비\u003c/strong>를 재료비에 대한 비율로 입력합니다.\u003cbr>\u003cbr>간접비에 포함되는 항목:\u003cbr>· 인건비 (급여, 4대보험)\u003cbr>· 임대료 · 관리비\u003cbr>· 전기·가스 등 공과금\u003cbr>· 포장재·소모품\u003cbr>· 설비 감가상각비\u003cbr>\u003cbr>\u003cspan class=\"tip-ex\">💡 일반적으로 베이커리는 \u003cstrong style=\"color:#f0c040\">10~20%\u003c/strong>를 적용합니다.\u003c/span>\u003c/span>\u003c/span>\n        \u003c/label>\n        \u003cinput type=\"number\" id=\"fOverhead\" value=\"15\" min=\"0\" max=\"100\" oninput=\"calcCosts()\">\n      \u003c/div>\n      \u003cdiv class=\"fg\" style=\"margin:0\">\n        \u003clabel style=\"display:flex;align-items:center\">목표 마진 \u003cspan style=\"font-family:var(--mono);font-size:10px;color:var(--accent);margin-left:3px\">%\u003c/span>\n          \u003cspan class=\"tip-wrap\">\u003cspan class=\"tip-icon\">?\u003c/span>\u003cspan class=\"tip-box\">\u003cstrong>목표 마진 (판매 이익률)\u003c/strong>\u003cbr>판매가에서 원가가 차지하지 않는 비율입니다.\u003cbr>\u003cbr>계산 공식:\u003cbr>\u003cstrong style=\"color:#f0c040\">판매가 = 원가 ÷ (1 − 마진율)\u003c/strong>\u003cbr>\u003cbr>\u003cspan class=\"tip-ex\">💡 베이커리 권장 마진은 \u003cstrong style=\"color:#f0c040\">30~45%\u003c/strong>입니다.\u003c/span>\u003c/span>\u003c/span>\n        \u003c/label>\n        \u003cinput type=\"number\" id=\"fMargin\" value=\"30\" min=\"0\" max=\"95\" oninput=\"calcCosts()\">\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"ing-wrap\">\n      \u003ctable class=\"ing-table\">\n        \u003cthead>\n          \u003ctr>\n            \u003cth>원재료명\u003c/th>\n            \u003cth>사용량\u003c/th>\n            \u003cth>단위\u003c/th>\n            \u003cth style=\"text-align:right\">\u003cspan class=\"ing-th-full\">단가 (원/kg·L·개)\u003c/span>\u003cspan class=\"ing-th-short\" style=\"display:none\">단가\u003c/span>\u003c/th>\n            \u003cth style=\"text-align:right\">금액\u003c/th>\n            \u003cth>\u003c/th>\n          \u003c/tr>\n        \u003c/thead>\n        \u003ctbody id=\"ingBody\">\u003c/tbody>\n      \u003c/table>\n    \u003c/div>\n    \u003cdiv id=\"ingEmpty\" style=\"text-align:center;padding:20px;color:var(--text3);font-size:12px\">＋ 재료 추가 버튼을 눌러 배합표를 작성하세요\u003c/div>\n    \u003cdiv class=\"total-bar\">\n      \u003cspan class=\"total-label\">재료비 합계\u003c/span>\n      \u003cdiv>\u003cspan class=\"total-val\" id=\"rawTotal\">0\u003c/span> \u003cspan style=\"font-size:11px;color:var(--text2)\">원\u003c/span>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv>\n  \u003cdiv class=\"cost-panel\" style=\"margin-bottom:14px\">\n    \u003cdiv style=\"font-size:15px;font-weight:600;margin-bottom:14px;letter-spacing:-.2px\">원가 요약\u003c/div>\n    \u003cdiv class=\"cost-row\">\u003cspan class=\"crl\">재료비\u003c/span>\u003cspan class=\"crv\" id=\"s-raw\">0원\u003c/span>\u003c/div>\n    \u003cdiv class=\"cost-row\">\u003cspan class=\"crl\">오버헤드 (\u003cspan id=\"s-ohpct\">15\u003c/span>%)\u003c/span>\u003cspan class=\"crv\" id=\"s-oh\">0원\u003c/span>\u003c/div>\n    \u003cdiv class=\"cost-row\">\u003cspan class=\"crl\">총 원가\u003c/span>\u003cspan class=\"crv\" id=\"s-total\">0원\u003c/span>\u003c/div>\n    \u003cdiv class=\"cost-row\">\u003cspan class=\"crl\">개당 원가\u003c/span>\u003cspan class=\"crv\" id=\"s-unit\">0원\u003c/span>\u003c/div>\n    \u003cdiv class=\"cost-row total-row\">\n      \u003cspan class=\"crl\" style=\"font-weight:700;color:var(--text)\">마진 적용 권장 판매가\u003c/span>\n      \u003cspan class=\"crv\" id=\"s-sell\">0원\u003c/span>\n    \u003c/div>\n    \u003cdiv style=\"font-size:10px;color:var(--text3);margin-top:8px;text-align:center\">개당 마진 \u003cspan id=\"s-mpct\">30\u003c/span>% 적용\u003c/div>\n    \u003cdiv class=\"sell-price-box\" id=\"s-final\">₩ 0\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"card\" style=\"margin-bottom:14px\">\n    \u003cdiv class=\"card-header\" style=\"margin-bottom:10px\">\u003cdiv class=\"card-title\" style=\"font-size:14px\">등록 미리보기\u003c/div>\u003c/div>\n    \u003cdiv id=\"preview\" style=\"font-size:12px;line-height:1.8;color:var(--text2)\">\n      \u003cem style=\"color:var(--text3)\">제품 정보 입력 후 자동 표시됩니다\u003c/em>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cbutton class=\"btn btn-primary btn-full\" id=\"registerBtn\" onclick=\"registerProduct()\" disabled style=\"opacity:0.4;cursor:not-allowed\">\n    신제품 등록하기\n  \u003c/button>\n  \u003cdiv id=\"registerBtnHint\" style=\"margin-top:6px;text-align:center;font-size:11px;color:var(--danger);font-weight:500;min-height:16px\">\u003c/div>\n  \u003cdiv style=\"margin-top:4px;text-align:center;font-size:10px;color:var(--text3)\">Firebase에 저장 → index.html 알레르기 리스트 자동 업데이트\u003c/div>\n\u003c/div>\n\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- ═══════════════════════════════════════════════ -->\n\n\u003c!-- PAGE: 등록 이력                                -->\n\n\u003c!-- ═══════════════════════════════════════════════ -->\n\n\u003cdiv id=\"page-history\" class=\"page\">\n  \u003c!-- 헤더 영역 -->\n  \u003cdiv class=\"history-toolbar\">\n    \u003cspan class=\"section-title\" style=\"margin:0;white-space:nowrap\">신제품 등록 이력\u003cspan class=\"section-sub\">Firebase 실시간 동기화\u003c/span>\u003c/span>\n    \u003cdiv class=\"history-search-wrap\">\n      \u003cspan style=\"position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none\">🔍\u003c/span>\n      \u003cinput type=\"text\" id=\"historySearch\" placeholder=\"제품명·카테고리·알레르기·점포 검색...\"\n        style=\"padding-left:34px;font-size:13px\"\n        oninput=\"filterHistory()\">\n    \u003c/div>\n    \u003cselect id=\"historyCategoryFilter\" aria-label=\"등록 이력 카테고리 필터\" onchange=\"filterHistory()\">\n      \u003coption value=\"전체\">전체 카테고리\u003c/option>\n      \u003coption value=\"식빵/발효빵/식사빵\">식빵/발효빵/식사빵\u003c/option>\n      \u003coption value=\"일반빵\">일반빵\u003c/option>\n      \u003coption value=\"케이크/롤/파운드\">케이크/롤/파운드\u003c/option>\n      \u003coption value=\"쿠키/정과\">쿠키/정과\u003c/option>\n      \u003coption value=\"샌드위치/마카롱/초콜릿/잼/냉장\">샌드위치/냉장\u003c/option>\n      \u003coption value=\"시즌\">시즌\u003c/option>\n    \u003c/select>\n    \u003cselect id=\"historyStoreFilter\" aria-label=\"등록 이력 점포 필터\" onchange=\"filterHistory()\">\n      \u003coption value=\"전체\">전체 점포\u003c/option>\n    \u003c/select>\n    \u003cdiv class=\"history-actions\">\n      \u003cspan id=\"historyCount\" style=\"font-size:11px;color:var(--text3);font-family:var(--mono);white-space:nowrap\">\u003c/span>\n      \u003cbutton class=\"btn btn-ghost btn-sm\" onclick=\"clearHistorySearch()\">✕ 초기화\u003c/button>\n      \u003cbutton class=\"btn btn-ghost btn-sm\" onclick=\"loadHistory()\">↻ 새로고침\u003c/button>\n      \u003cbutton class=\"btn btn-sm\" id=\"historyAdminBtn\" style=\"background:var(--surface2);border:1.5px solid var(--border);color:var(--text2)\" onclick=\"toggleHistoryAdminMode()\">🔐 관리자 모드\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- 관리자 모드 인증 패널 -->\n  \u003cdiv id=\"historyAdminPanel\" style=\"display:none;margin-bottom:14px\">\n    \u003cdiv style=\"background:rgba(26,125,68,.06);border:1.5px solid rgba(26,125,68,.3);border-radius:var(--radius);padding:14px 18px\">\n      \u003cdiv id=\"historyAdminLockArea\">\n        \u003cdiv style=\"font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px\">🔑 관리자 비밀번호 확인\u003c/div>\n        \u003cdiv style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap\">\n          \u003cinput type=\"password\" id=\"historyAdminPwInput\" placeholder=\"비밀번호 입력\"\n            style=\"font-size:15px;letter-spacing:3px;max-width:200px;padding:8px 12px\"\n            onkeydown=\"if(event.key==='Enter')checkHistoryAdminPw()\">\n          \u003cbutton class=\"btn btn-success btn-sm\" onclick=\"checkHistoryAdminPw()\">🔓 확인\u003c/button>\n          \u003cbutton class=\"btn btn-ghost btn-sm\" onclick=\"closeHistoryAdminMode()\">취소\u003c/button>\n        \u003c/div>\n        \u003cdiv id=\"historyAdminPwErr\" style=\"display:none;font-size:12px;color:var(--danger);margin-top:6px;font-weight:600\">⚠️ 비밀번호가 올바르지 않습니다\u003c/div>\n      \u003c/div>\n      \u003cdiv id=\"historyAdminActiveArea\" style=\"display:none\">\n        \u003cdiv style=\"display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px\">\n          \u003cdiv style=\"font-size:13px;font-weight:700;color:var(--success)\">\n            ✅ 관리자 모드 활성화 — 목록 우측 체크박스로 완료 처리하세요\n          \u003c/div>\n          \u003cbutton class=\"btn btn-ghost btn-sm\" onclick=\"closeHistoryAdminMode()\">🔒 잠금\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- 신청중 / 완료 탭 -->\n  \u003cdiv style=\"display:flex;gap:0;margin-bottom:14px;border-bottom:2px solid var(--border)\">\n    \u003cbutton class=\"history-tab active\" id=\"tab-pending\" onclick=\"switchHistoryTab('pending')\">\n      ⏳ 신청중 \u003cspan id=\"tab-pending-count\" style=\"font-size:10px;padding:1px 7px;border-radius:20px;background:rgba(212,136,10,.15);color:var(--accent);font-weight:700;margin-left:5px;font-family:var(--mono)\">\u003c/span>\n    \u003c/button>\n    \u003cbutton class=\"history-tab\" id=\"tab-done\" onclick=\"switchHistoryTab('done')\">\n      ✅ 완료 \u003cspan id=\"tab-done-count\" style=\"font-size:10px;padding:1px 7px;border-radius:20px;background:rgba(26,125,68,.15);color:var(--success);font-weight:700;margin-left:5px;font-family:var(--mono)\">\u003c/span>\n    \u003c/button>\n    \u003cbutton class=\"history-tab\" id=\"tab-uncategorized\" onclick=\"switchHistoryTab('uncategorized')\" style=\"display:none\">\n      🗂 카테고리 미등록 \u003cspan id=\"tab-uncategorized-count\" style=\"font-size:10px;padding:1px 7px;border-radius:20px;background:rgba(100,116,139,.15);color:var(--text2);font-weight:700;margin-left:5px;font-family:var(--mono)\">\u003c/span>\n    \u003c/button>\n  \u003c/div>\n  \u003cdiv style=\"margin:-6px 2px 14px;font-size:11px;color:var(--text3)\">완료 목록에는 최근 1개월 항목만 표시합니다. 이전 완료 항목은 목록에서만 제외하며, 제품·알레르기·원산지 원본 데이터는 삭제하지 않습니다.\u003c/div>\n\n  \u003c!-- 데스크탑 테이블 -->\n  \u003cdiv class=\"history-table-wrap card\" style=\"padding:0;overflow:hidden;overflow-x:auto;-webkit-overflow-scrolling:touch\">\n    \u003ctable class=\"recent-table\">\n      \u003cthead>\n        \u003ctr>\n          \u003cth style=\"width:120px\">카테고리\u003c/th>\n          \u003cth>제품이름\u003c/th>\n          \u003cth>판매금액\u003c/th>\n          \u003cth style=\"width:150px\">판매 점포\u003c/th>\n          \u003cth style=\"min-width:160px\">원산지 (1-2-3순위)\u003c/th>\n          \u003cth>알레르기\u003c/th>\n          \u003cth id=\"historyDateHeading\">등록일시\u003c/th>\n          \u003cth style=\"width:82px;text-align:center\">수정/삭제\u003c/th>\n          \u003cth id=\"th-complete\" style=\"width:56px;text-align:center;display:none\">완료\u003c/th>\n        \u003c/tr>\n      \u003c/thead>\n      \u003ctbody id=\"historyBody\">\u003c/tbody>\n    \u003c/table>\n    \u003cdiv id=\"historyEmpty\" class=\"empty\" style=\"display:none\">\u003cdiv class=\"ei\">📋\u003c/div>등록된 신제품이 없습니다\u003c/div>\n  \u003c/div>\n\n  \u003c!-- 모바일 카드 리스트 -->\n  \u003cdiv class=\"history-card-list-wrap\">\n    \u003cdiv class=\"history-card-list\" id=\"historyCardList\">\u003c/div>\n    \u003cdiv id=\"historyCardEmpty\" class=\"empty\" style=\"display:none\">\u003cdiv class=\"ei\">📋\u003c/div>등록된 신제품이 없습니다\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- ═══════════════════════════════════════════════ -->\n\n\u003c!-- PAGE: 설정                                     -->\n\n\u003c!-- ═══════════════════════════════════════════════ -->\n\n\u003cdiv id=\"page-settings\" class=\"page\">\n  \u003cdiv id=\"settingsLock\" style=\"max-width:360px;margin:60px auto 0\">\n    \u003cdiv class=\"card\" style=\"text-align:center;padding:40px 32px\">\n      \u003cdiv style=\"font-size:40px;margin-bottom:16px\">🔐\u003c/div>\n      \u003cdiv style=\"font-size:17px;font-weight:800;margin-bottom:6px;color:var(--text)\">설정 잠금\u003c/div>\n      \u003cdiv style=\"font-size:12px;color:var(--text3);margin-bottom:24px\">관리자 비밀번호를 입력하세요\u003c/div>\n      \u003cdiv class=\"fg\">\n        \u003cinput type=\"password\" id=\"settingsPwInput\" placeholder=\"비밀번호 입력\"\n          style=\"text-align:center;font-size:18px;letter-spacing:4px\"\n          onkeydown=\"if(event.key==='Enter')checkSettingsPw()\">\n      \u003c/div>\n      \u003cdiv id=\"settingsPwErr\" style=\"display:none;font-size:12px;color:var(--danger);margin-bottom:12px;font-weight:600\">⚠️ 비밀번호가 올바르지 않습니다\u003c/div>\n      \u003cbutton class=\"btn btn-primary btn-full\" onclick=\"checkSettingsPw()\">🔓 확인\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv id=\"settingsContent\" style=\"display:none\">\n    \u003cdiv style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px\">\n      \u003cdiv class=\"section-title\" style=\"margin:0\">⚙️ 설정\u003cspan class=\"section-sub\">관리자 전용\u003c/span>\u003c/div>\n      \u003cbutton class=\"btn btn-ghost btn-sm\" onclick=\"lockSettings()\">🔒 잠금\u003c/button>\n    \u003c/div>\n\n\u003cdiv class=\"card\" id=\"originManagerCard\">\u003cdiv class=\"card-header\">\u003cdiv class=\"card-title\">원산지 표기 관리\u003c/div>\u003cbutton class=\"btn btn-ghost btn-sm\" type=\"button\" onclick=\"loadOriginManager()\">새로고침\u003c/button>\u003c/div>\u003cdiv style=\"font-size:12px;color:var(--text3);margin:-6px 0 12px\">ㄱ→ㅎ 순 · 원라벨 이미지를 함께 확인합니다. 숨김 표기는 기존 제품 기록을 유지하고 신규 선택 목록에서만 제외됩니다.\u003c/div>\u003cinput id=\"originManagerSearch\" oninput=\"originManagerResultsCollapsed=false;renderOriginManager()\" placeholder=\"원산지 표기 검색\" style=\"margin-bottom:10px\">\u003cdiv id=\"originManagerList\">\u003cdiv style=\"font-size:12px;color:var(--text3)\">관리자 인증 후 불러옵니다.\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"card\" id=\"originNoticeAdminCard\">\n  \u003cdiv class=\"card-header\">\n    \u003cdiv class=\"card-title\">원산지 변경 공지\u003c/div>\n    \u003cspan style=\"font-size:11px;color:var(--text3)\">한 줄 공지가 신제품 등록 화면에 표시됩니다\u003c/span>\n  \u003c/div>\n  \u003cdiv style=\"display:flex;align-items:center;gap:8px\">\n    \u003clabel for=\"noticeMessage\" style=\"white-space:nowrap;font-size:12px;font-weight:600\">공지 문구\u003c/label>\n    \u003cinput id=\"noticeMessage\" maxlength=\"180\" style=\"flex:1;min-width:0;width:auto\" placeholder=\"예: 우유식빵 원산지가 국산에서 폴란드산으로 변경됩니다.\">\n    \u003cbutton class=\"btn btn-primary btn-sm\" type=\"button\" onclick=\"saveOriginNotice()\">등록\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"notice-admin-list\" id=\"originNoticeAdminList\">\u003cdiv style=\"font-size:12px;color:var(--text3)\">공지 불러오는 중...\u003c/div>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n  \u003cdiv class=\"card-header\">\n    \u003cdiv class=\"card-title\">🔥 Firebase 설정\u003cspan class=\"card-badge\" style=\"background:var(--accent3)\">직원 공유용\u003c/span>\u003c/div>\n    \u003cspan id=\"fbStatusText\" style=\"font-size:12px;color:var(--text3)\">확인 중...\u003c/span>\n  \u003c/div>\n  \u003cdiv style=\"font-size:12px;color:var(--text3);background:var(--surface2);border-radius:8px;padding:10px 14px;margin-bottom:16px;line-height:1.7\">\n    📌 \u003cstrong style=\"color:var(--text)\">다른 직원과 공유하는 방법\u003c/strong>\u003cbr>\n    아래 Firebase 설정값을 동일하게 입력하면 모든 기기에서 같은 DB에 연결됩니다.\u003cbr>\n    \u003cspan style=\"color:var(--accent3)\">console.firebase.google.com\u003c/span> → 프로젝트 설정 → 앱에서 값을 확인하세요.\n  \u003c/div>\n  \u003cdiv class=\"input-row\">\n    \u003cdiv class=\"fg\">\u003clabel>Project ID\u003c/label>\u003cinput type=\"text\" id=\"fbProjectId\" placeholder=\"예: hare-allergen\">\u003c/div>\n    \u003cdiv class=\"fg\">\u003clabel>API Key\u003c/label>\u003cinput type=\"text\" id=\"fbApiKey\" placeholder=\"AIzaSy...\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"fg\">\u003clabel>Database URL\u003c/label>\u003cinput type=\"text\" id=\"fbDbUrl\" placeholder=\"https://프로젝트명-default-rtdb.asia-southeast1.firebasedatabase.app\">\u003c/div>\n  \u003cdiv class=\"input-row\">\n    \u003cdiv class=\"fg\">\u003clabel>Auth Domain\u003c/label>\u003cinput type=\"text\" id=\"fbAuthDomain\" placeholder=\"프로젝트명.firebaseapp.com\">\u003c/div>\n    \u003cdiv class=\"fg\">\u003clabel>App ID\u003c/label>\u003cinput type=\"text\" id=\"fbAppId\" placeholder=\"1:000000:web:000000\">\u003c/div>\n  \u003c/div>\n  \u003cdiv style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:4px\">\n    \u003cbutton class=\"btn btn-primary btn-sm\" onclick=\"saveFirebaseSettings()\">💾 저장 및 재연결\u003c/button>\n    \u003cbutton class=\"btn btn-ghost btn-sm\" onclick=\"loadDefaultFirebase()\">↩ 기본값 복원\u003c/button>\n    \u003cbutton class=\"btn btn-ghost btn-sm\" onclick=\"copyShareText()\">📋 공유 텍스트 복사\u003c/button>\n  \u003c/div>\n  \u003cdiv id=\"fbShareBox\" style=\"display:none;margin-top:14px;background:var(--surface2);border-radius:8px;padding:12px;font-size:11px;font-family:var(--mono);color:var(--text2);white-space:pre-wrap;word-break:break-all;border:1px solid var(--border)\">\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n  \u003cdiv class=\"card-header\">\n    \u003cdiv class=\"card-title\">🖼️ 원산지 증빙 가이드 이미지\u003cspan class=\"card-badge\" style=\"background:var(--accent2)\">신제품 등록 안내용\u003c/span>\u003c/div>\n    \u003cspan style=\"font-size:11px;color:var(--text3)\">최대 5개\u003c/span>\n  \u003c/div>\n  \u003cdiv style=\"font-size:12px;color:var(--text3);background:var(--surface2);border-radius:8px;padding:10px 14px;margin-bottom:14px;line-height:1.7\">\n    📌 \u003cstrong style=\"color:var(--text)\">원산지 증빙 이미지 첨부 방법 안내\u003c/strong>\u003cbr>\n    등록된 이미지는 \u003cstrong style=\"color:var(--accent)\">신제품 등록 탭\u003c/strong>의 원산지 증빙 이미지 첨부 항목 옆 \u003cstrong style=\"color:var(--accent3)\">?\u003c/strong> 아이콘 툴팁에 반영됩니다.\n  \u003c/div>\n  \u003cdiv style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px\" id=\"guideImgWrap\">\u003c/div>\n  \u003cdiv style=\"display:flex;gap:8px;flex-wrap:wrap\">\n    \u003cbutton class=\"btn btn-secondary btn-sm\" onclick=\"addGuideImgSlot()\">가이드 이미지 교체 안내\u003c/button>\n    \u003cbutton class=\"btn btn-ghost btn-sm\" onclick=\"clearGuideImgs()\">🗑 전체 삭제\u003c/button>\n  \u003c/div>\n  \u003cdiv style=\"margin-top:10px;font-size:11px;color:var(--text3)\">※ 가이드 이미지는 GitHub의 고정 파일로 관리됩니다. 5MB 이하 파일을 사용해 주세요.\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n  \u003cdiv class=\"card-header\">\n    \u003cdiv class=\"card-title\">🌾 알레르기 체크 가이드 이미지\u003cspan class=\"card-badge\" style=\"background:var(--danger)\">전 직원 공유\u003c/span>\u003c/div>\n    \u003cspan style=\"font-size:11px;color:var(--text3)\">최대 5개\u003c/span>\n  \u003c/div>\n  \u003cdiv style=\"font-size:12px;color:var(--text3);background:var(--surface2);border-radius:8px;padding:10px 14px;margin-bottom:14px;line-height:1.7\">\n    📌 \u003cstrong style=\"color:var(--text)\">알레르기 유발물질 체크 방법 안내 이미지\u003c/strong>\u003cbr>\n    등록된 이미지는 \u003cstrong style=\"color:var(--accent)\">신제품 등록 탭\u003c/strong>의 알레르기 유발물질 섹션 상단에 공유됩니다.\u003cbr>\n    체크 기준, 식품 알레르기 표기 가이드 등을 이미지로 업로드하세요.\n  \u003c/div>\n  \u003cdiv style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px\" id=\"allergenGuideImgWrap\">\u003c/div>\n  \u003cdiv style=\"display:flex;gap:8px;flex-wrap:wrap\">\n    \u003cbutton class=\"btn btn-secondary btn-sm\" onclick=\"addAllergenGuideImg()\">가이드 이미지 교체 안내\u003c/button>\n    \u003cbutton class=\"btn btn-ghost btn-sm\" onclick=\"clearAllergenGuideImgs()\">🗑 전체 삭제\u003c/button>\n  \u003c/div>\n  \u003cdiv style=\"margin-top:10px;font-size:11px;color:var(--text3)\">※ 가이드 이미지는 GitHub의 고정 파일로 관리됩니다. 5MB 이하 파일을 사용해 주세요.\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n  \u003cdiv class=\"card-header\">\n    \u003cdiv class=\"card-title\">🏪 판매 점포 관리\u003cspan class=\"card-badge\" style=\"background:var(--accent3)\">전 직원 공유\u003c/span>\u003c/div>\n  \u003c/div>\n  \u003cdiv style=\"font-size:12px;color:var(--text3);background:var(--surface2);border-radius:8px;padding:10px 14px;margin-bottom:14px;line-height:1.7\">\n    📌 \u003cstrong style=\"color:var(--text)\">신제품 등록 탭\u003c/strong>의 \"판매 점포\" 체크박스 목록입니다. 추가·수정·삭제하면 실시간으로 반영됩니다.\n  \u003c/div>\n  \u003cdiv class=\"store-manage-list\" id=\"storeManageList\">\u003c/div>\n  \u003cdiv style=\"display:flex;gap:8px;flex-wrap:wrap\">\n    \u003cbutton class=\"btn btn-secondary btn-sm\" onclick=\"addStoreItem()\">+ 점포 추가\u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"card\">\n  \u003cdiv class=\"card-header\">\u003cdiv class=\"card-title\">🔑 설정 비밀번호 변경\u003c/div>\u003c/div>\n  \u003cdiv class=\"input-row\">\n    \u003cdiv class=\"fg\">\u003clabel>새 비밀번호\u003c/label>\u003cinput type=\"password\" id=\"newPw1\" placeholder=\"새 비밀번호\">\u003c/div>\n    \u003cdiv class=\"fg\">\u003clabel>비밀번호 확인\u003c/label>\u003cinput type=\"password\" id=\"newPw2\" placeholder=\"다시 입력\">\u003c/div>\n  \u003c/div>\n  \u003cbutton class=\"btn btn-secondary btn-sm\" onclick=\"changeSettingsPw()\">🔑 변경\u003c/button>\n\u003c/div>\n\n  \u003c/div>\n\u003c/div>\n\n\u003c/main>\n\n\u003c!-- 등록 완료 모달 -->\n\n\u003cdiv class=\"modal-overlay\" id=\"successModal\">\n  \u003cdiv class=\"modal\">\n    \u003cdiv class=\"modal-title\">🎉 신제품 등록 완료!\u003c/div>\n    \u003cdiv id=\"successContent\" style=\"font-size:13px;color:var(--text2);line-height:1.8;margin-bottom:16px\">\u003c/div>\n    \u003cdiv style=\"font-size:12px;color:var(--text3);margin-bottom:20px;padding:10px;background:var(--surface2);border-radius:var(--radius-sm)\">\n      ✅ \u003cstrong style=\"color:var(--success)\">index.html 알레르기 리스트\u003c/strong>에 자동 반영되었습니다.\n    \u003c/div>\n    \u003cdiv class=\"modal-footer\" style=\"flex-wrap:wrap\">\n      \u003cbutton class=\"btn btn-success btn-sm\" id=\"copyShareBtn\" onclick=\"copyShareText()\">📋 공유 내용 복사\u003c/button>\n      \u003cbutton class=\"btn btn-secondary btn-sm\" onclick=\"closeSuccess(); showPage('history')\">📋 등록 이력 보기\u003c/button>\n      \u003cbutton class=\"btn btn-primary btn-sm\" onclick=\"resetForm()\">➕ 새 제품 등록\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- ══ 제품 상세 모달 ══ -->\n\n\u003cdiv class=\"modal-overlay\" id=\"productDetailModal\" onclick=\"if(event.target===this)closeProductDetail()\">\n  \u003cdiv class=\"modal\" style=\"max-width:480px\">\n    \u003cdiv style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px\">\n      \u003cdiv>\n        \u003cdiv id=\"detailModalTitle\" style=\"font-size:18px;font-weight:800;color:var(--text);letter-spacing:-.3px;line-height:1.3;word-break:keep-all\">\u003c/div>\n        \u003cdiv id=\"detailModalMeta\" style=\"margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap\">\u003c/div>\n      \u003c/div>\n      \u003cbutton class=\"btn btn-ghost btn-sm\" style=\"flex-shrink:0\" onclick=\"closeProductDetail()\">✕\u003c/button>\n    \u003c/div>\n    \u003cdiv id=\"detailModalBody\">\u003c/div>\n    \u003cdiv class=\"modal-footer\" style=\"flex-wrap:wrap;gap:8px\">\n      \u003cbutton class=\"btn btn-danger btn-sm\" id=\"detailDeleteBtn\">🗑 삭제\u003c/button>\n      \u003cbutton class=\"btn btn-secondary btn-sm\" id=\"detailEditBtn\" onclick=\"openEditModal()\">✏️ 수정\u003c/button>\n      \u003cbutton class=\"btn btn-secondary btn-sm\" onclick=\"closeProductDetail()\">닫기\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003c!-- ══ 수정 모달 ══ -->\n\n\u003cdiv class=\"modal-overlay\" id=\"editModal\" onclick=\"if(event.target===this)closeEditModal()\">\n  \u003cdiv class=\"modal\" style=\"max-width:520px\">\n    \u003cdiv style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:20px\">\n      \u003cdiv style=\"font-size:17px;font-weight:800;color:var(--text);letter-spacing:-.3px\">✏️ 제품 수정\u003c/div>\n      \u003cbutton class=\"btn btn-ghost btn-sm\" onclick=\"closeEditModal()\">✕\u003c/button>\n    \u003c/div>\n\n\u003c!-- 기본 정보 -->\n\u003cd {}).color || DEFAULT_STORE_COLORS[name] || '#8ca58f'; }\nfunction normalizeStoreName(name){\n  const value = String(name || '').trim().replace(/점$/, '');\n  return value === '건양대병원' ? '건양대' : value;\n}\nfunction displayStoreName(name){\n  const value = normalizeStoreName(name);\n  if (value === '건양대') return '건양대병원점';\n  return value.endsWith('점') ? value : value + '점';\n}\nfunction getProductStoreNames(product){\n  const savedNames = Array.isArray(product && product.판매점포)\n    ? product.판매점포.map(normalizeStoreName).filter(Boolean)\n    : [];\n  if (!savedNames.length) return [];\n  return stores.map(store => store.name).filter(name => savedNames.includes(name));\n}\n\nfunction originDisplay(o) {\n  if (!o) return '';\n  if (o.text) return o.text;\n  if (o.name || o.country) return (o.name || '') + (o.country ? '(' + o.country + ')' : '');\n  return '';\n}\n\n\nlet originNotices = {};\nfunction loadOriginNotices(){\n  if(!db)return;\n  db.ref('originNotices').on('value',snap=>{\n    originNotices=snap.val()||{};\n    renderOriginNoticeTicker();\n    renderOriginNoticeAdminList();\n  },err=>console.error('originNotices read error',err));\n}\nfunction noticeEsc(s){return String(s||'').replace(/[&\u003c>\"']/g,ch=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[ch]));}\nfunction renderOriginNoticeTicker(){\n  const track=document.getElementById('originNoticeTrack'), box=document.getElementById('originNotice');\n  if(!track||!box)return;\n  const active=Object.entries(originNotices).filter(([,n])=>n&&n.active!==false).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));\n  const messages=active.map(([,n])=>n.message||[n.product,n.oldOrigin&&n.newOrigin?n.oldOrigin+' → '+n.newOrigin:'',n.effectiveDate?'적용 '+n.effectiveDate:'',n.scope&&n.scope!=='전 지점'?n.scope:'전 지점'].filter(Boolean).join(' · '));\n  const label=messages.length?messages.join('　　✦　　'):'현재 등록된 원산지 변경 공지가 없습니다.';\n  box.classList.toggle('empty',!messages.length);\n  const safe=noticeEs . Firebase 규칙을 확인해주세요','error');}\n}\n\nfunction INIT() {\n  const savedFb = getSavedFirebaseCfg();\n  const fbCfg = savedFb || FB_CFG;\n  try {\n    const existingApp = firebase.apps.find(a => a.name === 'register-app');\n    const app = existingApp ? existingApp : firebase.initializeApp(fbCfg, 'register-app');\n    db = firebase.database(app);\n    loadOriginList();\n    loadOriginNotices();\n    db.ref('.info/connected').on('value', snap => {\n      const ok = snap.val() === true;\n      document.getElementById('syncDot').className = 'sync-dot ' + (ok ? 'ok' : 'err');\n      document.getElementById('syncLabel').textContent = ok ? 'Firebase 연결됨' : '오프라인';\n      const fbSt = document.getElementById('fbStatusText');\n      if (fbSt) fbSt.innerHTML = ok\n        ? '\u003cspan style=\"color:var(--success)\">✅ 연결 완료\u003c/span>'\n        : '\u003cspan style=\"color:var(--danger)\">❌ 연결 실패\u003c/span>';\n    });\n  } catch(e) {\n    console.error('Firebase init error', e);\n    toast('Firebase 연결 오류: ' + e.message, 'error');\n  }\n  buildAllergenGrid();\n  updateRegisterBtn();\n  loadGuideImages();\n  loadAllergenGuideImages();\n  loadStores();\n  addIngRow();\n\n  /* ── 툴팁 클릭 토글 (모바일 지원) ── */\n  document.addEventListener('click', function(e) {\n    const icon = e.target.closest('.tip-icon');\n    if (icon) {\n      e.preventDefault(); e.stopPropagation();\n      const wrap = icon.closest('.tip-wrap');\n      const wasOpen = wrap.classList.contains('tip-open');\n      document.querySelectorAll('.tip-wrap.tip-open').forEach(w => w.classList.remove('tip-open'));\n      if (!wasOpen) wrap.classList.add('tip-open');\n      return;\n    }\n    document.querySelectorAll('.tip-wrap.tip-open').forEach(w => w.classList.remove('tip-open'));\n  });\n} /* ── END INIT ── */\n\nfunction toggleAllergenConfirm() {\n  const cb   = document.getElementById('allergenConfirm');\n  const wrap = document.getElementById('allergenConfirmWrap');\n  cb.checked = !cb.checked;\n  allergenConfirmed = cb.checked;\n  wrap.classList.toggle('checked', cb.checked);\n  if (cb.checked) document.getElementById('allergenRequiredMsg').style.display = 'none';\n  updateRegisterBtn();\n}\n\nfunction showPage(id) {\n  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));\n  document.querySelectorAll('.hbtn').forEach(b => b.classList.remove('active'));\n  document.getElementById('page-' + id).classList.add('active');\n  const btns = document.querySelectorAll('.hbtn');\n  const map = {register:0, history:1, settings:2};\n  if (map[id] !== undefined) btns[map[id]].classList.add('active');\n  if (id === 'history') loadHistory();\n  if (id === 'settings') { initSettingsPage(); setTimeout(() => { renderGuideImgWrap(); renderAllergenGuideImgWrap(); }, 50); }\n}\n\nfunction buildAllergenGrid() {\n  const grid = document.getElementById('allergenGrid');\n  grid.innerHTML = '';\n  ALLERGENS.forEach(a => {\n    const div = document.createElement('div');\n    div.className = 'atag' + (allergenState[a] ? ' on' : '');\n    div.id = 'atag-' + a;\n    div.innerHTML = `\u003cspan class=\"dot\">\u003c/span>${a}`;\n    div.onclick = () => toggleAllergen(a);\n    grid.appendChild(div);\n  });\n}\n\nfunction toggleAllergen(a) {\n  allergenState[a] = !allergenState[a];\n  const el = document.getElementById('atag-' + a);\n  el.classList.toggle('on', allergenState[a]);\n  el.querySelector('.dot').style.background = allergenState[a] ? 'var(--danger)' : 'var(--border)';\n  const cnt = ALLERGENS.filter(x => allergenState[x]).length;\n  document.getElementById('allergenCount').textContent = cnt;\n  updateRegisterBtn();\n  updatePreview();\n}\n\nfunction clearAllergens() {\n  ALLERGENS.forEach(a => { allergenState[a] = false; });\n  buildAllergenGrid();\n  document.getElementById('allergenCount').textContent = '0';\n  updatePreview();\n}\n\nfunction triggerImgInput(idx) { document.getElementById('imgInput' + idx).click(); }\n\nconst MAX_IMAGE_UPLOAD_BYTES = 5 * 1024 * 1024;\nfunction loadUploadImage(src) {\n  return new Promise((resolve, reject) => {\n    const img = new Image();\n    img.onload = () => resolve(img);\n    img.onerror = () => reject(new Error('JPG, PNG, WEBP 이미지만 등록할 수 있습니다'));\n    img.src = src;\n  });\n}\nasync function compressImageForUpload(file) {\n  if (!file || !file.type.startsWith('image/')) throw new Error('이미지 파일만 등록할 수 있습니다');\n  const objectUrl = URL.createObjectURL(file);\n  try {\n    const img = await loadUploadImage(objectUrl);\n    const maxSide = 2000;\n    const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));\n    const canvas = document.createElement('canvas');\n    canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));\n    canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));\n    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);\n    let blob = null;\n    for (const quality of [0.82, 0.72, 0.62, 0.52]) {\n      blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/webp', quality));\n      if (blob && blob.size \u003c= MAX_IMAGE_UPLOAD_BYTES) break;\n    }\n    if (!blob) throw new Error('이 브라우저에서는 이미지 압축을 할 수 없습니다');\n    if (blob.size > MAX_IMAGE_UPLOAD_BYTES) throw new Error('자동 압축 후에도 5MB를 초과합니다. 더 작은 사진을 선택해주세요');\n    const baseName = (file.name || 'image').replace(/\\.[^.]+$/, '');\n    return new File([blob], `${baseName}.webp`, { type: 'image/webp' });\n  } finally {\n    URL.revokeObjectURL(objectUrl);\n  }\n}\n\nasync function handleOriginImg(idx, inp) {\n  const file = inp.files && inp.files[0];\n  inp.value = '';\n  if (!file) return;\n  if (!file.type.startsWith('image/')) { toast('이미지 파일만 등록할 수 있습니다', 'error'); return; }\n  toast('이미지를 자동 압축하고 업로드하는 중입니다', 'success');\n  try {\n    const uploadFile = await compressImageForUpload(file);\n    const form = new FormData();\n    form.append('file', uploadFile);\n    form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);\n    form.append('folder', 'hare-allergen/products');\n    const response = await fetch(CLOUDINARY_UPLOAD_URL, { method: 'POST', body: form });\n    const result = await response.json();\n    if (!response.ok || !result.secure_url) throw new Error(result.error?.message || 'Cloudinary 업로드 실패');\n    originImages[idx] = result.secure_url;\n    renderImgSlot(idx, result.secure_url);\n    toast('이미지가 업로드되었습니다', 'success');\n  } catch (err) {\n    console.error(err);\n    toast('이미지 업로드 실패: ' + err.message, 'error');\n  }\n}\n\nfunction resizeImage(file, maxPx, cb) {\n  const reader = new FileReader();\n  reader.onload = e => {\n    const img = new Image();\n    img.onload = () => {\n      const canvas = document.createElement('canvas');\n      let w = img.width, h = img.height;\n      if (w > maxPx || h > maxPx) {\n        if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }\n        else { w = Math.round(w * maxPx / h); h = maxPx; }\n      }\n      canvas.width = w; canvas.height = h;\n      canvas.getContext('2d').drawImage(img, 0, 0, w, h);\n      cb(canvas.toDataURL('image/jpeg', 0.7));\n    };\n    img.src = e.target.result;\n  };\n  reader.readAsDataURL(file);\n}\n\nfunction renderImgSlot(idx, dataUrl) {\n  const slot = document.getElementById('imgSlot' + idx);\n  slot.innerHTML = `\n    \u003cimg src=\"${dataUrl}\" alt=\"원산지 이미지 ${idx+1}\" loading=\"lazy\" decoding=\"async\">\n    \u003cbutton class=\"img-del\" onclick=\"removeOriginImg(${idx},event)\">✕\u003c/button>\n    \u003cinput type=\"file\" accept=\"image/jpeg,image/png,image/webp\" id=\"imgInput${idx}\" onchange=\"handleOriginImg(${idx},this)\" style=\"display:none\" onclick=\"event.stopPropagation()\">\n  `;\n}\n\nfunction removeOriginImg(idx, e) {\n  e.stopPropagation();\n  originImages[idx] = null;\n  const slot = document.getElementById('imgSlot' + idx);\n  slot.innerHTML = `\n    \u003cspan style=\"font-size:18px;margin-bottom:2px\">📷\u003c/span>\n    \u003cspan>이미지 ${idx+1}\u003c/span>\n    \u003cspan style=\"font-size:9px\">자동 압축 · 5MB 이하\u003c/span>\n    \u003cinput type=\"file\" accept=\"image/jpeg,image/png,image/webp\" id=\"imgInput${idx}\" onchange=\"handleOriginImg(${idx},this)\" style=\"display:none\" onclick=\"event.stopPropagation()\">\n  `;\n}\n\nfunction addIngRow() {\n  const id = ++rowId;\n  ingRows.push({ id, name:'', qty:0, unit:'g', unitPrice:0 });\n  renderIngRows();\n}\n\nfunction removeIngRow(id) {\n  ingRows = ingRows.filter(r => r.id !== id);\n  renderIngRows();\n  calcCosts();\n}\n\nfunction renderIngRows() {\n  const body = document.getElementById('ingBody');\n  const empty = document.getElementById('ingEmpty');\n  if (ingRows.length === 0) { body.innerHTML = ''; empty.style.display = 'block'; calcCosts(); return; }\n  empty.style.display = 'none';\n  body.innerHTML = ingRows.map(r => `\n    \u003ctr id=\"row-${r.id}\">\n      \u003ctd>\u003cinput type=\"text\" value=\"${esc(r.name)}\" placeholder=\"원재료명\" oninput=\"updateRow(${r.id},'name',this.value)\">\u003c/td>\n      \u003ctd>\u003cinput type=\"number\" value=\"${r.qty||''}\" placeholder=\"0\" min=\"0\" step=\"1\" style=\"text-align:right\" oninput=\"updateRow(${r.id},'qty',this.value)\">\u003c/td>\n      \u003ctd>\u003cselect onchange=\"updateRow(${r.id},'unit',this.value)\">${['g','kg','ml','L','개','tbsp','tsp','꼬집'].map(u=>`\u003coption${r.unit===u?' selected':''}>${u}\u003c/option>`).join('')}\u003c/select>\u003c/td>\n      \u003ctd>\u003cinput type=\"number\" value=\"${r.unitPrice||''}\" placeholder=\"0\" min=\"0\" style=\"text-align:right\" oninput=\"updateRow(${r.id},'unitPrice',this.value)\">\u003c/td>\n      \u003ctd class=\"cost-cell\" id=\"cost-${r.id}\">0원\u003c/td>\n      \u003ctd>\u003cbutton class=\"del-btn\" onclick=\"removeIngRow(${r.id})\">✕\u003c/button>\u003c/td>\n    \u003c/tr>\n  `).join('');\n  calcCosts();\n}\n\nfunction updateRow(id, field, val) {\n  const r = ingRows.find(r => r.id === id);\n  if (!r) return;\n  r[field] = field === 'name' ? val : (parseFloat(val) || 0);\n  calcCosts();\n}\n\nfunction esc(s) { return String(s).replace(/\"/g,'&quot;').replace(/\u003c/g,'&lt;'); }\n\n/* ── 원산지 콤보박스 (쇼카드 출력 시스템과 동일한 Firebase origins 노드를 공유) ── */\n// origins.json은 쇼카드 시스템에서도 그대로 읽고 쓰는 노드라서, 여기서 저장한\n// 표기가 쇼카드 시스템에도 바로 뜨고, 반대도 마찬가지입니다.\nfunction loadOriginList() {\n  if (!db) return;\n  db.ref('origins').on('value', snap => {\n    const data = snap.val() || {};\n    db.ref('origin_hidden').once('value').then(hs => {\n      const hidden = hs.val() || {};\n      originAllList = Object.values(data).filter(Boolean);\n      const list = Object.entries(data).filter(([key,value]) => value && !hidden[key]).map(([,value]) => value);\n      originList = Array.from(new Set(list)).sort((a, b) => a.localeCompare(b, 'ko'));\n      document.querySelectorAll('.origin-panel.open').forEach(panel => renderOriginPanel(panel.id.replace(/-panel$/, '')));\n    });\n  });\n}\n\n// Splits an origin string on top-level commas only — commas that fall\n// inside (), [], or {} are treated as part of that single entry\n// (e.g. \"밀가루(밀:미국,캐나다산), 호두(미국산)\" → [\"밀가루(밀:미국,캐나다산)\", \"호두(미국산)\"]).\n// Shared with the 쇼카드 출력 시스템's origin field, which lets staff type\n// several comma-separated origin phrases into one box.\nfunction splitOriginEntries(value) {\n  const s = String(value || '');\n  const parts = [];\n  let cur = '';\n  let depth = 0;\n  for (const ch of s) {\n    if (ch === '(' || ch === '[' || ch === '{') depth++;\n    else if (ch === ')' || ch === ']' || ch === '}') depth = Math.max(0, depth - 1);\n    if (ch === ',' && depth === 0) {\n      parts.push(cur.trim());\n      cur = '';\n    } else {\n      cur += ch;\n    }\n  }\n  if (cur.trim()) parts.push(cur.trim());\n  return parts.filter(Boolean);\n}\n\nfunction saveOriginIfNew(value) {\n  if (!db) return;\n  const entries = splitOriginEntries(value);\n  const newOnes = entries.filter(v => v && !originAllList.includes(v));\n  if (newOnes.length === 0) return;\n  originAllList = Array.from(new Set([...originAllList, ...newOnes]));\n  originList = Array.from(new Set([...originList, ...newOnes])).sort((a, b) => a.localeCompare(b, 'ko'));\n  newOnes.forEach(v => db.ref('origins').push(v));\n}\n\nfunction canWriteSharedOrigin(inputId) {\n  return !['origin1-text', 'origin2-text', 'origin3-text'].includes(inputId);\n}\n\nfunction openOriginPanel(inputId) {\n  renderOriginPanel(inputId);\n  const panel = document.getElementById(inputId + '-panel');\n  if (panel) panel.classList.add('open');\n}\n\nfunction closeOriginPanel(inputId) {\n  const panel = document.getElementById(inputId + '-panel');\n  if (panel) panel.classList.remove('open');\n}\n\nfunction scheduleCloseOriginPanel(inputId) {\n  const inp = document.getElementById(inputId);\n  if (inp && canWriteSharedOrigin(inputId)) saveOriginIfNew(inp.value);\n  setTimeout(() => closeOriginPanel(inputId), 150);\n}\n\n// Returns just the entry currently being typed — the text after the last\n// top-level comma (bracket-aware, same rule as splitOriginEntries). Used\n// so the suggestion list searches/matches against only what's being typed\n// right now, not the whole multi-entry string.\nfunction getCurrentOriginSegment(value) {\n  const s = String(value || '');\n  let depth = 0;\n  let lastTopCommaIdx = -1;\n  for (let i = 0; i \u003c s.length; i++) {\n    const ch = s[i];\n    if (ch === '(' || ch === '[' || ch === '{') depth++;\n    else if (ch === ')' || ch === ']' || ch === '}') depth = Math.max(0, depth - 1);\n    else if (ch === ',' && depth === 0) lastTopCommaIdx = i;\n  }\n  return s.slice(lastTopCommaIdx + 1).trim();\n}\n\n// Swaps in a selected entry for just the current segment, keeping any\n// already-completed comma-separated entries before it untouched.\nfunction replaceCurrentOriginEntry(value, selected) {\n  const s = String(value || '');\n  let depth = 0;\n  let lastTopCommaIdx = -1;\n  for (let i = 0; i \u003c s.length; i++) {\n    const ch = s[i];\n    if (ch === '(' || ch === '[' || ch === '{') depth++;\n    else if (ch === ')' || ch === ']' || ch === '}') depth = Math.max(0, depth - 1);\n    else if (ch === ',' && depth === 0) lastTopCommaIdx = i;\n  }\n  const prefix = lastTopCommaIdx === -1 ? '' : s.slice(0, lastTopCommaIdx + 1) + ' ';\n  return prefix + selected;\n}\n\nfunction selectOrigin(inputId, value) {\n  const inp = document.getElementById(inputId);\n  if (!inp) return;\n  inp.value = replaceCurrentOriginEntry(inp.value, value);\n  inp.dispatchEvent(new Event('input', { bubbles: true }));\n  if (registrationOriginIds.includes(inputId)) {\n    registrationOriginChosen[inputId] = true;\n    updateRegisterBtn();\n  }\n  closeOriginPanel(inputId);\n}\n\nfunction handleRegistrationOriginInput(inputId) {\n  registrationOriginChosen[inputId] = false;\n  updatePreview();\n  renderOriginPanel(inputId);\n}\n\nfunction acceptTypedOrigin(inputId) {\n  const inp = document.getElementById(inputId);\n  const value = inp ? getCurrentOriginSegment(inp.value).trim() : '';\n  if (!value) return;\n  selectOrigin(inputId, value);\n  // 등록 화면에서 직접 입력을 명시적으로 선택한 경우에만 공유 목록에 추가\n  saveOriginIfNew(value);\n}\n\nfunction renderOriginPanel(inputId) {\n  const inp = document.getElementById(inputId);\n  const panel = document.getElementById(inputId + '-panel');\n  if (!inp || !panel) return;\n  const raw = inp.value || '';\n  const query = getCurrentOriginSegment(raw);\n  const q = query.toLowerCase();\n  const matches = q ? originList.filter(o => o.toLowerCase().includes(q)) : originList;\n  if (registrationOriginIds.includes(inputId)) {\n    let choiceHtml = '';\n    if (matches.length) {\n      matches.forEach(o => {\n        choiceHtml += `\u003cdiv class=\"origin-opt\" onmousedown=\"event.preventDefault();selectOrigin('${inputId}','${esc(o).replace(/'/g,\"\\\\'\")}')\">${esc(o)}\u003c/div>`;\n      });\n    } else if (query.trim()) {\n      choiceHtml = `\u003cdiv class=\"origin-opt origin-opt-new\" onmousedown=\"event.preventDefault();acceptTypedOrigin('${inputId}')\">＋ 직접 입력: \"${esc(query.trim())}\"\u003c/div>`;\n    } else {\n      choiceHtml = '\u003cdiv class=\"origin-opt-empty\">저장된 표기를 검색하거나, 검색 결과가 없을 때 직접 입력할 수 있어요.\u003c/div>';\n    }\n    panel.innerHTML = choiceHtml;\n    return;\n  }\n  const entries = splitOriginEntries(raw);\n  const newEntryCount = entries.filter(e => !originList.includes(e)).length;\n  let html = '';\n  if (newEntryCount > 0) {\n    const label = entries.length > 1\n      ? `＋ 새 표기 ${newEntryCount}개 저장 (쉼표로 구분됨)`\n      : `＋ \"${esc(raw.trim())}\" 새 표기로 저장`;\n    if (canWriteSharedOrigin(inputId)) {\n      html += `\u003cdiv class=\"origin-opt origin-opt-new\" onmousedown=\"event.preventDefault();saveOriginIfNew(document.getElementById('${inputId}').value);renderOriginPanel('${inputId}')\">${label}\u003c/div>`;\n    }\n  }\n  if (matches.length === 0 && !raw.trim()) {\n    html += `\u003cdiv class=\"origin-opt-empty\">아직 저장된 원산지 표기가 없어요.\u003cbr>직접 입력하면 자동으로 목록에 저장됩니다.\u003c/div>`;\n  }\n  matches.forEach(o => {\n    html += `\u003cdiv class=\"origin-opt\" onmousedown=\"event.preventDefault();selectOrigin('${inputId}','${esc(o).replace(/'/g,\"\\\\'\")}')\">${esc(o)}\u003c/div>`;\n  });\n  panel.innerHTML = html;\n}\n\n/* ── 판매 점포 관리 ── */\nfunction loadStores() {\n  if (!db) return;\n  db.ref('stores').on('value', snap => {\n    const data = snap.val();\n    if (!data) {\n      // 최초 1회: 기본 점포 목록으로 시딩\n      const seed = {};\n      DEFAULT_STORES.forEach(name => {\n        const id = db.ref('stores').push().key;\n        seed[id] = { _id: id, name, color: DEFAULT_STORE_COLORS[name] };\n      });\n      db.ref('stores').set(seed);\n      return;\n    }\n    stores = Object.values(data).filter(Boolean).map(s=>({\n      ...s,\n      name: normalizeStoreName(s.name),\n      color:s.color || DEFAULT_STORE_COLORS[s.name] || '#8ca58f'\n    })).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ko'));\n    if (Object.keys(selectedStores).length === 0) {\n      stores.forEach(s => { selectedStores[s.name] = true; });\n    }\n    renderStoreGrid('storeGrid', selectedStores);\n    renderStoreGrid('editStoreGrid', editSelectedStores);\n    renderStoreManageList();\n    renderHistoryStoreFilter();\n  });\n}\n\nfunction renderStoreGrid(gridId, stateObj) {\n  const grid = document.getElementById(gridId);\n  if (!grid) return;\n  grid.innerHTML = '';\n  stores.forEach(s => {\n    if (!(s.name in stateObj)) stateObj[s.name] = false;\n    const div = document.createElement('div');\n    div.className = 'stag' + (stateObj[s.name] ? ' on' : '');\n    div.innerHTML = `\u003cspan class=\"dot\" style=\"background:${stateObj[s.name] ? s.color : 'var(--border)'}\">\u003c/span>${esc(displayStoreName(s.name))}`;\n    div.onclick = () => {\n      stateObj[s.name] = !stateObj[s.name];\n      div.classList.toggle('on', stateObj[s.name]);\n      div.querySelector('.dot').style.background = stateObj[s.name] ? s.color : 'var(--border)';\n    };\n    grid.appendChild(div);\n  });\n}\n\nfunction getSelectedStoreNames(stateObj) {\n  return stores.filter(store => stateObj[store.name]).map(store => store.name);\n}\n\nfunction selectAllStores(stateObj, gridId) {\n  Object.keys(stateObj).forEach(k => delete stateObj[k]);\n  stores.forEach(store => { stateObj[store.name] = true; });\n  renderStoreGrid(gridId, stateObj);\n}\n\nfunction setStoreSelection(stateObj, gridId, names) {\n  Object.keys(stateObj).forEach(k => delete stateObj[k]);\n  const normalized = (Array.isArray(names) ? names : [])\n    .map(normalizeStoreName)\n    .filter(Boolean);\n  normalized.forEach(name => { stateObj[name] = true; });\n  renderStoreGrid(gridId, stateObj);\n}\n\nfunction renderStoreManageList() {\n  const wrap = document.getElementById('storeManageList');\n  if (!wrap) return;\n  if (stores.length === 0) {\n    wrap.innerHTML = '\u003cdiv style=\"font-size:12px;color:var(--text3);text-align:center;padding:10px\">등록된 점포가 없습니다\u003c/div>';\n    return;\n  }\n  wrap.innerHTML = stores.map(s => `\n    \u003cdiv class=\"store-manage-item\">\n      \u003cspan class=\"store-dot-inline\" style=\"--store-color:${s.color}\">\u003c/span>\n      \u003cspan class=\"sm-name\">${esc(displayStoreName(s.name))}\u003c/span>\n      \u003cinput class=\"store-color\" type=\"color\" value=\"${s.color}\" title=\"${esc(displayStoreName(s.name))} 색상\"\n        onchange=\"updateStoreColor('${s._id}',this.value)\">\n      \u003cbutton class=\"btn btn-ghost btn-sm\" onclick=\"editStoreItem('${s._id}')\">✏️ 수정\u003c/button>\n      \u003cbutton class=\"btn btn-ghost btn-sm\" style=\"color:var(--danger)\" onclick=\"deleteStoreItem('${s._id}','${esc(s.name)}')\">🗑 삭제\u003c/button>\n    \u003c/div>\n  `).join('');\n}\n\nfunction addStoreItem() {\n  if (!db) { toast('Firebase 미연결', 'error'); return; }\n  const name = prompt('추가할 점포 이름을 입력하세요');\n  if (!name || !name.trim()) return;\n  const trimmed = name.trim().replace(/점$/,'').replace('건양대병원','건양대');\n  if (stores.some(s => s.name === trimmed)) { toast('이미 존재하는 점포입니다', 'error'); return; }\n  const id = db.ref('stores').push().key;\n  db.ref('stores/' + id).set({ _id: id, name: trimmed, color: '#8ca58f' })\n    .then(() => toast('✅ ' + trimmed + ' 점포 추가됨', 'success'))\n    .catch(e => toast('추가 실패: ' + e.message, 'error'));\n}\n\nfunction editStoreItem(id) {\n  if (!db) return;\n  const s = stores.find(x => x._id === id);\n  if (!s) return;\n  const name = prompt('점포 이름 수정', s.name);\n  if (!name || !name.trim() || name.trim() === s.name) return;\n  const trimmed = name.trim().replace(/점$/,'').replace('건양대병원','건양대');\n  if (stores.some(x => x.name === trimmed)) { toast('이미 존재하는 점포입니다', 'error'); return; }\n  db.ref('stores/' + id + '/name').set(trimmed)\n    .then(() => toast('✅ 점포명이 수정되었습니다', 'success'))\n    .catch(e => toast('수정 실패: ' + e.message, 'error'));\n}\n\nfunction updateStoreColor(id, color) {\n  if (!db) return;\n  db.ref('stores/' + id + '/color').set(color)\n    .then(() => toast('✅ 점포 색상이 변경되었습니다', 'success'))\n    .catch(e => toast('색상 저장 실패: ' + e.message, 'error'));\n}\n\nfunction renderHistoryStoreFilter() {\n  const select = document.getElementById('historyStoreFilter');\n  if (!select) return;\n  const previous = select.value || '전체';\n  select.innerHTML = '\u003coption value=\"전체\">전체 점포\u003c/option>' + stores.map(s =>\n    `\u003coption value=\"${esc(s.name)}\">${esc(displayStoreName(s.name))}\u003c/option>`\n  ).join('');\n  select.value = stores.some(s => s.name === previous) ? previous : '전체';\n}\n\nfunction deleteStoreItem(id, name) {\n  if (!db) return;\n  if (!confirm(`\"${name}\" 점포를 삭제할까요?`)) return;\n  db.ref('stores/' + id).remove()\n    .then(() => toast(name + ' 점포 삭제됨', 'success'))\n    .catch(e => toast('삭제 실패: ' + e.message, 'error'));\n}\n\nconst UNIT_TO_KG = { g: 0.001, kg: 1, ml: 0.001, L: 1, 개: 1, tbsp: 0.015, tsp: 0.005, 꼬집: 0.001 };\n\nfunction calcCosts() {\n  let rawTotal = 0;\n  ingRows.forEach(r => {\n    const factor = UNIT_TO_KG[r.unit] || 1;\n    const cost = r.qty * factor * r.unitPrice;\n    rawTotal += cost;\n    const cell = document.getElementById('cost-' + r.id);\n    if (cell) cell.textContent = fmt(cost) + '원';\n  });\n  const qty = Math.max(1, parseFloat(document.getElementById('fQty').value) || 1);\n  const oh  = parseFloat(document.getElementById('fOverhead').value) || 0;\n  const mg  = parseFloat(document.getElementById('fMargin').value) || 0;\n  const ohAmt = rawTotal * oh / 100;\n  const totalCost = rawTotal + ohAmt;\n  const perUnit = totalCost / qty;\n  const sellPerUnit = mg \u003c 100 ? perUnit / (1 - mg / 100) : 0;\n  document.getElementById('rawTotal').textContent = fmt(rawTotal);\n  document.getElementById('s-raw').textContent = fmt(rawTotal) + '원';\n  document.getElementById('s-oh').textContent = fmt(ohAmt) + '원';\n  document.getElementById('s-ohpct').textContent = oh;\n  document.getElementById('s-total').textContent = fmt(totalCost) + '원';\n  document.getElementById('s-unit').textContent = fmt(perUnit) + '원';\n  document.getElementById('s-sell').textContent = fmt(sellPerUnit * qty) + '원';\n  document.getElementById('s-mpct').textContent = mg;\n  document.getElementById('s-final').textContent = '₩ ' + fmt(Math.round(sellPerUnit / 100) * 100);\n}\n\nfunction fmt(n) { return Math.round(n).toLocaleString('ko-KR'); }\n\nfunction updateRegisterBtn() {\n  const name    = document.getElementById('fName').value.trim();\n  const price   = parseFloat(document.getElementById('fPrice').value) || 0;\n  const o1 = document.getElementById('origin1-text').value.trim();\n  const o2 = document.getElementById('origin2-text').value.trim();\n  const o3 = document.getElementById('origin3-text').value.trim();\n  const allergenSelected = ALLERGENS.some(a => allergenState[a]);\n  const allergenConfirmedChk = document.getElementById('allergenConfirm').checked;\n  const originOk = o1 && o2 && o3 && registrationOriginIds.every(id => registrationOriginChosen[id]);\n  const ready = name && price > 0 && originOk && (allergenSelected || allergenConfirmedChk);\n  const btn = document.getElementById('registerBtn');\n  btn.disabled = !ready;\n  btn.style.opacity = ready ? '' : '0.4';\n  btn.style.cursor  = ready ? '' : 'not-allowed';\n  const hintEl = document.getElementById('registerBtnHint');\n  if (!hintEl) return;\n  if (ready) { hintEl.textContent = ''; return; }\n  const missing = [];\n  if (!name) missing.push('제품이름');\n  if (price \u003c= 0) missing.push('판매 금액');\n  if (!o1 || !registrationOriginChosen['origin1-text']) missing.push('원산지 1순위 선택');\n  if (!o2 || !registrationOriginChosen['origin2-text']) missing.push('원산지 2순위 선택');\n  if (!o3 || !registrationOriginChosen['origin3-text']) missing.push('원산지 3순위 선택');\n  if (!allergenSelected && !allergenConfirmedChk) missing.push('알레르기 확인');\n  hintEl.textContent = '미입력: ' + missing.join(', ');\n}\n\nfunction updatePreview() {\n  const name = document.getElementById('fName').value.trim();\n  const cat  = document.getElementById('fCat').value;\n  const price = document.getElementById('fPrice').value;\n  const o1 = document.getElementById('origin1-text').value.trim();\n  const selected = ALLERGENS.filter(a => allergenState[a]);\n  updateRegisterBtn();\n  if (!name) {\n    document.getElementById('preview').innerHTML = '\u003cem style=\"color:var(--text3)\">제품이름을 입력하면 미리보기가 표시됩니다\u003c/em>';\n    return;\n  }\n  const catColor = CAT_COLORS[cat] || '#bdc3c7';\n  const allergenHtml = selected.length > 0\n    ? selected.map(a => `\u003cspan class=\"a-mini\">${a}\u003c/span>`).join('')\n    : '\u003cspan style=\"color:var(--text3);font-size:11px\">해당 없음\u003c/span>';\n  document.getElementById('preview').innerHTML = `\n    \u003cdiv style=\"display:flex;align-items:center;gap:6px;margin-bottom:6px\">\n      \u003cstrong style=\"color:var(--text);font-size:14px\">${name}\u003c/strong>\n      \u003cspan style=\"font-size:10px;padding:2px 7px;border-radius:20px;background:${catColor}33;color:${catColor};border:1px solid ${catColor}55\">${cat}\u003c/span>\n    \u003c/div>\n    ${price ? `\u003cdiv>💰 \u003cstrong style=\"color:var(--accent);font-family:var(--mono)\">₩${Number(price).toLocaleString('ko-KR')}\u003c/strong>\u003c/div>` : ''}\n    ${o1 ? `\u003cdiv style=\"margin-top:4px\">🌐 \u003cstrong style=\"color:var(--text)\">${o1}\u003c/strong>\u003c/div>` : ''}\n    \u003cdiv style=\"margin-top:6px;display:flex;flex-wrap:wrap;gap:3px\" class=\"allergen-mini\">${allergenHtml}\u003c/div>\n  `;\n}\n\nfunction normalizeProductName(name) {\n  return String(name || '').trim().replace(/\\s+/g, ' ');\n}\n\nasync function findProductKeyByName(name) {\n  if (!db) return null;\n  const target = normalizeProductName(name).toLowerCase();\n  if (!target) return null;\n  const snap = await db.ref('products').get();\n  const data = snap.val() || {};\n  const found = Object.entries(data).find(([key, p]) =>\n    p && normalizeProductName(p.제품이름).toLowerCase() === target\n  );\n  return found ? found[0] : null;\n}\n\nasync function registerProduct() {\n  const name = document.getElementById('fName').value.trim();\n  if (!name) { toast('제품이름을 입력해주세요', 'error'); document.getElementById('fName').focus(); document.getElementById('fName').classList.add('field-error'); return; }\n  document.getElementById('fName').classList.remove('field-error');\n  const cat = document.getElementById('fCat').value;\n  const price = parseFloat(document.getElementById('fPrice').value) || 0;\n  if (price \u003c= 0) { toast('판매 금액을 입력해주세요', 'error'); document.getElementById('fPrice').focus(); document.getElementById('fPrice').classList.add('field-error'); return; }\n  document.getElementById('fPrice').classList.remove('field-error');\n  const invalidOriginId = registrationOriginIds.find(id => !registrationOriginChosen[id]);\n  if (invalidOriginId) {\n    const rank = invalidOriginId.replace('origin','').replace('-text','');\n    toast(`원산지 ${rank}순위는 검색 결과를 선택하거나, 결과가 없을 때 '직접 입력'을 선택해주세요`, 'error');\n    document.getElementById(invalidOriginId).focus();\n    return;\n  }\n  const o1text = document.getElementById('origin1-text').value.trim();\n  if (!o1text) {\n    toast('원산지 1순위를 입력해주세요', 'error');\n    document.getElementById('origin1-text').classList.add('field-error'); document.getElementById('origin1-text').focus();\n    return;\n  }\n  document.getElementById('origin1-text').classList.remove('field-error');\n  const o2text = document.getElementById('origin2-text').value.trim();\n  if (!o2text) {\n    toast('원산지 2순위를 입력해주세요', 'error');\n    document.getElementById('origin2-text').classList.add('field-error'); document.getElementById('origin2-text').focus();\n    return;\n  }\n  document.getElementById('origin2-text').classList.remove('field-error');\n  const o3text = document.getElementById('origin3-text').value.trim();\n  if (!o3text) {\n    toast('원산지 3순위를 입력해주세요', 'error');\n    document.getElementById('origin3-text').classList.add('field-error'); document.getElementById('origin3-text').focus();\n    return;\n  }\n  document.getElementById('origin3-text').classList.remove('field-error');\n  const selectedAllergens = ALLERGENS.filter(a => allergenState[a]);\n  const confirmed = document.getElementById('allergenConfirm').checked;\n  if (selectedAllergens.length === 0 && !confirmed) {\n    document.getElementById('allergenRequiredMsg').style.display = 'block';\n    toast('알레르기 유발물질을 선택하거나 \"확인 완료\"를 체크해주세요', 'error');\n    return;\n  }\n  document.getElementById('allergenRequiredMsg').style.display = 'none';\n\n  const btn = document.getElementById('registerBtn');\n  btn.disabled = true; btn.textContent = '⏳ 등록 중...';\n  try {\n    const existingId = await findProductKeyByName(name);\n    const id = existingId || 'new_' + Date.now();\n    const now = new Date();\n    const dateStr = now.getFullYear() + '.' + String(now.getMonth()+1).padStart(2,'0') + '.' + String(now.getDate()).padStart(2,'0') + ' ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');\n    const origin = [\n      { rank:1, text:o1text },\n      { rank:2, text:o2text },\n      { rank:3, text:o3text },\n    ];\n    const recipe = ingRows.filter(r => r.name).map(r => ({\n      name: r.name, qty: r.qty, unit: r.unit, unitPrice: r.unitPrice,\n      cost: Math.round(r.qty * (UNIT_TO_KG[r.unit]||1) * r.unitPrice)\n    }));\n    const product = {\n      _id: id, _newProduct: true, _hidden: false, _showcardOriginOnly: false,\n      제품이름: name, 카테고리: cat, 판매금액: price,\n      원산지: origin, 원산지이미지: originImages.filter(Boolean),\n      배합표: recipe, 비고: document.getElementById('fNote').value.trim(),\n      판매점포: getSelectedStoreNames(selectedStores),\n      등록일시: dateStr, 등록상태: '신제품',\n    };\n    ALLERGENS.forEach(a => { product[a] = allergenState[a] ? 'Yes' : 'No'; });\n    if (!db) throw new Error('Firebase 미연결');\n    await db.ref('products/' + id).update(product);\n    lastRegistered = product;\n    toast('✅ ' + name + ' 등록 완료!', 'success');\n    showSuccessModal(product);\n  } catch(e) {\n    console.error(e);\n    toast('등록 실패: ' + e.message, 'error');\n  } finally {\n    btn.disabled = false; btn.style.opacity = ''; btn.style.cursor = '';\n    btn.innerHTML = '✅ 신제품 등록하기';\n    updateRegisterBtn();\n  }\n}\n\nfunction showSuccessModal(p) {\n  const selected = ALLERGENS.filter(a => p[a] === 'Yes');\n  const originStr = (p.원산지||[]).map(o=>`${o.rank}순위: ${originDisplay(o)}`).join(' / ') || '미입력';\n  document.getElementById('successContent').innerHTML = `\n    \u003cdiv style=\"margin-bottom:8px\">\u003cstrong style=\"color:var(--text)\">${p.제품이름}\u003c/strong> &nbsp;\n      \u003cspan style=\"font-size:11px;padding:2px 8px;border-radius:20px;background:${(CAT_COLORS[p.카테고리]||'#ccc')}33;color:${CAT_COLORS[p.카테고리]||'#ccc'}\">${p.카테고리}\u003c/span>\n    \u003c/div>\n    \u003cdiv>💰 판매가: \u003cstrong style=\"color:var(--accent);font-family:var(--mono)\">₩${Number(p.판매금액||0).toLocaleString('ko-KR')}\u003c/strong>\u003c/div>\n    \u003cdiv style=\"margin-top:4px\">🌐 원산지: ${originStr}\u003c/div>\n    \u003cdiv style=\"margin-top:6px;display:flex;flex-wrap:wrap;gap:3px\">\n      ${selected.map(a=>`\u003cspan class=\"a-mini\">${a}\u003c/span>`).join('') || '\u003cspan style=\"color:var(--text3);font-size:11px\">알레르기 없음\u003c/span>'}\n    \u003c/div>\n  `;\n  document.getElementById('successModal').classList.add('open');\n}\n\nfunction closeSuccess() { document.getElementById('successModal').classList.remove('open'); }\n\nfunction resetForm() {\n  closeSuccess();\n  document.getElementById('fName').value = '';\n  document.getElementById('fPrice').value = '';\n  document.getElementById('fNote').value = '';\n  ['origin1-text','origin2-text','origin3-text'].forEach(id => document.getElementById(id).value = '');\n  registrationOriginChosen = {};\n  selectAllStores(selectedStores, 'storeGrid');\n  originImages = [null,null,null];\n  for(let i=0;i\u003c3;i++) {\n    const s = document.getElementById('imgSlot'+i);\n    s.innerHTML = `\u003cspan style=\"font-size:18px;margin-bottom:2px\">📷\u003c/span>\u003cspan>이미지 ${i+1}\u003c/span>\u003cspan style=\"font-size:9px\">자동 압축 · 5MB 이하\u003c/span>\u003cinput type=\"file\" accept=\"image/jpeg,image/png,image/webp\" id=\"imgInput${i}\" onchange=\"handleOriginImg(${i},this)\" style=\"display:none\" onclick=\"event.stopPropagation()\">`;\n  }\n  clearAllergens();\n  allergenConfirmed = false;\n  document.getElementById('allergenConfirm').checked = false;\n  document.getElementById('allergenConfirmWrap').classList.remove('checked');\n  document.getElementById('allergenRequiredMsg').style.display = 'none';\n  document.querySelectorAll('.field-error').forEach(el => el.classList.remove('field-error'));\n  ingRows = []; renderIngRows(); addIngRow(); calcCosts();\n  document.getElementById('fQty').value = 12;\n  document.getElementById('fOverhead').value = 15;\n  document.getElementById('fMargin').value = 30;\n  updatePreview(); updateRegisterBtn();\n}\n\n/* ══════════════════════════════════════════════════ */\n/*  HISTORY                                           */\n/* ══════════════════════════════════════════════════ */\nlet historyCache = [];\nlet historyTab = 'pending'; // 'pending' | 'done'\nlet historyAdminUnlocked = false;\nconst COMPLETED_HISTORY_RETENTION_MONTHS = 1;\n\n/* ── 탭 전환 ── */\nfunction switchHistoryTab(tab) {\n  if (tab === 'uncategorized') tab = 'pending';\n  historyTab = tab;\n  document.querySelectorAll('.history-tab').forEach(b => b.classList.remove('active'));\n  document.getElementById('tab-' + tab).classList.add('active');\n  filterHistory();\n}\n\n/* ── 관리자 모드 토글 ── */\nfunction toggleHistoryAdminMode() {\n  const panel = document.getElementById('historyAdminPanel');\n  if (panel.style.display === 'none') {\n    panel.style.display = 'block';\n    if (!historyAdminUnlocked) {\n      setTimeout(() => document.getElementById('historyAdminPwInput').focus(), 100);\n    }\n  } else {\n    closeHistoryAdminMode();\n  }\n}\n\nfunction checkHistoryAdminPw() {\n  const val = document.getElementById('historyAdminPwInput').value;\n  if (val !== getSettingsPw()) {\n    document.getElementById('historyAdminPwErr').style.display = 'block';\n    document.getElementById('historyAdminPwInput').value = '';\n    document.getElementById('historyAdminPwInput').focus();\n    return;\n  }\n  document.getElementById('historyAdminPwErr').style.display = 'none';\n  historyAdminUnlocked = true;\n  document.getElementById('historyAdminLockArea').style.display = 'none';\n  document.getElementById('historyAdminActiveArea').style.display = 'block';\n  const btn = document.getElementById('historyAdminBtn');\n  btn.style.background = 'rgba(26,125,68,.12)';\n  btn.style.borderColor = 'rgba(26,125,68,.4)';\n  btn.style.color = 'var(--success)';\n  btn.textContent = '✅ 관리자 모드 ON';\n  // 완료 체크박스 열 표시\n  document.getElementById('th-complete').style.display = '';\n  filterHistory();\n}\n\nfunction closeHistoryAdminMode() {\n  historyAdminUnlocked = false;\n  document.getElementById('historyAdminPanel').style.display = 'none';\n  document.getElementById('historyAdminLockArea').style.display = 'block';\n  document.getElementById('historyAdminActiveArea').style.display = 'none';\n  document.getElementById('historyAdminPwInput').value = '';\n  document.getElementById('historyAdminPwErr').style.display = 'none';\n  const btn = document.getElementById('historyAdminBtn');\n  btn.style.background = 'var(--surface2)';\n  btn.style.borderColor = 'var(--border)';\n  btn.style.color = 'var(--text2)';\n  btn.textContent = '🔐 관리자 모드';\n  document.getElementById('th-complete').style.display = 'none';\n  filterHistory();\n}\n\n/* ── 완료 처리 ── */\nasync function toggleProductDone(id, currentDone) {\n  if (!historyAdminUnlocked) { toast('관리자 모드에서만 변경 가능합니다', 'error'); return; }\n  if (!db) return;\n  const newDone = !currentDone;\n  try {\n    const updates = {};\n    updates['products/' + id + '/완료처리'] = newDone ? true : null;\n    if (newDone) {\n      updates['products/' + id + '/완료일시'] = nowStr();\n      updat
