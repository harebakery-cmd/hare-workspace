images.map((img, idx) => (\r\n          \u003cdiv key={img.id || idx} className=\"originlabel-print-image\">\r\n            \u003cimg src={img.src} alt=\"\" />\r\n          \u003c/div>\r\n        ))}\r\n      \u003c/div>\r\n    \u003c/section>\r\n  );\r\n}\r\n\r\nfunction OriginLabelMiniSheet({ item, settings, designs }) {\r\n  const images = (item.images || []).slice(0, 6);\r\n  return (\r\n    \u003cdiv className=\"originlabel-sheet-mini\">\r\n      \u003cdiv style={{ display: \"flex\", justifyContent: \"center\", paddingBottom: 6 }}>\r\n        \u003cShowCard card={item.card} settings={settings} designs={designs} scale={SCREEN_SCALE * 0.25} />\r\n      \u003c/div>\r\n      \u003cdiv style={{ display: \"grid\", gridTemplateColumns: \"1fr 1fr\", gap: 4, marginTop: 10 }}>\r\n        {images.map((img, idx) => (\r\n          \u003cdiv key={img.id || idx} style={{ height: 58, border: \"1px solid #d8c9bb\", display: \"flex\", alignItems: \"center\", justifyContent: \"center\", overflow: \"hidden\" }}>\r\n            \u003cimg src={img.src} alt=\"\" style={{ width: \"100%\", height: \"100%\", objectFit: \"contain\" }} />\r\n          \u003c/div>\r\n        ))}\r\n      \u003c/div>\r\n    \u003c/div>\r\n  );\r\n}\r\n\r\n/* ═══════════════════════ Manage tab ═══════════════════════ */\r\n\r\nfunction DesignAndSizeCard({ type, label, settings, setSettings, designs, setDesigns }) {\r\n  const [busy, setBusy] = useState(false);\r\n  const fileInputRef = useRef(null);\r\n  const size = settings.sizes[type];\r\n  const design = designs[type];\r\n  const sample = SAMPLE_CARDS[type];\r\n\r\n  function updateSize(key, val) {\r\n    setSettings(s => ({ ...s, sizes: { ...s.sizes, [type]: { ...s.sizes[type], [key]: val } } }));\r\n  }\r\n  function setDesign(patch) {\r\n    setDesigns(d => ({ ...d, [type]: { ...d[type], ...patch } }));\r\n  }\r\n\r\n  async function handleFile(e) {\r\n    const file = e.target.files && e.target.files[0];\r\n    e.target.value = \"\";\r\n    if (!file) return;\r\n    setBusy(true);\r\n    try {\r\n      const isPdf = file.type === \"application/pdf\" || /\\.pdf$/i.test(file.name);\r\n      if (isPdf) {\r\n        const buf = await file.arrayBuffer();\r\n        const pdf = await pdfjsLib.getDocument({ data: buf }).promise;\r\n        const page = await pdf.getPage(1);\r\n        const base = page.getViewport({ scale: 1 });\r\n        // Render at a high scale for print-quality output (~ roughly 300dpi+ at target mm size)\r\n        const targetPxWidth = mmToPx(size.width, 3.78 * 3.2);\r\n        const renderScale = Math.max(6, targetPxWidth / base.width);\r\n        const viewport = page.getViewport({ scale: renderScale });\r\n        const canvas = document.createElement(\"canvas\");\r\n        canvas.width = viewport.width;\r\n        canvas.height = viewport.height;\r\n        const ctx = canvas.getContext(\"2d\");\r\n        await page.render({ canvasContext: ctx, viewport }).promise;\r\n        setDesign({ image: canvas.toDataURL(\"image/png\", 1.0), fileKind: \"pdf\", fileName: file.name });\r\n      } else {\r\n        const dataUrl = await new Promise((resolve, reject) => {\r\n          const reader = new FileReader();\r\n          reader.onload = () => resolve(reader.result);\r\n          reader.onerror = reject;\r\n          reader.readAsDataURL(file);\r\n        });\r\n        const kind = /\\.svg$/i.test(file.name) || file.type === \"image/svg+xml\" ? \"svg\" : \"raster\";\r\n        setDesign({ image: dataUrl, fileKind: kind, fileName: file.name });\r\n      }\r\n    } catch (err) {\r\n      console.error(err);\r\n      alert(\"이미지를 불러오지 못했습니다. 파일 형식을 확인해 주세요.\");\r\n    } finally {\r\n      setBusy(false);\r\n    }\r\n  }\r\n\r\n  function resetDesign() {\r\n    setDesign({ image: null, fileKind: null, fileName: \"\" });\r\n  }\r\n\r\n  return (\r\n    \u003cdiv className=\"design-card\">\r\n      \u003cdiv className=\"design-card-top\">\r\n        \u003cdiv className=\"design-preview-box\">\r\n          \u003cShowCard card={sample} settings={settings} designs={designs} scale={SCREEN_SCALE * 0.6} />\r\n        \u003c/div>\r\n        \u003cdiv className=\"design-info\">\r\n          \u003cp className=\"design-title\">\r\n            {label}\r\n            {design.image && (\r\n              \u003cspan className=\"design-badge\">\r\n                {design.fileKind === \"svg\" ? \"SVG 업로드\" : design.fileKind === \"pdf\" ? \"PDF 업로드\" : \"이미지 업로드\"}\r\n              \u003c/span>\r\n            )}\r\n          \u003c/p>\r\n          \u003cp className=\"design-meta\">\r\n            {type === \"no-origin\" ? \"원산지 표기 없음\" : getStyleMode(type) === \"season\" ? \"시즌 특별 디자인\" :\r\n             type === \"cookie\" ? \"정방형 소형 카드\" : type === \"small\" ? \"컴팩트 사이즈\" : \"기본 표준 카드\"}\r\n            {design.fileName ? ` · ${design.fileName}` : \"\"}\r\n          \u003c/p>\r\n\r\n          \u003cdiv className=\"design-size-row\">\r\n            \u003clabel className=\"mini-num\">\r\n              \u003cspan>가로\u003c/span>\r\n              \u003cinput type=\"number\" min={30} max={200} step={1} value={size.width}\r\n                onChange={(e) => updateSize(\"width\", Number(e.target.value))} />\r\n              \u003cspan className=\"unit\">mm\u003c/span>\r\n            \u003c/label>\r\n            \u003clabel className=\"mini-num\">\r\n              \u003cspan>세로\u003c/span>\r\n              \u003cinput type=\"number\" min={20} max={200} step={1} value={size.height}\r\n                onChange={(e) => updateSize(\"height\", Number(e.target.value))} />\r\n              \u003cspan className=\"unit\">mm\u003c/span>\r\n            \u003c/label>\r\n          \u003c/div>\r\n\r\n          \u003cp className=\"design-hint\">\r\n            디자인은 GitHub의 images/showcard/{design.fileName || `${type}.png`} 파일을 사용합니다.\r\n            디자인을 바꾸려면 GitHub에서 같은 이름의 파일을 교체하세요.\r\n          \u003c/p>\r\n        \u003c/div>\r\n      \u003c/div>\r\n\r\n      \u003cdiv className=\"position-section\">\r\n        \u003cp className=\"position-section-title\">텍스트 위치 조정 (%) \u003cspan>— 입력창 클릭 후 키보드 화살표로도 이동 가능 · 각 항목은 서로 영향 없이 독립적으로 움직입니다\u003c/span>\u003c/p>\r\n        \u003cdiv className=\"position-grid\">\r\n          {POSITION_FIELDS.map(({ key, label: fLabel }) => (\r\n            \u003cPositionControl key={key} label={fLabel} pos={getPos(settings, type, key)} defaultPos={POSITION_PRESETS[type][key]}\r\n              onChange={(pos) => setSettings(s => ({ ...s, positions: { ...s.positions, [type]: { ...s.positions[type], [key]: pos } } }))} />\r\n          ))}\r\n        \u003c/div>\r\n      \u003c/div>\r\n    \u003c/div>\r\n  );\r\n}\r\n\r\nfunction PositionControl({ label, pos, defaultPos, onChange }) {\r\n  const step = 1;\r\n  function clamp(v) { return Math.max(0, Math.min(100, v)); }\r\n  function nudge(dx, dy) {\r\n    const nx = clamp(Math.round((pos.x + dx * step) * 10) / 10);\r\n    const ny = clamp(Math.round((pos.y + dy * step) * 10) / 10);\r\n    onChange({ x: nx, y: ny });\r\n  }\r\n  function handleKeyDown(e) {\r\n    const map = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };\r\n    if (map[e.key]) {\r\n      e.preventDefault();\r\n      nudge(map[e.key][0], map[e.key][1]);\r\n    }\r\n  }\r\n  const moved = pos.x !== defaultPos.x || pos.y !== defaultPos.y;\r\n  return (\r\n    \u003cdiv className=\"position-control\" onKeyDown={handleKeyDown}>\r\n      \u003cdiv className=\"position-control-head\">\r\n        \u003cspan>{label}\u003c/span>\r\n        {moved && \u003cbutton className=\"pos-reset\" onClick={() => onChange({ ...defaultPos })}>초기화\u003c/button>}\r\n      \u003c/div>\r\n      \u003cdiv className=\"position-control-body\">\r\n        \u003cdiv className=\"pos-xy\">\r\n          \u003clabel>\r\n            \u003cspan>X\u003c/span>\r\n            \u003cinput type=\"number\" min={0} max={100} step={1} value={pos.x} onChange={(e) => onChange({ ...pos, x: clamp(Number(e.target.value) || 0) })} />\r\n          \u003c/label>\r\n          \u003clabel>\r\n            \u003cspan>Y\u003c/span>\r\n            \u003cinput type=\"number\" min={0} max={100} step={1} value={pos.y} onChange={(e) => onChange({ ...pos, y: clamp(Number(e.target.value) || 0) })} />\r\n          \u003c/label>\r\n        \u003c/div>\r\n        \u003cdiv className=\"pos-arrows\">\r\n          \u003cbutton tabIndex={-1} className=\"pos-arrow up\" onClick={() => nudge(0, -1)}>\u003cIconChevronUp size={11} />\u003c/button>\r\n          \u003cbutton tabIndex={-1} className=\"pos-arrow left\" onClick={() => nudge(-1, 0)}>\u003cIconChevronLeft size={11} />\u003c/button>\r\n          \u003cbutton tabIndex={-1} className=\"pos-arrow down\" onClick={() => nudge(0, 1)}>\u003cIconChevronDown size={11} />\u003c/button>\r\n          \u003cbutton tabIndex={-1} className=\"pos-arrow right\" onClick={() => nudge(1, 0)}>\u003cIconChevronRight size={11} />\u003c/button>\r\n        \u003c/div>\r\n      \u003c/div>\r\n    \u003c/div>\r\n  );\r\n}\r\n\r\nfunction NumberInput({ label, value, onChange, min, max, step = 0.5, unit = \"\" }) {\r\n  return (\r\n    \u003cdiv className=\"num-row\">\r\n      \u003cspan>{label}\u003c/span>\r\n      \u003cdiv className=\"num-input-grp\">\r\n        \u003cinput type=\"number\" value={value} onChange={(e) => onChange(Number(e.target.value))} min={min} max={max} step={step} />\r\n        {unit && \u003cspan className=\"unit\">{unit}\u003c/span>}\r\n      \u003c/div>\r\n    \u003c/div>\r\n  );\r\n}\r\n\r\nfunction ColorInput({ label, value, onChange }) {\r\n  return (\r\n    \u003cdiv className=\"color-row\">\r\n      \u003cspan>{label}\u003c/span>\r\n      \u003cdiv className=\"swatch-grp\">\r\n        \u003cinput type=\"color\" value={value} onChange={(e) => onChange(e.target.value)} />\r\n        \u003cspan className=\"hex\">{value}\u003c/span>\r\n      \u003c/div>\r\n    \u003c/div>\r\n  );\r\n}\r\n\r\nfunction AlignmentInput({ value, onChange }) {\r\n  return (\r\n    \u003clabel className=\"align-row\">\r\n      \u003cspan>정렬\u003c/span>\r\n      \u003cselect value={value || \"center\"} onChange={(e) => onChange(e.target.value)}>\r\n        \u003coption value=\"left\">왼쪽\u003c/option>\r\n        \u003coption value=\"center\">가운데\u003c/option>\r\n        \u003coption value=\"right\">오른쪽\u003c/option>\r\n      \u003c/select>\r\n    \u003c/label>\r\n  );\r\n}\r\n\r\nfunction FontFieldRow({ label, fieldKey, settings, setSettings, styleMode, profile }) {\r\n  const currentId = profile.fontFamilies[fieldKey] || \"freesentation\";\r\n  const [busy, setBusy] = useState(false);\r\n\r\n  async function handleUpload(e) {\r\n    const file = e.target.files && e.target.files[0];\r\n    e.target.value = \"\";\r\n    if (!file) return;\r\n    setBusy(true);\r\n    try {\r\n      await uploadCustomFont(file, fieldKey, setSettings, styleMode);\r\n    } finally {\r\n      setBusy(false);\r\n    }\r\n  }\r\n\r\n  function handleSelect(e) {\r\n    const v = e.target.value;\r\n    setSettings(s => {\r\n      const active = getStyleProfile(s, styleMode);\r\n      return {\r\n        ...s,\r\n        styleProfiles: {\r\n          ...(s.styleProfiles || {}),\r\n          [styleMode]: { ...active, fontFamilies: { ...active.fontFamilies, [fieldKey]: v } },\r\n        },\r\n      };\r\n    });\r\n  }\r\n\r\n  return (\r\n    \u003cdiv className=\"font-field-row\">\r\n      \u003cspan>{label}\u003c/span>\r\n      \u003cdiv className=\"font-field-controls\">\r\n        \u003cselect value={currentId} onChange={handleSelect}>\r\n          \u003coption value=\"freesentation\">프리젠테이션\u003c/option>\r\n          \u003coption value=\"system-sans\">시스템 고딕\u003c/option>\r\n          \u003coption value=\"serif\">명조 계열\u003c/option>\r\n          \u003coption value=\"monospace\">고정폭\u003c/option>\r\n          {(settings.customFonts || []).map(f => \u003coption key={f.id} value={f.id}>{f.label}\u003c/option>)}\r\n        \u003c/select>\r\n        \u003clabel className=\"upload-label-sm\">\r\n          \u003cIconUpload size={10} /> {busy ? \"...\" : \"TTF(현재기기)\"}\r\n          \u003cinput type=\"file\" accept=\".ttf,font/ttf,font/sfnt\" disabled={busy} onChange={handleUpload} />\r\n        \u003c/label>\r\n      \u003c/div>\r\n    \u003c/div>\r\n  );\r\n}\r\n\r\nfunction ManageTab({ settings, setSettings, designs, setDesigns, onSave, saving, savedAt, error, loaded, reloadProducts, reloadOrigins }) {\r\n  const [manageMode, setManageMode] = useState(\"basic\");\r\n  const [presetStatus, setPresetStatus] = useState(\"\");\r\n  const profile = getStyleProfile(settings, manageMode);\r\n  const visibleTypes = CARD_TYPE_LIST.filter(t => getStyleMode(t.id) === manageMode);\r\n  const fieldConfigs = [\r\n    { key: \"description\", label: \"제품 설명\", sizeKey: \"descriptionSize\", min: 4, max: 14 },\r\n    { key: \"name\", label: \"제품명\", sizeKey: \"nameSize\", min: 8, max: 30 },\r\n    { key: \"origin\", label: \"원산지\", sizeKey: \"originSize\", min: 4, max: 14 },\r\n    { key: \"price\", label: \"가격\", sizeKey: \"priceSize\", min: 8, max: 30 },\r\n    { key: \"allergen\", label: \"알레르기 유발물질\", sizeKey: \"allergenSize\", min: 4, max: 12 },\r\n  ];\r\n\r\n  function updateProfile(updater) {\r\n    setSettings(s => {\r\n      const active = getStyleProfile(s, manageMode);\r\n      const nextProfile = typeof updater === \"function\" ? updater(active) : updater;\r\n      return { ...s, styleProfiles: { ...(s.styleProfiles || {}), [manageMode]: nextProfile } };\r\n    });\r\n  }\r\n  function updateFont(key, val) {\r\n    updateProfile(p => ({ ...p, fonts: { ...p.fonts, [key]: val } }));\r\n  }\r\n  function updateLineHeight(key, val) {\r\n    updateProfile(p => ({ ...p, lineHeights: { ...p.lineHeights, [key]: val } }));\r\n  }\r\n  function updateColor(key, val) {\r\n    updateProfile(p => ({ ...p, colors: { ...p.colors, [key]: val } }));\r\n  }\r\n  function updateAlignment(key, val) {\r\n    updateProfile(p => ({ ...p, alignments: { ...p.alignments, [key]: val } }));\r\n  }\r\n  function saveStylePreset(slot) {\r\n    const snapshot = cloneStyleProfile(profile);\r\n    const next = {\r\n      ...settings,\r\n      stylePresets: {\r\n        ...(settings.stylePresets || {}),\r\n        [manageMode]: { ...((settings.stylePresets || {})[manageMode] || {}), [slot]: snapshot },\r\n      },\r\n    };\r\n    setSettings(next);\r\n    setPresetStatus(`${manageMode === \"season\" ? \"시즌\" : \"기본\"} 쇼카드 · ${slot === \"list1\" ? \"리스트 1\" : \"리스트 2\"} 저장됨`);\r\n    onSave(next);\r\n  }\r\n  function loadStylePreset(slot) {\r\n    const saved = settings.stylePresets && settings.stylePresets[manageMode] && settings.stylePresets[manageMode][slot];\r\n    if (!saved) {\r\n      setPresetStatus(`${slot === \"list1\" ? \"리스트 1\" : \"리스트 2\"}에 저장된 설정이 없습니다.`);\r\n      return;\r\n    }\r\n    updateProfile(cloneStyleProfile(saved));\r\n    setPresetStatus(`${slot === \"list1\" ? \"리스트 1\" : \"리스트 2\"} 설정을 불러왔습니다. 위 저장 버튼을 누르면 전체 직원에게 반영됩니다.`);\r\n  }\r\n  function resetCurrentMode() {\r\n    const ids = visibleTypes.map(t => t.id);\r\n    const nextPositions = { ...settings.positions };\r\n    const nextSizes = { ...settings.sizes };\r\n    ids.forEach(id => {\r\n      nextPositions[id] = JSON.parse(JSON.stringify(POSITION_PRESETS[id]));\r\n      nextSizes[id] = { ...DEFAULT_SETTINGS.sizes[id] };\r\n    });\r\n    setSettings(s => ({\r\n      ...s,\r\n      sizes: nextSizes,\r\n      positions: nextPositions,\r\n      styleProfiles: { ...(s.styleProfiles || {}), [manageMode]: cloneStyleProfile() },\r\n    }));\r\n    setPresetStatus(`${manageMode === \"season\" ? \"시즌\" : \"기본\"} 쇼카드 설정을 기본값으로 되돌렸습니다.`);\r\n  }\r\n\r\n  const [bulkStatus, setBulkStatus] = useState(\"idle\"); // idle | parsing | uploading | done | error\r\n  const [bulkResult, setBulkResult] = useState(null);\r\n  const [bulkError, setBulkError] = useState(null);\r\n  const bulkFileInputRef = useRef(null);\r\n\r\n  async function handleBulkFile(e) {\r\n    const file = e.target.files && e.target.files[0];\r\n    if (!file) return;\r\n    setBulkStatus(\"parsing\");\r\n    setBulkError(null);\r\n    setBulkResult(null);\r\n    try {\r\n      const { parsedRows, skipped } = await parseBulkUploadFile(file);\r\n      if (parsedRows.length === 0) {\r\n        throw new Error(\"업로드할 수 있는 행이 없습니다. 제품명이 채워진 행이 있는지 확인해주세요.\");\r\n      }\r\n      const confirmMsg =\r\n        `총 ${parsedRows.length}개 제품을 업로드합니다` +\r\n        (skipped.length > 0 ? ` (제품명이 비어 건너뛴 행 ${skipped.length}개 있음)` : \"\") +\r\n        `.\\n제품명·원산지·낱개/세트 금액·알레르기가 저장되고, 원산지는 \"저장된 표기\" 목록에도 추가됩니다.\\n계속할까요?`;\n      if (!window.confirm(confirmMsg)) {\r\n        setBulkStatus(\"idle\");\r\n        e.target.value = \"\";\r\n        return;\r\n      }\r\n      setBulkStatus(\"uploading\");\r\n      const result = await applyBulkUpload(parsedRows);\r\n      setBulkResult({ ...result, skipped, totalRows: parsedRows.length });\r\n      setBulkStatus(\"done\");\r\n      reloadProducts && reloadProducts();\r\n      reloadOrigins && reloadOrigins();\r\n    } catch (err) {\r\n      setBulkError(err.message || \"업로드 중 오류가 발생했습니다\");\r\n      setBulkStatus(\"error\");\r\n    } finally {\r\n      e.target.value = \"\";\r\n    }\r\n  }\r\n\r\n  return (\r\n    \u003cdiv className=\"manage-wrap\">\r\n      \u003cdiv className=\"manage-mode-tabs\" role=\"tablist\" aria-label=\"쇼카드 관리 구분\">\r\n        \u003cbutton type=\"button\" role=\"tab\" aria-selected={manageMode === \"basic\"}\r\n          className={`manage-mode-tab ${manageMode === \"basic\" ? \"active\" : \"\"}`}\r\n          onClick={() => { setManageMode(\"basic\"); setPresetStatus(\"\"); }}>\r\n          기본 쇼카드\r\n        \u003c/button>\r\n        \u003cbutton type=\"button\" role=\"tab\" aria-selected={manageMode === \"season\"}\r\n          className={`manage-mode-tab ${manageMode === \"season\" ? \"active\" : \"\"}`}\r\n          onClick={() => { setManageMode(\"season\"); setPresetStatus(\"\"); }}>\r\n          시즌 쇼카드\r\n        \u003c/button>\r\n      \u003c/div>\r\n\r\n      \u003cdiv className=\"manage-savebar\">\r\n        \u003cdiv className=\"manage-savebar-info\">\r\n          {!loaded ? (\r\n            \u003cspan className=\"manage-savebar-status\">\u003cIconRefresh size={12} className=\"spin\" /> 저장된 설정 불러오는 중...\u003c/span>\r\n          ) : error ? (\r\n            \u003cspan className=\"manage-savebar-status error\">\u003cIconAlert size={12} /> {error}\u003c/span>\r\n          ) : savedAt ? (\r\n            \u003cspan className=\"manage-savebar-status ok\">\u003cIconCheck size={12} /> {new Date(savedAt).toLocaleString(\"ko-KR\")} 저장됨 — 모든 지점에 동일하게 반영됩니다\u003c/span>\r\n          ) : (\r\n            \u003cspan className=\"manage-savebar-status\">{manageMode === \"season\" ? \"시즌\" : \"기본\"} 쇼카드의 폰트 · 크기 · 색상 · 정렬 · 위치는 저장 버튼을 눌러야 모든 지점에 반영됩니다.\u003c/span>\r\n          )}\r\n        \u003c/div>\r\n        \u003cbutton className=\"manage-save-btn\" onClick={() => onSave(settings)} disabled={saving || !loaded}>\r\n          \u003cIconSave size={13} /> {saving ? \"저장 중...\" : `${manageMode === \"season\" ? \"시즌\" : \"기본\"} 쇼카드 저장`}\r\n        \u003c/button>\r\n      \u003c/div>\r\n\r\n      {manageMode === \"basic\" && \u003csection className=\"manage-bulk-section\">\r\n        \u003cdiv className=\"manage-section-head\">\r\n          \u003cIconUpload size={15} style={{ color: \"#B5762A\" }} />\r\n          \u003ch2>제품 엑셀 일괄 업로드\u003c/h2>\r\n          \u003cspan className=\"sub\">— 제품명 · 낱개/세트 금액 · 원산지 1~6순위 · 알레르기 유발물질을 엑셀로 한 번에 저장하세요\u003c/span>\n        \u003c/div>\r\n        \u003cdiv className=\"bulk-upload-card\">\r\n          \u003cp className=\"bulk-upload-desc\">\r\n            틀을 내려받아 제품명 / 낱개 금액 / 세트 금액(선택) / 원산지 순위(최소 1개, 최대 6개) / 알레르기 유발물질을 채운 뒤 업로드하면,\n            제품 목록(\"알레르기 자료에서 자동 불러오기\")과 \"저장된 표기\" 원산지 목록에 한 번에 반영됩니다.\r\n            이미 있는 제품명과 같으면 새로 만들지 않고 해당 제품 정보가 갱신됩니다.\r\n          \u003c/p>\r\n          \u003cdiv className=\"bulk-upload-actions\">\r\n            \u003cbutton type=\"button\" className=\"bulk-btn bulk-btn-secondary\" onClick={downloadBulkUploadTemplate}>\r\n              \u003cIconDownload size={13} /> 엑셀 틀 다운로드\r\n            \u003c/button>\r\n            \u003cbutton type=\"button\" className=\"bulk-btn bulk-btn-primary\" disabled={bulkStatus === \"parsing\" || bulkStatus === \"uploading\"}\r\n              onClick={() => bulkFileInputRef.current && bulkFileInputRef.current.click()}>\r\n              {bulkStatus === \"parsing\" ? (\u003c>\u003cIconRefresh size={13} className=\"spin\" /> 파일 읽는 중...\u003c/>)\r\n                : bulkStatus === \"uploading\" ? (\u003c>\u003cIconRefresh size={13} className=\"spin\" /> 업로드 중...\u003c/>)\r\n                : (\u003c>\u003cIconUpload size={13} /> 엑셀 업로드\u003c/>)}\r\n            \u003c/button>\r\n            \u003cinput ref={bulkFileInputRef} type=\"file\" accept=\".xlsx,.xls,.csv\" style={{ display: \"none\" }} onChange={handleBulkFile} />\r\n          \u003c/div>\r\n\r\n          {bulkStatus === \"error\" && bulkError && (\r\n            \u003cp className=\"bulk-result bulk-result-error\">\u003cIconAlert size={12} /> {bulkError}\u003c/p>\r\n          )}\r\n\r\n          {bulkStatus === \"done\" && bulkResult && (\r\n            \u003cdiv className=\"bulk-result bulk-result-ok\">\r\n              \u003cp>\u003cIconCheck size={12} /> 업로드 완료 — 신규 {bulkResult.created}건 · 갱신 {bulkResult.updated}건 · 원산지 새 표기 {bulkResult.originsAdded}건 저장됨\u003c/p>\r\n              {bulkResult.priceSkipped > 0 && (\r\n                \u003cp className=\"bulk-result-sub\">낱개 금액이 비어 있거나 인식되지 않아 건너뛴 제품 {bulkResult.priceSkipped}건 (기존 금액 유지)\u003c/p>\n              )}\r\n              {bulkResult.skipped && bulkResult.skipped.length > 0 && (\r\n                \u003cp className=\"bulk-result-sub\">제품명이 없어 건너뛴 행: {bulkResult.skipped.map(s => s.row).join(\", \")}\u003c/p>\r\n              )}\r\n              {bulkResult.allergenWarnings && bulkResult.allergenWarnings.length > 0 && (\r\n                \u003cul className=\"bulk-result-warnings\">\r\n                  {bulkResult.allergenWarnings.map((w, i) => \u003cli key={i}>{w}\u003c/li>)}\r\n                \u003c/ul>\r\n              )}\r\n            \u003c/div>\r\n          )}\r\n        \u003c/div>\r\n      \u003c/section>}\r\n\r\n      \u003cdiv className=\"manage-columns\">\r\n        \u003csection className=\"manage-col-left\">\r\n          \u003cdiv className=\"manage-section-head\">\r\n            \u003cIconImage size={15} style={{ color: \"#B5762A\" }} />\r\n            \u003ch2>카드 종류별 디자인 &amp; 사이즈\u003c/h2>\r\n            \u003cspan className=\"sub\">— 직접 만든 디자인을 업로드하고, 같은 곳에서 사이즈까지 설정하세요\u003c/span>\r\n          \u003c/div>\r\n          \u003cdiv className=\"design-grid\">\r\n            {visibleTypes.map(({ id, label }) => (\r\n              \u003cDesignAndSizeCard key={id} type={id} label={label} settings={settings} setSettings={setSettings}\r\n                designs={designs} setDesigns={setDesigns} />\r\n            ))}\r\n          \u003c/div>\r\n        \u003c/section>\r\n\r\n        \u003csection className=\"manage-col-right\">\r\n          \u003cdiv className=\"manage-section-head\">\r\n            \u003cIconSettings size={15} style={{ color: \"#B5762A\" }} />\r\n            \u003ch2>{manageMode === \"season\" ? \"시즌\" : \"기본\"} 쇼카드 글자 설정\u003c/h2>\r\n            \u003cspan className=\"sub\">— 크기 · 줄간격 · 폰트 · 색상 · 정렬을 항목별로 저장합니다\u003c/span>\r\n          \u003c/div>\r\n\r\n          \u003cdiv className=\"preset-card\">\r\n            \u003cp className=\"preset-title\">서식 리스트 저장 / 불러오기\u003c/p>\r\n            \u003cp className=\"preset-desc\">현재 다섯 항목의 글자 설정을 리스트 1 또는 2에 저장해 두고 한 번에 다시 적용할 수 있습니다.\u003c/p>\r\n            \u003cdiv className=\"preset-list\">\r\n              {[\"list1\", \"list2\"].map((slot, index) => {\r\n                const exists = !!(settings.stylePresets && settings.stylePresets[manageMode] && settings.stylePresets[manageMode][slot]);\r\n                return (\r\n                  \u003cdiv className=\"preset-row\" key={slot}>\r\n                    \u003cspan className=\"preset-row-name\">리스트 {index + 1}{exists ? \" ✓\" : \"\"}\u003c/span>\r\n                    \u003cbutton type=\"button\" className=\"preset-btn primary\" onClick={() => saveStylePreset(slot)}>현재값 저장\u003c/button>\r\n                    \u003cbutton type=\"button\" className=\"preset-btn\" onClick={() => loadStylePreset(slot)}>불러오기\u003c/button>\r\n                  \u003c/div>\r\n                );\r\n              })}\r\n            \u003c/div>\r\n            \u003cdiv className=\"preset-state\">{presetStatus}\u003c/div>\r\n          \u003c/div>\r\n\r\n          \u003cdiv className=\"settings-card\">\r\n            {fieldConfigs.map(field => (\r\n              \u003cdiv className=\"field-group\" key={field.key}>\r\n                \u003cp className=\"field-group-title\">{field.label}\u003c/p>\r\n                \u003cNumberInput label=\"크기\" value={profile.fonts[field.sizeKey]} onChange={(v) => updateFont(field.sizeKey, v)}\n                  min={field.min} max={field.max} step={0.5} unit=\"pt\" />\n                {field.key === \"price\" && (\n                  \u003c>\n                    \u003cNumberInput label=\"세트·낱개 표기 크기\" value={profile.fonts.priceLabelSize} onChange={(v) => updateFont(\"priceLabelSize\", v)}\n                      min={4} max={14} step={0.5} unit=\"pt\" />\n                    \u003cColorInput label=\"세트·낱개 단어 색상\" value={profile.colors.priceLabel} onChange={(v) => updateColor(\"priceLabel\", v)} />\n                  \u003c/>\n                )}\n                \u003cNumberInput label=\"줄간격\" value={profile.lineHeights[field.key]} onChange={(v) => updateLineHeight(field.key, v)}\r\n                  min={0.8} max={2} step={0.05} unit=\"배\" />\r\n                \u003cFontFieldRow label=\"폰트\" fieldKey={field.key} settings={settings} setSettings={setSettings}\r\n                  styleMode={manageMode} profile={profile} />\r\n                \u003cColorInput label={field.key === \"price\" ? \"금액 색상\" : \"글자 색상\"} value={profile.colors[field.key]} onChange={(v) => updateColor(field.key, v)} />\n                \u003cAlignmentInput value={profile.alignments[field.key]} onChange={(v) => updateAlignment(field.key, v)} />\r\n              \u003c/div>\r\n            ))}\r\n          \u003c/div>\r\n\r\n          \u003cbutton className=\"reset-all-btn\" onClick={resetCurrentMode}>\r\n            \u003cIconRefresh size={11} /> {manageMode === \"season\" ? \"시즌\" : \"기본\"} 설정 초기화\r\n          \u003c/button>\r\n        \u003c/section>\r\n      \u003c/div>\r\n    \u003c/div>\r\n  );\r\n}\r\n\r\n/* ═══════════════════════ App ═══════════════════════ */\r\n\r\nfunction App() {\r\n  const [mainTab, setMainTab] = useState(\"print\");\r\n  const [cardType, setCardType] = useState(\"standard\");\r\n  const [name, setName] = useState(\"\");\r\n  const [description, setDescription] = useState(\"\");\r\n  const [origin, setOrigin] = useState(\"\");\n  const [price, setPrice] = useState(\"\");\n  const [bundlePrice, setBundlePrice] = useState(\"\");\n  const [priceLabel, setPriceLabel] = useState(\"낱개\");\n  const [bundlePriceLabel, setBundlePriceLabel] = useState(\"세트\");\n  const [discountOpen, setDiscountOpen] = useState(false);\r\n  const [discountPercent, setDiscountPercent] = useState(\"\");\r\n  const [message, setMessage] = useState(\"\");\r\n  const [allergens, setAllergens] = useState([]);\r\n  const [queue, setQueue] = useState([]);\n  const [bulkStore, setBulkStore] = useState(\"\");\n  const [bulkCategory, setBulkCategory] = useState(\"\");\n  const [stores, setStores] = useState([]);\n  const [storesError, setStoresError] = useState(null);\n  const [bulkPrinting, setBulkPrinting] = useState(false);\n  const [bulkPrintCards, setBulkPrintCards] = useState(null);\n  const [rightTab, setRightTab] = useState(\"preview\");\r\n  const [previewDark, setPreviewDark] = useState(false);\r\n  const [dbOpen, setDbOpen] = useState(false);\r\n  const [dbSearch, setDbSearch] = useState(\"\");\r\n  const [settings, setSettings] = useState(DEFAULT_SETTINGS);\r\n  const [designs, setDesigns] = useState(DEFAULT_DESIGNS);\r\n  const [manageLoaded, setManageLoaded] = useState(false);\r\n  const [manageSaving, setManageSaving] = useState(false);\r\n  const [manageSavedAt, setManageSavedAt] = useState(null);\r\n  const [manageError, setManageError] = useState(null);\r\n\r\n  const [savedCards, setSavedCards] = useState([]);\r\n  const [savedCardsLoading, setSavedCardsLoading] = useState(false);\r\n  const [savingCard, setSavingCard] = useState(false);\r\n  const [originLabelItems, setOriginLabelItems] = useState([]);\r\n  const [originLabelSearch, setOriginLabelSearch] = useState(\"\");\r\n  const [originLabelRegisterText, setOriginLabelRegisterText] = useState(\"\");\r\n  const [originLabelRegisterVariant, setOriginLabelRegisterVariant] = useState(\"\");\r\n  const [originLabelRegisterImages, setOriginLabelRegisterImages] = useState([]);\r\n  const [originLabelRegisterLoading, setOriginLabelRegisterLoading] = useState(false);\r\n  const [originLabelRegisterError, setOriginLabelRegisterError] = useState(null);\r\n\r\n  // Load only lightweight text settings from Firebase. Designs stay on GitHub Pages.\r\n  useEffect(() => {\r\n    (async () => {\r\n      try {\r\n        const sRes = await fetch(SETTINGS_DB_URL);\r\n        const sData = sRes.ok ? await sRes.json() : null;\r\n        if (sData) {\r\n          setSettings(mergeSettings(sData));\r\n          if (sData.customFonts && sData.customFonts.length) hydrateCustomFonts(sData.customFonts);\r\n        }\r\n      } catch (err) {\r\n        console.error(\"manage settings load failed\", err);\r\n      } finally {\r\n        setManageLoaded(true);\r\n      }\r\n    })();\r\n  }, []);\r\n\r\n  // Save only lightweight text settings. Design images are fixed GitHub assets.\r\n  async function saveManageChanges(nextSettings = settings) {\r\n    setManageSaving(true);\r\n    setManageError(null);\r\n    try {\r\n      // Uploaded TTF files stay on the current device; only lightweight built-in\r\n      // font selections and style values are shared through Firebase.\r\n      const payload = { ...nextSettings, customFonts: [] };\r\n      await fetch(SETTINGS_DB_URL, { method: \"PUT\", headers: { \"Content-Type\": \"application/json\" }, body: JSON.stringify(payload) });\r\n      setManageSavedAt(Date.now());\r\n    } catch (err) {\r\n      console.error(err);\r\n      setManageError(\"저장에 실패했습니다. 네트워크 상태를 확인해 주세요.\");\r\n    } finally {\r\n      setManageSaving(false);\r\n    }\r\n  }\r\n\r\n  function loadSavedCards() {\r\n    setSavedCardsLoading(true);\r\n    fetch(SAVED_CARDS_BASE_URL + \".json\")\r\n      .then(r => r.json())\r\n      .then(data => {\r\n        const list = Object.entries(data || {})\r\n          .map(([id, v]) => normalizeSavedCard({ ...v, id }))\r\n          .sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));\r\n        setSavedCards(list);\r\n      })\r\n      .catch(() => {})\r\n      .finally(() => setSavedCardsLoading(false));\r\n  }\r\n  useEffect(() => { loadSavedCards(); }, []);\r\n\r\n  // Saves the current form as a reusable card template (제품명/설명/원산지/가격/\r\n  // 알레르기 etc.) so it can be loaded straight into the print queue later —\r\n  // separate from \"인쇄 목록에 추가\", which only adds to today's print batch.\r\n  async function saveCardToLibrary() {\r\n    if (!name.trim()) return;\r\n    setSavingCard(true);\r\n    const normalizedOrigin = formatOriginText(origin);\n    const normalizedPrice = formatPriceText(price);\n    const normalizedSetPrice = formatPriceText(bundlePrice);\n    const record = { type: cardType, name, description, origin: normalizedOrigin, price: normalizedPrice, setPrice: normalizedSetPrice, priceLabel, setPriceLabel: bundlePriceLabel, allergens, message,\n      discountPercent: Number(discountPercent) || 0, savedAt: Date.now() };\n    try {\r\n      const res = await fetch(SAVED_CARDS_BASE_URL + \".json\", {\r\n        method: \"POST\", headers: { \"Content-Type\": \"application/json\" }, body: JSON.stringify(record),\r\n      });\r\n      const data = await res.json();\r\n      setSavedCards(prev => [{ ...record, id: data.name }, ...prev]);\r\n      saveOriginIfNew(normalizedOrigin);\r\n    } catch (err) {\r\n      alert(\"카드 저장에 실패했습니다.\");\r\n    } finally {\r\n      setSavingCard(false);\r\n    }\r\n  }\r\n  function deleteSavedCard(id) {\r\n    setSavedCards(prev => prev.filter(c => c.id !== id));\r\n    fetch(`${SAVED_CARDS_BASE_URL}/${id}.json`, { method: \"DELETE\" }).catch(() => {});\r\n  }\r\n  function addSavedToQueue(saved) {\r\n    const card = { ...normalizeSavedCard(saved), id: uid() };\r\n    setQueue(prev => [...prev, card]);\r\n    setRightTab(\"queue\");\r\n  }\r\n  function loadSavedToForm(saved) {\r\n    const card = normalizeSavedCard(saved);\r\n    setCardType(card.type); setName(card.name); setDescription(card.description);\r\n    setOrigin(card.origin); setPrice(card.price); setBundlePrice(card.setPrice || \"\"); setPriceLabel(card.priceLabel); setBundlePriceLabel(card.setPriceLabel); setAllergens(card.allergens);\n    setMessage(card.message); setDiscountPercent(card.discountPercent ? String(card.discountPercent) : \"\");\r\n    setDiscountOpen(!!card.discountPercent);\r\n    setRightTab(\"preview\");\r\n  }\r\n\r\n  function productToOriginLabelCard(product) {\r\n    return {\r\n      id: \"product_\" + getOriginLabelImageKey({ origin: originItemsToText(product.origin) }) + \"_\" + stableHash(product.name || \"\"),\r\n      type: \"standard\",\r\n      name: product.name || \"\",\r\n      description: \"\",\r\n      origin: formatOriginText(originItemsToText(product.origin)),\r\n      originLabelVariant: normalizeOriginLabelVariant(product.originLabelVariant),\r\n      price: formatPriceText(product.price || \"\"),\n      setPrice: formatPriceText(product.setPrice || \"\"),\n      priceLabel: \"낱개\",\n      setPriceLabel: \"세트\",\n      allergens: Array.isArray(product.allergens) ? product.allergens : [],\r\n      message: \"\",\r\n      discountPercent: 0,\r\n    };\r\n  }\r\n\r\n  function addOriginLabelProduct(product) {\r\n    const card = productToOriginLabelCard(product);\r\n    if (originLabelItems.some(item => item.card.id === card.id)) return;\r\n    const itemId = uid();\r\n    setOriginLabelItems(prev => [...prev, { id: itemId, card, images: [], imageLoading: true, imageError: null }]);\r\n    setMainTab(\"origin-label\");\r\n    loadOriginLabelImages(itemId, card);\r\n  }\r\n\r\n  function removeOriginLabelItem(id) {\r\n    setOriginLabelItems(prev => prev.filter(item => item.id !== id));\r\n  }\r\n\r\n  async function loadOriginLabelSavedSelection(card) {\r\n    const res = await fetch(`${ORIGIN_LABEL_SELECTIONS_BASE_URL}/${getOriginLabelSelectionKey(card)}.json`);\r\n    if (!res.ok) return null;\r\n    return await res.json();\r\n  }\r\n\r\n  async function loadOriginLabelVariantOptions(originText) {\r\n    const fullOrigin = normalizeOriginLabelText(originText);\r\n    if (!fullOrigin) return [];\r\n    const originCandidates = new Set(splitTopLevelList(fullOrigin).map(normalizeOriginLabelText).filter(Boolean));\r\n    originCandidates.add(fullOrigin);\r\n    const res = await fetch(`${ORIGIN_LABEL_IMAGES_BASE_URL}.json`);\r\n    if (!res.ok) return [];\r\n    const data = await res.json();\r\n    const seen = new Set();\r\n    const options = Object.entries(data || {})\r\n      .map(([key, value]) => makeOriginLabelVariantOption(key, value))\r\n      .filter(option => originCandidates.has(option.origin) && option.images.length > 0)\r\n      .filter(option => {\r\n        const dedupeKey = `${option.origin.toLowerCase()}\\n${normalizeOriginLabelVariant(option.originLabelVariant).toLowerCase()}`;\r\n        if (seen.has(dedupeKey)) return false;\r\n        seen.add(dedupeKey);\r\n        return true;\r\n      })\r\n      .sort((a, b) => {\r\n        if (!a.originLabelVariant && b.originLabelVariant) return -1;\r\n        if (a.originLabelVariant && !b.originLabelVariant) return 1;\r\n        return originLabelVariantLabel(a).localeCompare(originLabelVariantLabel(b), \"ko\");\r\n      });\r\n    const counts = options.reduce((acc, option) => {\r\n      acc[option.origin] = (acc[option.origin] || 0) + 1;\r\n      return acc;\r\n    }, {});\r\n    return options.filter(option => counts[option.origin] > 1);\r\n  }\r\n\r\n  function applyOriginLabelVariant(itemId, variantKey) {\r\n    setOriginLabelItems(prev => prev.map(item => {\r\n      if (item.id !== itemId) return item;\r\n      const option = (item.variantOptions || []).find(o => o.key === variantKey);\r\n      if (!option) return item;\r\n      return {\r\n        ...item,\r\n        images: composeOriginLabelImages(option, item.imageSourceResults),\r\n        selectedOriginLabelKey: option.key,\r\n        selectedOriginLabelOrigin: option.origin,\r\n        selectedOriginLabelVariant: option.originLabelVariant,\r\n        selectionSaved: false,\r\n        card: { ...item.card, originLabelVariant: option.originLabelVariant },\r\n      };\r\n    }));\r\n  }\r\n\r\n  function saveOriginLabelSelection(itemId) {\r\n    const item = originLabelItems.find(x => x.id === itemId);\r\n    if (!item) return;\r\n    const originLabelVariant = normalizeOriginLabelVariant(item.selectedOriginLabelVariant);\r\n    const payload = {\r\n      productName: item.card.name || \"\",\r\n      origin: normalizeOriginLabelText(item.card.origin),\r\n      originLabelOrigin: normalizeOriginLabelText(item.selectedOriginLabelOrigin),\r\n      originLabelVariant,\r\n      updatedAt: Date.now(),\r\n    };\r\n    setOriginLabelItems(prev => prev.map(x => x.id === itemId ? { ...x, selectionSaving: true, selectionError: null } : x));\r\n    fetch(`${ORIGIN_LABEL_SELECTIONS_BASE_URL}/${getOriginLabelSelectionKey(item.card)}.json`, {\r\n      method: \"PUT\",\r\n      headers: { \"Content-Type\": \"application/json\" },\r\n      body: JSON.stringify(payload),\r\n    }).then(() => {\r\n      setOriginLabelItems(prev => prev.map(x => x.id === itemId ? { ...x, selectionSaving: false, selectionSaved: true, selectionError: null } : x));\r\n    }).catch(err => {\r\n      console.error(err);\r\n      setOriginLabelItems(prev => prev.map(x => x.id === itemId ? { ...x, selectionSaving: false, selectionSaved: false, selectionError: \"저장 실패\" } : x));\r\n    });\r\n  }\r\n\r\n  async function loadOriginLabelImages(itemId, card) {\r\n    let savedSelection = null;\r\n    let variantOptions = [];\r\n    let imageSources = [];\r\n    try {\r\n      [savedSelection, variantOptions] = await Promise.all([\r\n        loadOriginLabelSavedSelection(card).catch(() => null),\r\n        loadOriginLabelVariantOptions(card && card.origin).catch(() => []),\r\n      ]);\r\n      const savedVariant = normalizeOriginLabelVariant(savedSelection && savedSelection.originLabelVariant);\r\n      const savedOrigin = normalizeOriginLabelText(savedSelection && savedSelection.originLabelOrigin);\r\n      const cardVariant = normalizeOriginLabelVariant(card && card.originLabelVariant);\r\n      const preferredVariant = savedVariant || cardVariant;\r\n      const selectedOption = variantOptions.find(option => savedOrigin && option.origin === savedOrigin && normalizeOriginLabelVariant(option.originLabelVariant) === preferredVariant)\r\n        || variantOptions.find(option => normalizeOriginLabelVariant(option.originLabelVariant) === preferredVariant)\r\n        || variantOptions.find(option => !option.originLabelVariant)\r\n        || variantOptions[0];\r\n      const selectedVariant = selectedOption ? selectedOption.originLabelVariant : preferredVariant;\r\n      imageSources = getOriginLabelImageKeysForOrigin(card && card.origin, selectedVariant);\r\n      const results = await Promise.all(imageSources.map(async source => {\r\n        const res = await fetch(`${ORIGIN_LABEL_IMAGES_BASE_URL}/${source.key}.json`);\r\n        if (!res.ok) return { source, images: [] };\r\n        const data = await res.json();\r\n        return { source, images: Array.isArray(data && data.images) ? data.images : [] };\r\n      }));\r\n      const selectedImages = composeOriginLabelImages(selectedOption, results);\r\n      setOriginLabelItems(prev => prev.map(item =>\r\n        item.id === itemId ? {\r\n          ...item,\r\n          imageSources,\r\n          imageSourceResults: results,\r\n          variantOptions,\r\n          selectedOriginLabelKey: selectedOption ? selectedOption.key : \"\",\r\n          selectedOriginLabelOrigin: selectedOption ? selectedOption.origin : \"\",\r\n          selectedOriginLabelVariant: normalizeOriginLabelVariant(selectedVariant),\r\n          selectionSaved: !!savedVariant,\r\n          images: (item.images || []).length ? item.images : selectedImages,\r\n          imageLoading: false,\r\n          imageError: null,\r\n          card: { ...item.card, originLabelVariant: normalizeOriginLabelVariant(selectedVariant) },\r\n        } : item\r\n      ));\r\n    } catch (err) {\r\n      console.error(err);\r\n      setOriginLabelItems(prev => prev.map(item =>\r\n        item.id === itemId ? { ...item, imageSources, imageLoading: false, imageError: \"이미지를 불러오지 못했습니다\" } : item\r\n      ));\r\n    }\r\n  }\r\n\r\n  async function loadOriginLabelRegisterLibrary(text) {\r\n    const originText = normalizeOriginLabelText(text);\r\n    const originLabelVariant = normalizeOriginLabelVariant(originLabelRegisterVariant);\r\n    setOriginLabelRegisterText(originText);\r\n    setOriginLabelRegisterVariant(originLabelVariant);\r\n    setOriginLabelRegisterError(null);\r\n    if (!originText) {\r\n      setOriginLabelRegisterImages([]);\r\n      return;\r\n    }\r\n    setOriginLabelRegisterLoading(true);\r\n    try {\r\n      const imageKey = getOriginLabelImageKey({ origin: originText, originLabelVariant });\r\n      const res = await fetch(`${ORIGIN_LABEL_IMAGES_BASE_URL}/${imageKey}.json`);\r\n      if (!res.ok) throw new Error(\"load failed\");\r\n      const data = await res.json();\r\n      setOriginLabelRegisterImages(Array.isArray(data && data.images) ? data.images.slice(0, 6) : []);\r\n    } catch (err) {\r\n      console.error(err);\r\n      setOriginLabelRegisterError(\"자료를 불러오지 못했습니다\");\r\n    } finally {\r\n      setOriginLabelRegisterLoading(false);\r\n    }\r\n  }\r\n\r\n  function saveOriginLabelRegisterLibrary(images) {\r\n    const originText = normalizeOriginLabelText(originLabelRegisterText);\r\n    const originLabelVariant = normalizeOriginLabelVariant(originLabelRegisterVariant);\r\n    if (!originText) return;\r\n    const payload = { origin: originText, originLabelVariant, images: (images || []).slice(0, 6), updatedAt: Date.now() };\r\n    fetch(`${ORIGIN_LABEL_IMAGES_BASE_URL}/${getOriginLabelImageKey({ origin: originText, originLabelVariant })}.json`, {\r\n      method: \"PUT\",\r\n      headers: { \"Content-Type\": \"application/json\" },\r\n      body: JSON.stringify(payload),\r\n    }).catch(err => {\r\n      console.error(err);\r\n      setOriginLabelRegisterError(\"자료 저장에 실패했습니다\");\r\n    });\r\n  }\r\n\r\n  async function addOriginLabelRegisterImages(files) {\r\n    const originText = normalizeOriginLabelText(originLabelRegisterText);\r\n    const originLabelVariant = normalizeOriginLabelVariant(originLabelRegisterVariant);\r\n    if (!originText) {\r\n      setOriginLabelRegisterError(\"먼저 원산지 텍스트를 입력해주세요\");\r\n      return;\r\n    }\r\n    setOriginLabelRegisterText(originText);\r\n    setOriginLabelRegisterVariant(originLabelVariant);\r\n    const selected = Array.from(files || []).slice(0, Math.max(0, 6 - originLabelRegisterImages.length));\r\n    if (selected.length === 0) return;\r\n    setOriginLabelRegisterError(null);\r\n    setOriginLabelRegisterLoading(true);\r\n    try {\r\n      const images = await Promise.all(selected.map(fileToOriginLabelImage));\r\n      const nextImages = [...originLabelRegisterImages, ...images].slice(0, 6);\r\n      setOriginLabelRegisterImages(nextImages);\r\n      saveOriginLabelRegisterLibrary(nextImages);\r\n    } catch (err) {\r\n      console.error(err);\r\n      setOriginLabelRegisterError(err.message || \"이미지 업로드에 실패했습니다\");\r\n    } finally {\r\n      setOriginLabelRegisterLoading(false);\r\n    }\r\n  }\r\n\r\n  function removeOriginLabelRegisterImage(imageId) {\r\n    const nextImages = originLabelRegisterImages.filter(img => img.id !== imageId);\r\n    setOriginLabelRegisterImages(nextImages);\r\n    saveOriginLabelRegisterLibrary(nextImages);\r\n  }\r\n\r\n  const [products, setProducts] = useState([]);\r\n  const [productsLoading, setProductsLoading] = useState(false);\r\n  const [productsError, setProductsError] = useState(null);\r\n  const [databaseRefreshing, setDatabaseRefreshing] = useState(false);\r\n\r\n  // originEntries keeps each saved origin phrase together with its Firebase\r\n  // key (origins/{key}) so a single entry can be deleted with the ✕ button\r\n  // without wiping out the others. originList (derived, deduped) is what\r\n  // the combobox actually searches/displays.\r\n  const [originEntries, setOriginEntries] = useState([]); // [{key, value}]\n  const [hiddenOriginKeys, setHiddenOriginKeys] = useState({});\r\n  const originList = useMemo(() => {\r\n    const values = originEntries.filter(e => !hiddenOriginKeys[e.key]).map(e => e.value).filter(Boolean);\r\n    return Array.from(new Set(values)).sort((a, b) => a.localeCompare(b, \"ko\"));\r\n  }, [originEntries, hiddenOriginKeys]);\r\n  const [originListLoading, setOriginListLoading] = useState(false);\r\n  const [originOpen, setOriginOpen] = useState(false);\r\n  const originSavedRef = useRef(new Set());\r\n\r\n  function loadOrigins() {\n    setOriginListLoading(true);\n    return Promise.all([\r\n      fetch(ORIGIN_DB_URL).then(r => r.json()),\n      fetch(ORIGIN
