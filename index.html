es['products/' + id + '/완료타임스탬프'] = firebase.database.ServerValue.TIMESTAMP;\n    } else {\n      updates['products/' + id + '/완료일시'] = null;\n      updates['products/' + id + '/완료타임스탬프'] = null;\n    }\n    await db.ref().update(updates);\n    toast(newDone ? '✅ 완료 처리되었습니다' : '↩ 신청중으로 되돌렸습니다', 'success');\n    loadHistory();\n  } catch(e) {\n    toast('처리 실패: ' + e.message, 'error');\n  }\n}\n\nfunction completedHistoryCutoff(now = new Date()) {\n  const cutoff = new Date(now);\n  const originalDay = cutoff.getDate();\n  cutoff.setDate(1);\n  cutoff.setMonth(cutoff.getMonth() - COMPLETED_HISTORY_RETENTION_MONTHS);\n  const lastDayOfTargetMonth = new Date(cutoff.getFullYear(), cutoff.getMonth() + 1, 0).getDate();\n  cutoff.setDate(Math.min(originalDay, lastDayOfTargetMonth));\n  cutoff.setHours(0, 0, 0, 0);\n  return cutoff.getTime();\n}\n\nfunction parseSavedDateTime(value) {\n  const match = String(value || '').trim().match(/^(\\d{4})[.\\/-]\\s*(\\d{1,2})[.\\/-]\\s*(\\d{1,2})(?:\\s+(\\d{1,2}):(\\d{2}))?/);\n  if (!match) return null;\n  const date = new Date(\n    Number(match[1]), Number(match[2]) - 1, Number(match[3]),\n    Number(match[4] || 0), Number(match[5] || 0)\n  );\n  return Number.isNaN(date.getTime()) ? null : date.getTime();\n}\n\nfunction getCompletedTimestamp(product) {\n  const savedTimestamp = Number(product && product.완료타임스탬프);\n  if (Number.isFinite(savedTimestamp) && savedTimestamp > 0) return savedTimestamp;\n  return parseSavedDateTime(product && product.완료일시);\n}\n\n// Sort by the date shown in both the table and mobile cards, not the product ID.\nfunction getHistoryDateValue(product) {\n  return product.완료처리 && product.완료일시 ? product.완료일시 : product.등록일시;\n}\n\nfunction compareHistoryDates(a, b) {\n  const aTime = parseSavedDateTime(getHistoryDateValue(a));\n  const bTime = parseSavedDateTime(getHistoryDateValue(b));\n  if (aTime === null && bTime !== null) return 1;\n  if (bTime === null && aTime !== null) return -1;\n  if (aTime !== bTime) return bTime - aTime;\n  return String(a._id || '').localeCompare(String(b._id || ''));\n}\n\n// History retention is display-only. Product records are shared with the\n// allergen/origin systems and must never be deleted or modified for retention.\nfunction isExpiredCompletedHistory(product, now = new Date()) {\n  if (!product || !product.완료처리) return false;\n  const completedAt = getCompletedTimestamp(product);\n  return completedAt !== null && completedAt \u003c completedHistoryCutoff(now);\n}\n\nasync function loadHistory() {\n  if (!db) { toast('Firebase 미연결', 'error'); return; }\n  const tbody = document.getElementById('historyBody');\n  const empty = document.getElementById('historyEmpty');\n  tbody.innerHTML = '\u003ctr>\u003ctd colspan=\"9\" style=\"text-align:center;padding:20px;color:var(--text3)\">⏳ 불러오는 중...\u003c/td>\u003c/tr>';\n  empty.style.display = 'none';\n  document.getElementById('historyCount').textContent = '';\n  try {\n    const snap = await db.ref('products').orderByChild('_newProduct').equalTo(true).get();\n    const val = snap.val();\n    if (!val) {\n      historyCache = []; tbody.innerHTML = ''; empty.style.display = 'block';\n      updateTabCounts([], []);\n      return;\n    }\n    if (historyTab === 'uncategorized') historyTab = 'pending';\n    historyCache = Object.values(val).filter(isVisibleHistoryProduct);\n    filterHistory();\n  } catch(e) {\n    tbody.innerHTML = ''; empty.style.display = 'block';\n    toast('불러오기 실패: ' + e.message, 'error');\n  }\n}\n\nfunction updateTabCounts(pending, done, uncategorized = []) {\n  const pc = document.getElementById('tab-pending-count');\n  const dc = document.getElementById('tab-done-count');\n  const uc = document.getElementById('tab-uncategorized-count');\n  if (pc) pc.textContent = pending.length || '';\n  if (dc) dc.textContent = done.length || '';\n  if (uc) uc.textContent = uncategorized.length || '';\n}\n\nfunction isVisibleHistoryProduct(p) {\n  if (!p) return false;\n  if (p._hidden || p._showcardOriginOnly) return false;\n  if (!(p.카테고리 || '').trim()) return false;\n  if (isExpiredCompletedHistory(p)) return false;\n  return true;\n}\n\nfunction filterHistory() {\n  const q = (document.getElementById('historySearch').value || '').trim().toLowerCase();\n  const categoryFilter = document.getElementById('historyCategoryFilter')?.value || '전체';\n  const storeFilter = document.getElementById('historyStoreFilter')?.value || '전체';\n  const searched = q\n    ? historyCache.filter(p => {\n        const allergens = ALLERGENS.filter(a => p[a] === 'Yes').join(' ');\n        const origin = (p.원산지||[]).map(o=>originDisplay(o)).join(' ');\n        const productStores = getProductStoreNames(p);\n        const storeStr = productStores.map(displayStoreName).join(' ');\n        return (p.제품이름||'').toLowerCase().includes(q)\n          || (p.카테고리||'').toLowerCase().includes(q)\n          || allergens.toLowerCase().includes(q)\n          || origin.toLowerCase().includes(q)\n          || storeStr.toLowerCase().includes(q);\n      })\n    : historyCache;\n\n  const visibleHistory = searched.filter(p => {\n    if (!isVisibleHistoryProduct(p)) return false;\n    if (categoryFilter !== '전체' && p.카테고리 !== categoryFilter) return false;\n    const productStores = getProductStoreNames(p);\n    if (storeFilter !== '전체' && !productStores.includes(storeFilter)) return false;\n    return true;\n  });\n  const uncategorized = [];\n  const normalHistory = visibleHistory;\n  const pending = normalHistory.filter(p => !p.완료처리);\n  const done    = normalHistory.filter(p =>  p.완료처리);\n  updateTabCounts(pending, done, uncategorized);\n  const filtered = (historyTab === 'done' ? done : historyTab === 'uncategorized' ? uncategorized : pending)\n    .sort(compareHistoryDates);\n  document.getElementById('historyDateHeading').textContent = historyTab === 'done' ? '완료일시' : '등록일시';\n\n  const tbody   = document.getElementById('historyBody');\n  const empty   = document.getElementById('historyEmpty');\n  const cardList= document.getElementById('historyCardList');\n  const cardEmpty = document.getElementById('historyCardEmpty');\n  const countEl = document.getElementById('historyCount');\n\n  const total = historyTab === 'done' ? done.length : historyTab === 'uncategorized' ? uncategorized.length : pending.length;\n  countEl.textContent = q ? `${filtered.length} / ${total}건` : `총 ${total}건`;\n\n  if (filtered.length === 0) {\n    tbody.innerHTML = ''; empty.style.display = 'block';\n    cardList.innerHTML = ''; cardEmpty.style.display = 'block';\n    const msg = q\n      ? `\u003cdiv class=\"ei\">🔍\u003c/div>\"${q}\" 검색 결과가 없습니다`\n      : historyTab === 'done'\n        ? `\u003cdiv class=\"ei\">✅\u003c/div>완료된 품목이 없습니다`\n        : historyTab === 'uncategorized'\n          ? `\u003cdiv class=\"ei\">🗂\u003c/div>카테고리 미등록 품목이 없습니다`\n        : `\u003cdiv class=\"ei\">📋\u003c/div>신청중인 품목이 없습니다`;\n    empty.innerHTML = msg; cardEmpty.innerHTML = msg;\n    return;\n  }\n\n  empty.style.display = 'none';\n  cardEmpty.style.display = 'none';\n  const isDone = historyTab === 'done';\n  const showChk = historyAdminUnlocked;\n\n  // ── 데스크탑 테이블 ──\n  tbody.innerHTML = filtered.map(p => {\n    const allergens = ALLERGENS.filter(a => p[a] === 'Yes');\n    const origins = (p.원산지||[]).slice(0,3);\n    const productStores = getProductStoreNames(p);\n    const storeHtml = productStores.map(name =>\n      `\u003cspan class=\"history-store-chip\">\u003ci class=\"store-dot-inline\" style=\"--store-color:${storeColor(name)}\">\u003c/i>${esc(displayStoreName(name))}\u003c/span>`\n    ).join('');\n    const originHtml = origins.length > 0\n      ? origins.map((o,i)=>`\u003cdiv class=\"origin-line\">\u003cb>${i+1}순위\u003c/b>${originDisplay(o)||'-'}\u003c/div>`).join('')\n      : '\u003cspan style=\"color:var(--text3);font-size:12px\">-\u003c/span>';\n    const catColor = CAT_COLORS[p.카테고리] || '#ccc';\n    const chkCell = showChk\n      ? `\u003ctd class=\"complete-chk-wrap\">\n          \u003cinput type=\"checkbox\" class=\"complete-chk\" ${p.완료처리 ? 'checked' : ''}\n            onclick=\"event.stopPropagation();toggleProductDone('${p._id}',${!!p.완료처리})\">\n        \u003c/td>`\n      : '';\n    const rowClass = p.완료처리 ? 'history-row-done' : '';\n    return `\u003ctr class=\"${rowClass}\">\n      \u003ctd>\n        \u003cdiv class=\"cat-cell\">\n          \u003cspan class=\"cat-dot\" style=\"background:${catColor}\">\u003c/span>\n          \u003cspan title=\"${esc(p.카테고리||'')}\">${highlight(p.카테고리||'-', q)}\u003c/span>\n        \u003c/div>\n      \u003c/td>\n      \u003ctd class=\"name-cell\">\n        \u003cspan class=\"product-name-link\" onclick=\"openProductDetail('${p._id}')\">${highlight(p.제품이름||'', q)}\u003c/span>\n          ${historyTab === 'uncategorized' ? '\u003cspan class=\"new-chip\">미등록\u003c/span>' : p.완료처리 ? '\u003cspan class=\"done-check-icon\" title=\"완료\">✓\u003c/span>' : '\u003cspan class=\"new-chip\">신제품\u003c/span>'}\n      \u003c/td>\n      \u003ctd style=\"font-family:var(--mono);color:var(--accent)\">${p.판매금액 ? '₩'+Number(p.판매금액).toLocaleString('ko-KR') : '-'}\u003c/td>\n      \u003ctd>\u003cdiv class=\"history-store-cell\">${storeHtml || '\u003cspan style=\"color:var(--text3);font-size:11px\">전 점포\u003c/span>'}\u003c/div>\u003c/td>\n      \u003ctd>\u003cdiv class=\"origin-stack\">${originHtml}\u003c/div>\u003c/td>\n      \u003ctd>\u003cdiv class=\"allergen-mini\">${allergens.length > 0 ? allergens.map(a=>`\u003cspan class=\"a-mini\">${highlight(a,q)}\u003c/span>`).join('') : '\u003cspan style=\"font-size:11px;color:var(--text3)\">없음\u003c/span>'}\u003c/div>\u003c/td>\n      \u003ctd style=\"font-size:11px;color:var(--text3);white-space:nowrap\">${p.완료처리 && p.완료일시 ? '✅ '+p.완료일시 : p.등록일시||'-'}\u003c/td>\n      \u003ctd>\n        \u003cdiv class=\"row-actions\">\n          \u003cbutton class=\"icon-btn\" title=\"수정\" onclick=\"event.stopPropagation();openEditById('${p._id}')\">✏️\u003c/button>\n          \u003cbutton class=\"icon-btn danger\" title=\"삭제\" onclick=\"event.stopPropagation();deleteProduct('${p._id}','${esc(p.제품이름)}')\">🗑️\u003c/button>\n        \u003c/div>\n      \u003c/td>\n      ${chkCell}\n    \u003c/tr>`;\n  }).join('');\n\n  // ── 모바일 카드 ──\n  cardList.innerHTML = filtered.map(p => {\n    const allergens = ALLERGENS.filter(a => p[a] === 'Yes');\n    const origin1 = p.원산지 && p.원산지[0] ? originDisplay(p.원산지[0]) : '';\n    const productStores = getProductStoreNames(p);\n    const storeChip = productStores.length ? `\u003cspan class=\"hc-origin\">${productStores.map(name =>\n      `\u003ci class=\"store-dot-inline\" style=\"--store-color:${storeColor(name)};margin-right:3px\">\u003c/i>${esc(displayStoreName(name))}`\n    ).join(' · ')}\u003c/span>` : '';\n    const catColor = CAT_COLORS[p.카테고리] || '#ccc';\n    const allergenHtml = allergens.length > 0\n      ? allergens.map(a=>`\u003cspan class=\"a-mini\">${highlight(a,q)}\u003c/span>`).join('')\n      : '\u003cspan style=\"font-size:11px;color:var(--text3)\">알레르기 없음\u003c/span>';\n    const cardDoneClass = p.완료처리 ? ' history-card-done' : '';\n    const chkBtn = showChk\n      ? `\u003cinput type=\"checkbox\" class=\"complete-chk\" style=\"margin-left:4px\" ${p.완료처리 ? 'checked' : ''}\n           onclick=\"event.stopPropagation();toggleProductDone('${p._id}',${!!p.완료처리})\">`\n      : '';\n    return `\u003cdiv class=\"history-card${cardDoneClass}\" onclick=\"openProductDetail('${p._id}')\">\n      \u003cdiv class=\"hc-top\">\n        \u003cdiv class=\"hc-name\">\n          ${highlight(p.제품이름||'', q)}\n          ${historyTab === 'uncategorized' ? '\u003cspan class=\"new-chip\" style=\"font-size:9px;margin-left:5px\">미등록\u003c/span>' : p.완료처리 ? '\u003cspan class=\"done-check-icon\" title=\"완료\">✓\u003c/span>' : '\u003cspan class=\"new-chip\" style=\"font-size:9px;margin-left:5px\">신제품\u003c/span>'}\n        \u003c/div>\n        \u003cdiv style=\"display:flex;align-items:center;gap:6px\">\n          \u003cdiv class=\"hc-price\">${p.판매금액 ? '₩'+Number(p.판매금액).toLocaleString('ko-KR') : '-'}\u003c/div>\n          ${chkBtn}\n        \u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"hc-meta\">\n        \u003cspan class=\"hc-cat\" style=\"background:${catColor}33;color:${catColor};border:1px solid ${catColor}55\">${highlight(p.카테고리||'-', q)}\u003c/span>\n        ${origin1 ? `\u003cspan class=\"hc-origin\">🌐 ${origin1}\u003c/span>` : ''}\n        ${storeChip}\n      \u003c/div>\n      \u003cdiv class=\"hc-allergens\">${allergenHtml}\u003c/div>\n      \u003cdiv class=\"hc-footer\">\n        \u003cspan class=\"hc-date\">${p.완료처리 && p.완료일시 ? '✅ '+p.완료일시 : p.등록일시||'-'}\u003c/span>\n        \u003cdiv style=\"display:flex;gap:5px\">\n          \u003cbutton class=\"btn btn-secondary btn-sm\" style=\"padding:4px 10px;font-size:11px\" onclick=\"event.stopPropagation();openEditById('${p._id}')\">✏️ 수정\u003c/button>\n          \u003cbutton class=\"btn btn-danger btn-sm\" style=\"padding:4px 10px;font-size:11px\" onclick=\"event.stopPropagation();deleteProduct('${p._id}','${esc(p.제품이름)}')\">🗑 삭제\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/div>`;\n  }).join('');\n}\n\nfunction highlight(text, q) {\n  if (!q || !text) return text;\n  const idx = text.toLowerCase().indexOf(q.toLowerCase());\n  if (idx === -1) return text;\n  return text.slice(0, idx)\n    + `\u003cmark style=\"background:rgba(212,136,10,.25);color:var(--text);border-radius:2px;padding:0 1px\">${text.slice(idx, idx+q.length)}\u003c/mark>`\n    + text.slice(idx + q.length);\n}\n\nfunction clearHistorySearch() {\n  document.getElementById('historySearch').value = '';\n  document.getElementById('historyCategoryFilter').value = '전체';\n  document.getElementById('historyStoreFilter').value = '전체';\n  filterHistory();\n  document.getElementById('historySearch').focus();\n}\n\nasync function deleteProduct(id, name) {\n  if (!confirm(`\"${name}\"을(를) 삭제할까요?\\nindex.html에서도 제거됩니다.`)) return;\n  try {\n    await db.ref('products/' + id).remove();\n    toast(name + ' 삭제됨', 'success');\n    loadHistory();\n  } catch(e) {\n    toast('삭제 실패: ' + e.message, 'error');\n  }\n}\n\n/* ══════════════════════════════════════════════════ */\n/*  PRODUCT DETAIL MODAL                              */\n/* ══════════════════════════════════════════════════ */\nlet _detailCurrentId = null;\n\nfunction openProductDetail(id) {\n  if (!db) return;\n  _detailCurrentId = id;\n  db.ref('products/' + id).once('value', snap => {\n    const p = snap.val();\n    if (!p) { toast('데이터를 불러올 수 없습니다', 'error'); return; }\n\n    const catColor = CAT_COLORS[p.카테고리] || '#ccc';\n    const allergens = ALLERGENS.filter(a => p[a] === 'Yes');\n\n    // 타이틀 + 메타\n    document.getElementById('detailModalTitle').textContent = p.제품이름 || '-';\n    document.getElementById('detailModalMeta').innerHTML = `\n      \u003cspan style=\"font-size:11px;padding:2px 9px;border-radius:20px;background:${catColor}33;color:${catColor};border:1px solid ${catColor}55;font-weight:600\">${p.카테고리||''}\u003c/span>\n      \u003cspan class=\"new-chip\">신제품\u003c/span>\n      \u003cspan style=\"font-family:var(--mono);font-size:14px;font-weight:700;color:var(--accent)\">${p.판매금액 ? '₩'+Number(p.판매금액).toLocaleString('ko-KR') : ''}\u003c/span>\n    `;\n\n    // 본문\n    const origins = (p.원산지||[]).map(o =>\n      `\u003cdiv class=\"detail-origin-line\">\u003cstrong style=\"color:var(--accent);font-family:var(--mono);font-size:11px\">${o.rank}순위\u003c/strong> &nbsp;${originDisplay(o)}\u003c/div>`\n    ).join('') || '\u003cspan style=\"color:var(--text3)\">—\u003c/span>';\n\n    const detailStores = getProductStoreNames(p);\n    const storeHtml = detailStores.length\n      ? `\u003cdiv class=\"store-mini\">${detailStores.map(s=>`\u003cspan class=\"s-mini\">\u003ci class=\"store-dot-inline\" style=\"--store-color:${storeColor(s)}\">\u003c/i>${esc(displayStoreName(s))}\u003c/span>`).join('')}\u003c/div>`\n      : '\u003cspan style=\"font-size:12px;color:var(--text3)\">판매 점포 없음\u003c/span>';\n\n    const allergenHtml = allergens.length > 0\n      ? `\u003cdiv class=\"detail-allergen-wrap\">${allergens.map(a=>`\u003cspan class=\"a-mini\">${a}\u003c/span>`).join('')}\u003c/div>`\n      : '\u003cspan style=\"font-size:12px;color:var(--text3)\">해당 없음\u003c/span>';\n\n    const imgs = (p.원산지이미지 || []).filter(Boolean);\n    const imgHtml = imgs.length\n      ? `\u003cdiv class=\"detail-imgs\">${imgs.map((src,i)=>`\u003cdiv style=\"position:relative;display:inline-block\">\u003cimg src=\"${src}\" onclick=\"zoomImg('${src}')\" alt=\"원산지 증빙\" style=\"display:block\" loading=\"lazy\" decoding=\"async\">\u003cbutton onclick=\"downloadImg('${src}',${i})\" title=\"원본 다운로드\" style=\"position:absolute;bottom:4px;right:4px;background:rgba(0,0,0,.7);border:none;color:#fff;border-radius:4px;padding:2px 6px;font-size:10px;cursor:pointer;font-family:var(--font)\">⬇ 저장\u003c/button>\u003c/div>`).join('')}\u003c/div>`\n      : '';\n\n    const noteHtml = p.비고 ? `\n      \u003cdiv class=\"detail-section\">\n        \u003cdiv class=\"detail-section-title\">비고\u003c/div>\n        \u003cdiv style=\"font-size:13px;color:var(--text2);line-height:1.7\">${p.비고}\u003c/div>\n      \u003c/div>` : '';\n\n    document.getElementById('detailModalBody').innerHTML = `\n      \u003cdiv class=\"detail-section\">\n        \u003cdiv class=\"detail-section-title\">원산지\u003c/div>\n        ${origins}\n        ${imgHtml}\n      \u003c/div>\n      \u003cdiv class=\"detail-section\">\n        \u003cdiv class=\"detail-section-title\">판매 점포\u003c/div>\n        ${storeHtml}\n      \u003c/div>\n      \u003cdiv class=\"detail-section\">\n        \u003cdiv class=\"detail-section-title\">알레르기 유발물질\u003c/div>\n        ${allergenHtml}\n      \u003c/div>\n      ${noteHtml}\n      \u003cdiv class=\"detail-section\">\n        \u003cdiv class=\"detail-row\">\n          \u003cspan class=\"detail-key\">등록일시\u003c/span>\n          \u003cspan class=\"detail-val\" style=\"font-family:var(--mono);font-size:12px;color:var(--text3)\">${p.등록일시||'—'}\u003c/span>\n        \u003c/div>\n        ${buildAdminReviewHtml(p)}\n      \u003c/div>\n    `;\n\n    // 삭제 버튼\n    document.getElementById('detailDeleteBtn').onclick = () => {\n      closeProductDetail();\n      deleteProduct(id, p.제품이름);\n    };\n\n    document.getElementById('productDetailModal').classList.add('open');\n  });\n}\n\nfunction closeProductDetail() {\n  document.getElementById('productDetailModal').classList.remove('open');\n  _detailCurrentId = null;\n}\n\nfunction zoomImg(src) {\n  const ov = document.createElement('div');\n  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out';\n  ov.innerHTML = `\u003cimg src=\"${src}\" style=\"max-width:92vw;max-height:90vh;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)\">`;\n  ov.onclick = () => ov.remove();\n  document.body.appendChild(ov);\n}\n\n/* ══════════════════════════════════════════════════ */\n/*  ADMIN REVIEW LOG & ADMIN MODE                     */\n/* ══════════════════════════════════════════════════ */\n\n/* ── 이력 HTML 렌더 ── */\nfunction buildAdminReviewHtml(p) {\n  const logs = p.관리자확인로그;\n  if (!logs) return '\u003cdiv class=\"admin-review-box\" style=\"margin-top:10px\">\u003cdiv class=\"admin-review-title\">🔎 관리자 확인 이력\u003c/div>\u003cdiv class=\"admin-review-empty\">아직 관리자 확인 이력이 없습니다\u003c/div>\u003c/div>';\n  const entries = (Array.isArray(logs) ? logs : Object.values(logs)).sort((a,b)=> (b.ts||0)-(a.ts||0));\n  let html = '\u003cdiv class=\"admin-review-box\" style=\"margin-top:10px\">\u003cdiv class=\"admin-review-title\">🔎 관리자 확인 이력\u003c/div>';\n  entries.forEach(e => {\n    html += '\u003cdiv class=\"admin-review-entry\">';\n    html += '✅ \u003cstrong style=\"color:var(--success)\">' + esc(e.adminName||'관리자') + '\u003c/strong>';\n    html += ' \u003cspan style=\"color:var(--text3);font-size:11px\">' + (e.date||'') + '\u003c/span>';\n    if (e.changes && e.changes.length) {\n      html += '\u003cdiv style=\"font-size:11px;color:var(--text2);margin-top:3px;padding-left:14px\">';\n      e.changes.forEach(c => { html += '· ' + esc(c) + '\u003cbr>'; });\n      html += '\u003c/div>';\n    }\n    if (e.memo) html += '\u003cdiv style=\"font-size:11px;color:var(--accent2);margin-top:2px;padding-left:14px\">📝 ' + esc(e.memo) + '\u003c/div>';\n    html += '\u003c/div>';\n  });\n  html += '\u003c/div>';\n  return html;\n}\n\n/* ── 관리자 모달 상태 ── */\nlet _adminProductSnapshot = null;\nlet adminAllergenState = {};\n\nfunction nowStr() {\n  const n = new Date();\n  return n.getFullYear()+'.'+String(n.getMonth()+1).padStart(2,'0')+'.'+String(n.getDate()).padStart(2,'0')\n    +' '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');\n}\n\n/* ── 관리자 모달 열기 ── */\nfunction openAdminModal() {\n  const id = _detailCurrentId;\n  if (!id || !db) return;\n  // Step1 보이기 / Step2 숨기기 / 비밀번호 초기화\n  document.getElementById('adminStep1').style.display = 'block';\n  document.getElementById('adminStep2').style.display = 'none';\n  document.getElementById('adminPwInput').value = '';\n  document.getElementById('adminPwErr').style.display = 'none';\n  document.getElementById('adminModal').classList.add('open');\n  setTimeout(() => document.getElementById('adminPwInput').focus(), 200);\n\n  // 제품명 표시 (현재 상세 모달 제목 그대로)\n  const title = document.getElementById('detailModalTitle').textContent;\n  document.getElementById('adminModalProductName').textContent = title;\n}\n\nfunction closeAdminModal() {\n  document.getElementById('adminModal').classList.remove('open');\n  _adminProductSnapshot = null;\n}\n\n/* ── 비밀번호 확인 ── */\nfunction checkAdminPw() {\n  const val = document.getElementById('adminPwInput').value;\n  if (val !== getSettingsPw()) {\n    document.getElementById('adminPwErr').style.display = 'block';\n    document.getElementById('adminPwInput').value = '';\n    document.getElementById('adminPwInput').focus();\n    return;\n  }\n  document.getElementById('adminPwErr').style.display = 'none';\n  // 제품 데이터 불러와서 Step2 진입\n  db.ref('products/' + _detailCurrentId).once('value', snap => {\n    const p = snap.val();\n    if (!p) { toast('데이터 오류', 'error'); return; }\n    _adminProductSnapshot = p;\n\n    // 원산지 채우기\n    const o = p.원산지 || [];\n    document.getElementById('adminO1').value = originDisplay(o[0]);\n    document.getElementById('adminO2').value = originDisplay(o[1]);\n    document.getElementById('adminO3').value = originDisplay(o[2]);\n\n    // 알레르기 채우기\n    adminAllergenState = {};\n    ALLERGENS.forEach(a => { adminAllergenState[a] = p[a] === 'Yes'; });\n    buildAdminAllergenGrid();\n\n    document.getElementById('adminMemo').value = '';\n\n    // 변경 감지용 초기값 저장 후 입력 이벤트 연결\n    ['adminO1','adminO2','adminO3'].forEach(id => {\n      const el = document.getElementById(id);\n      el.dataset.orig = el.value;\n      el.oninput = () => el.classList.toggle('changed-field', el.value !== el.dataset.orig);\n    });\n\n    document.getElementById('adminStep1').style.display = 'none';\n    document.getElementById('adminStep2').style.display = 'block';\n  });\n}\n\n/* ── 알레르기 그리드 ── */\nfunction buildAdminAllergenGrid() {\n  const grid = document.getElementById('adminAllergenGrid');\n  grid.innerHTML = '';\n  ALLERGENS.forEach(a => {\n    const div = document.createElement('div');\n    div.className = 'atag' + (adminAllergenState[a] ? ' on' : '');\n    div.id = 'aatag-' + a;\n    div.innerHTML = '\u003cspan class=\"dot\">\u003c/span>' + a;\n    div.onclick = () => {\n      adminAllergenState[a] = !adminAllergenState[a];\n      div.classList.toggle('on', adminAllergenState[a]);\n      div.querySelector('.dot').style.background = adminAllergenState[a] ? 'var(--danger)' : 'var(--border)';\n    };\n    grid.appendChild(div);\n  });\n}\n\nfunction adminClearAllergens() {\n  ALLERGENS.forEach(a => { adminAllergenState[a] = false; });\n  buildAdminAllergenGrid();\n}\n\n/* ── 관리자 수정 저장 ── */\nasync function saveAdminEdit() {\n  const id = _detailCurrentId;\n  if (!id || !db || !_adminProductSnapshot) return;\n\n  const p = _adminProductSnapshot;\n  const o = p.원산지 || [];\n  const changes = [];\n\n  // 원산지 변경 감지\n  const newOrigin = [\n    { rank:1, text: document.getElementById('adminO1').value.trim() },\n    { rank:2, text: document.getElementById('adminO2').value.trim() },\n    { rank:3, text: document.getElementById('adminO3').value.trim() },\n  ];\n  [0,1,2].forEach(i => {\n    const oldT = originDisplay(o[i]);\n    const newT = newOrigin[i].text;\n    if (oldT !== newT) {\n      changes.push('원산지 '+(i+1)+'순위: '+(oldT||'(없음)')+' → '+(newT||'(없음)'));\n    }\n  });\n\n  // 알레르기 변경 감지\n  const addedAllergens = ALLERGENS.filter(a => adminAllergenState[a] && p[a] !== 'Yes');\n  const removedAllergens = ALLERGENS.filter(a => !adminAllergenState[a] && p[a] === 'Yes');\n  if (addedAllergens.length) changes.push('알레르기 추가: ' + addedAllergens.join(', '));\n  if (removedAllergens.length) changes.push('알레르기 제거: ' + removedAllergens.join(', '));\n\n  if (!newOrigin[0].text) { toast('원산지 1순위는 필수입니다', 'error'); return; }\n  if (!newOrigin[1].text) { toast('원산지 2순위는 필수입니다', 'error'); return; }\n  if (!newOrigin[2].text) { toast('원산지 3순위는 필수입니다', 'error'); return; }\n\n  const btn = document.getElementById('adminSaveBtn');\n  btn.disabled = true; btn.textContent = '⏳ 저장 중...';\n\n  try {\n    const updates = { 원산지: newOrigin };\n    ALLERGENS.forEach(a => { updates[a] = adminAllergenState[a] ? 'Yes' : 'No'; });\n\n    // 관리자 확인 로그 항목 생성\n    const logEntry = {\n      adminName: '관리자',\n      date: nowStr(),\n      ts: Date.now(),\n      changes: changes.length ? changes : ['변경 없음 (확인만)'],\n      memo: document.getElementById('adminMemo').value.trim(),\n    };\n\n    await db.ref('products/' + id).update(updates);\n    await db.ref('products/' + id + '/관리자확인로그').push(logEntry);\n\n    toast('✅ 관리자 수정 저장 완료', 'success');\n    closeAdminModal();\n    openProductDetail(id);  // 상세 모달 새로고침\n  } catch(e) {\n    toast('저장 실패: ' + e.message, 'error');\n  } finally {\n    btn.disabled = false; btn.textContent = '💾 관리자 수정 저장';\n  }\n}\n\n/* 사진 원본 다운로드 */\nfunction downloadImg(src, idx) {\n  const a = document.createElement('a');\n  a.href = src;\n  a.download = '원산지이미지_' + (_detailCurrentId || 'img') + '_' + (idx + 1) + '.jpg';\n  document.body.appendChild(a);\n  a.click();\n  document.body.removeChild(a);\n  toast('📥 이미지 다운로드 시작', 'success');\n}\n\n/* ══════════════════════════════════════════════════ */\n/*  ALLERGEN GUIDE IMAGE (GitHub Pages static asset) */\n/* ══════════════════════════════════════════════════ */\nlet allergenGuideImages = [{\n  _id: 'github-allergen-guide',\n  dataUrl: 'https://harebakery-cmd.github.io/hare-allergen/images/guide/allergen-01.jpg',\n  name: 'allergen-01.jpg'\n}];\n\nfunction loadAllergenGuideImages() {\n  renderAllergenGuideInForm();\n  if (document.getElementById('page-settings')?.classList.contains('active')) {\n    renderAllergenGuideImgWrap();\n  }\n}\n\nfunction renderAllergenGuideImgWrap() {\n  const wrap = document.getElementById('allergenGuideImgWrap');\n  if (!wrap) return;\n  if (allergenGuideImages.length === 0) {\n    wrap.innerHTML = '\u003cdiv style=\"font-size:12px;color:var(--text3);padding:16px 0\">등록된 알레르기 가이드 이미지가 없습니다\u003c/div>';\n    return;\n  }\n  wrap.innerHTML = allergenGuideImages.map((g, i) => `\n    \u003cdiv style=\"position:relative;width:110px;flex-shrink:0\">\n      \u003cimg src=\"${g.dataUrl}\" alt=\"알레르기 가이드 ${i+1}\"\n        style=\"width:110px;height:110px;object-fit:cover;border-radius:var(--radius-sm);border:1.5px solid var(--border);cursor:pointer\"\n        onclick=\"zoomImg('${g.dataUrl}')\" loading=\"lazy\" decoding=\"async\">\n      \u003cdiv style=\"font-size:10px;color:var(--text3);margin-top:4px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">${g.name || '이미지 '+(i+1)}\u003c/div>\n    \u003c/div>\n  `).join('');\n}\n\nfunction renderAllergenGuideInForm() {\n  const area = document.getElementById('allergenGuideImgsArea');\n  const list = document.getElementById('allergenGuideImgList');\n  if (!area || !list) return;\n  if (allergenGuideImages.length === 0) { area.style.display = 'none'; return; }\n  area.style.display = 'block';\n  list.innerHTML = allergenGuideImages.map((g, i) => `\n    \u003cimg src=\"${g.dataUrl}\" alt=\"가이드 ${i+1}\" onclick=\"zoomImg('${g.dataUrl}')\"\n      style=\"max-width:200px;max-height:160px;border-radius:6px;border:1.5px solid var(--border);cursor:zoom-in;object-fit:contain\" loading=\"lazy\" decoding=\"async\">\n  `).join('');\n}\n\nfunction addAllergenGuideImg() {\n  toast('GitHub의 images/guide/allergen-01.jpg 파일을 교체해 주세요', 'error');\n}\n\nfunction removeAllergenGuideImg(id) {\n  toast('GitHub에서 images/guide/allergen-01.jpg 파일을 관리해 주세요', 'error');\n}\n\nfunction clearAllergenGuideImgs() {\n  toast('GitHub에서 images/guide/allergen-01.jpg 파일을 관리해 주세요', 'error');\n}\n\n/* ══════════════════════════════════════════════════ */\n/*  SETTINGS                                          */\n/* ══════════════════════════════════════════════════ */\nconst SETTINGS_PW_KEY = 'reg_settings_pw';\nconst DEFAULT_PW = 'hare';\nfunction getSettingsPw() { return localStorage.getItem(SETTINGS_PW_KEY) || DEFAULT_PW; }\n\nfunction initSettingsPage() {\n  if (document.getElementById('settingsContent').style.display === 'block') {\n    loadFirebaseSettingsInputs();\n    loadOriginManager(); return;\n  }\n  document.getElementById('settingsLock').style.display = 'block';\n  document.getElementById('settingsContent').style.display = 'none';\n  document.getElementById('settingsPwInput').value = '';\n  document.getElementById('settingsPwErr').style.display = 'none';\n  setTimeout(() => document.getElementById('settingsPwInput').focus(), 100);\n}\n\nfunction loadOriginManager() {\n  if (!db) return;\n  const box = document.getElementById('originManagerList');\n  if (box) box.innerHTML = '\u003cdiv style=\"font-size:12px;color:var(--text3)\">불러오는 중...\u003c/div>';\n  Promise.all([db.ref('origins').once('value'), db.ref('origin_hidden').once('value'), db.ref('origin_label_images').once('value')]).then(function(snaps) {\n    managedOriginEntries = Object.entries(snaps[0].val() || {}).map(function(e){return {key:e[0],value:e[1]};}).filter(function(e){return e.value;});\n    managedOriginHidden = snaps[1].val() || {}; managedOriginLabelImages = snaps[2].val() || {}; renderOriginManager();\n  }).catch(function(err){ if(box) box.innerHTML='\u003cdiv style=\"font-size:12px;color:var(--danger)\">데이터를 불러오지 못했습니다. Firebase 권한을 확인해주세요.\u003c/div>'; console.error(err); });\n}\n\n// Keep normalization and the key hash compatible with showcard/index.html.\nfunction normalizeManagedOriginLabel(value) {\n  return splitOriginEntries(String(value || '').trim().replace(/\\s+/g, ' ')).join(', ');\n}\nfunction managedOriginLabelKey(value) {\n  const text = normalizeManagedOriginLabel(value).toLowerCase();\n  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;\n  for (let i = 0; i \u003c text.length; i++) {\n    const ch = text.charCodeAt(i);\n    h1 = Math.imul(h1 ^ ch, 2654435761);\n    h2 = Math.imul(h2 ^ ch, 1597334677);\n  }\n  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);\n  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);\n  return 'k_' + (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);\n}\nconst originLabelUploads = new Set();\nfunction canUploadManagedOriginLabel() {\n  return !!db && document.getElementById('settingsContent')?.style.display === 'block';\n}\nfunction chooseManagedOriginLabelImages(value) {\n  if (!canUploadManagedOriginLabel()) { toast('설정 관리자 인증이 필요합니다', 'error'); return; }\n  const input = document.createElement('input');\n  input.type = 'file';\n  input.accept = 'image/jpeg,image/png,image/webp';\n  input.multiple = true;\n  input.hidden = true;\n  input.onchange = () => {\n    const files = Array.from(input.files || []);\n    input.remove();\n    uploadManagedOriginLabelImages(value, files);\n  };\n  input.oncancel = () => input.remove();\n  document.body.appendChild(input);\n  input.click();\n}\nasync function uploadManagedOriginLabelImages(value, files) {\n  if (!files.length) return;\n  if (!canUploadManagedOriginLabel()) { toast('설정 관리자 인증이 필요합니다', 'error'); return; }\n  const origin = normalizeManagedOriginLabel(value), key = managedOriginLabelKey(value);\n  if (!origin || originLabelUploads.has(key)) return;\n  originLabelUploads.add(key);\n  renderOriginManager();\n  try {\n    if (files.some(file => !['image/jpeg', 'image/png', 'image/webp'].includes(file.type))) {\n      throw new Error('JPG, PNG, WEBP 사진을 선택해주세요');\n    }\n    const ref = db.ref('origin_label_images/' + key);\n    const existing = (await ref.once('value')).val();\n    const count = Array.isArray(existing?.images) ? existing.images.length : 0;\n    if (count + files.length > 6) throw new Error('공통 원라벨은 최대 6장입니다. 현재 ' + count + '장, 추가 가능 ' + Math.max(0, 6 - count) + '장');\n    toast('사진을 압축하고 등록하는 중입니다', 'success');\n    const images = [];\n    for (const file of files) {\n      const uploadFile = await compressImageForUpload(file);\n      const form = new FormData();\n      form.append('file', uploadFile);\n      form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);\n      form.append('folder', 'hare-allergen/origin-label');\n      const response = await fetch(CLOUDINARY_UPLOAD_URL, { method: 'POST', body: form });\n      const result = await response.json();\n      if (!response.ok || !result.secure_url) throw new Error(result.error?.message || '사진 업로드 실패');\n      images.push({ id: ref.push().key, name: uploadFile.name, src: result.secure_url });\n    }\n    if (!canUploadManagedOriginLabel()) throw new Error('설정이 잠겼습니다. 인증 후 다시 등록해주세요');\n    const saved = await ref.transaction(current => {\n      const previous = Array.isArray(current?.images) ? current.images : [];\n      if (previous.length + images.length > 6) return;\n      return { ...current, origin, originLabelVariant: '', images: [...previous, ...images], updatedAt: Date.now() };\n    }, undefined, false);\n    if (!saved.committed) throw new Error('다른 곳에서 사진이 추가되어 6장을 초과합니다. 새로고침 후 다시 확인해주세요');\n    managedOriginLabelImages[key] = saved.snapshot.val();\n    toast('사진이 등록되었습니다. 쇼카드 원라벨에서도 불러올 수 있습니다', 'success');\n  } catch (err) {\n    console.error(err);\n    toast('사진 등록 실패: ' + err.message, 'error');\n  } finally {\n    originLabelUploads.delete(key);\n    renderOriginManager();\n  }\n}\nfunction renderOriginManager() {\n  const box=document.getElementById('originManagerList'); if(!box)return;\n  const q=(document.getElementById('originManagerSearch')?.value||'').trim().toLowerCase(), grouped=new Map();\n  managedOriginEntries.forEach(function(e){if(!grouped.has(e.value))grouped.set(e.value,[]);grouped.get(e.value).push(e);});\n  const rows=Array.from(grouped.entries()).sort(function(a,b){return a[0].localeCompare(b[0],'ko');}).filter(function(e){return !q||e[0].toLowerCase().includes(q);});\n  if(!rows.length){box.innerHTML='\u003cdiv style=\"font-size:12px;color:var(--text3);padding:10px 0\">검색 결과가 없습니다.\u003c/div>';return;}\n  const rowHtml=rows.map(function(row){\n    const value=row[0], entries=row[1], hidden=entries.every(function(e){return managedOriginHidden[e.key];});\n    const imgs=Object.values(managedOriginLabelImages).filter(function(r){return r&&normalizeManagedOriginLabel(r.origin)===normalizeManagedOriginLabel(value);}).flatMap(function(r){return (Array.isArray(r.images)?r.images:[]).map(function(im){return Object.assign({},im,{variant:r.originLabelVariant||''});});});\n    const thumbs=imgs.length?imgs.map(function(im){return '\u003ca href=\"'+esc(im.src||'')+'\" target=\"_blank\" rel=\"noopener\">\u003cimg src=\"'+esc(im.src||'')+'\" alt=\"\" title=\"'+esc(im.name||'원라벨')+'\" style=\"width:42px;height:42px;object-fit:cover;border:1px solid var(--border);border-radius:5px\">\u003c/a>';}).join(''):'\u003cspan style=\"font-size:11px;color:var(--text3)\">연결된 원라벨 이미지 없음\u003c/span>';\n    const uploading=originLabelUploads.has(managedOriginLabelKey(value));\n    const btn='\u003cbutton type=\"button\" class=\"btn btn-secondary btn-sm\" data-value=\"'+esc(value)+'\" onclick=\"chooseManagedOriginLabelImages(this.dataset.value)\" '+(uploading?'disabled':'')+'>'+(uploading?'등록 중…':'사진 등록')+'\u003c/button> \u003cbutton class=\"btn btn-ghost btn-sm\" data-value=\"'+esc(value)+'\" onclick=\"setOriginPhraseHidden(this.dataset.value,'+(!hidden)+')\">'+(hidden?'복구':'숨김')+'\u003c/button> \u003cbutton class=\"btn btn-danger btn-sm\" data-value=\"'+esc(value)+'\" onclick=\"deleteOriginPhrase(this.dataset.value)\">삭제\u003c/button>';\n    return '\u003cdiv style=\"padding:10px 0;border-bottom:1px solid var(--border);'+(hidden?'opacity:.6':'')+'\">\u003cdiv style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\u003cstrong style=\"font-size:13px;flex:1\">'+esc(value)+'\u003c/strong>\u003cspan style=\"font-size:11px;color:var(--text3)\">'+(hidden?'숨김':'사용 중')+' · 원라벨 '+imgs.length+'장\u003c/span>'+btn+'\u003c/div>\u003cdiv style=\"display:flex;align-items:center;gap:6px;margin-top:7px;flex-wrap:wrap\">'+thumbs+'\u003c/div>\u003c/div>';\n  }).join('');\n  box.innerHTML='\u003cp style=\"font-size:12px;color:var(--text3);line-height:1.6\">사진 등록: JPG·PNG·WEBP, 공통 원라벨 최대 6장 · 자동 압축 후 파일당 5MB 이하. \u003ca href=\"https://harebakery-cmd.github.io/showcard/\" target=\"_blank\" rel=\"noopener\">쇼카드 원라벨\u003c/a>에서 같은 원산지의 제품을 추가하면 등록한 사진을 불러옵니다.\u003c/p>\u003cdiv style=\"display:flex;align-items:center;justify-content:space-between;padding:8px 0\">\u003cspan style=\"font-size:12px;color:var(--text3)\">검색 결과 '+rows.length+'개\u003c/span>\u003cbutton class=\"btn btn-ghost btn-sm\" type=\"button\" onclick=\"toggleOriginManagerResults()\">'+(originManagerResultsCollapsed?'펼치기':'접기')+'\u003c/button>\u003c/div>'+(originManagerResultsCollapsed?'':'\u003cdiv>'+rowHtml+'\u003c/div>');\n}\nfunction toggleOriginManagerResults() {\n  originManagerResultsCollapsed=!originManagerResultsCollapsed;\n  renderOriginManager();\n}\nfunction setOriginPhraseHidden(value, hidden) {\n  if(!db)return; const matches=managedOriginEntries.filter(function(e){return e.value===value;});\n  Promise.all(matches.map(function(e){return db.ref('origin_hidden/'+e.key).set(hidden?true:null);})).then(function(){\n    matches.forEach(function(e){if(hidden)managedOriginHidden[e.key]=true;else delete managedOriginHidden[e.key];});\n    loadOriginList(); renderOriginManager();\n  }).catch(function(err){toast('숨김 상태를 저장하지 못했습니다. Firebase 권한을 확인해주세요.','error');console.error(err);});\n}\nfunction deleteOriginPhrase(value) {\n  const matches=managedOriginEntries.filter(function(e){return e.value===value;});\n  if(!matches.length)return;\n  if(!window.confirm('\"'+value+'\" 표기를 삭제하시겠습니까?\\n표기 목록에서 제거되며, 기존 제품 기록과 원라벨 이미지는 유지됩니다.'))return;\n  Promise.all(matches.map(function(e){return db.ref('origins/'+e.key).remove();})).then(function(){\n    return Promise.all(matches.map(function(e){return db.ref('origin_hidden/'+e.key).remove();}));\n  }).then(function(){\n    managedOriginEntries=managedOriginEntries.filter(function(e){return e.value!==value;});\n    matches.forEach(function(e){delete managedOriginHidden[e.key];});\n    originAllList=originAllList.filter(function(v){return v!==value;});\n    originList=originList.filter(function(v){return v!==value;});\n    renderOriginManager();\n    toast('원산지 표기를 삭제했습니다. 기존 제품 기록과 원라벨 이미지는 유지됩니다.','success');\n  }).catch(function(err){toast('삭제하지 못했습니다. Firebase 권한을 확인해주세요.','error');console.error(err);});\n}\nfunction checkSettingsPw() {\n  const val = document.getElementById('settingsPwInput').value;\n  if (val === getSettingsPw()) {\n    document.getElementById('settingsLock').style.display = 'none';\n    document.getElementById('settingsContent').style.display = 'block';\n    loadFirebaseSettingsInputs();\n    loadOriginManager();\n    document.getElementById('settingsPwErr').style.display = 'none';\n  } else {\n    document.getElementById('settingsPwErr').style.display = 'block';\n    document.getElementById('settingsPwInput').value = '';\n    document.getElementById('settingsPwInput').focus();\n  }\n}\n\nfunction lockSettings() {\n  document.getElementById('settingsContent').style.display = 'none';\n  document.getElementById('settingsLock').style.display = 'block';\n  document.getElementById('settingsPwInput').value = '';\n  document.getElementById('settingsPwErr').style.display = 'none';\n}\n\nfunction changeSettingsPw() {\n  const p1 = document.getElementById('newPw1').value;\n  const p2 = document.getElementById('newPw2').value;\n  if (!p1) { toast('새 비밀번호를 입력해주세요', 'error'); return; }\n  if (p1 !== p2) { toast('비밀번호가 일치하지 않습니다', 'error'); return; }\n  localStorage.setItem(SETTINGS_PW_KEY, p1);\n  document.getElementById('newPw1').value = '';\n  document.getElementById('newPw2').value = '';\n  toast('✅ 비밀번호가 변경되었습니다', 'success');\n}\n\nfunction getSavedFirebaseCfg() {\n  try {\n    const s = JSON.parse(localStorage.getItem('reg_firebase_cfg') || 'null');\n    // 이전 프로젝트 설정이 브라우저에 남아 있어도 새 프로젝트로 연결한다.\n    if (s && s.projectId === 'hare-allergen1' && s.apiKey && s.databaseURL) return s;\n    if (s && s.projectId && s.projectId !== 'hare-allergen1') {\n      localStorage.removeItem('reg_firebase_cfg');\n    }\n  } catch(e) {}\n  return null;\n}\n\nfunction loadFirebaseSettingsInputs() {\n  const cfg = getSavedFirebaseCfg() || FB_CFG;\n  document.getElementById('fbProjectId').value  = cfg.projectId || '';\n  document.getElementById('fbApiKey').value     = cfg.apiKey || '';\n  document.getElementById('fbDbUrl').value      = cfg.databaseURL || '';\n  document.getElementById('fbAuthDomain').value = cfg.authDomain || '';\n  document.getElementById('fbAppId').value      = cfg.appId || '';\n  document.getElementById('fbShareBox').style.display = 'none';\n}\n\nfunction saveFirebaseSettings() {\n  const cfg = {\n    apiKey:        document.getElementById('fbApiKey').value.trim(),\n    authDomain:    document.getElementById('fbAuthDomain').value.trim(),\n    databaseURL:   document.getElementById('fbDbUrl').value.trim(),\n    projectId:     document.getElementById('fbProjectId').value.trim(),\n    storageBucket: (document.getElementById('fbProjectId').value.trim()) + '.firebasestorage.app',\n    appId:         document.getElementById('fbAppId').value.trim(),\n  };\n  if (!cfg.apiKey || !cfg.databaseURL || !cfg.projectId) {\n    toast('Project ID, API Key, Database URL는 필수입니다', 'error'); return;\n  }\n  localStorage.setItem('reg_firebase_cfg', JSON.stringify(cfg));\n  toast('✅ Firebase 설정 저장됨 — 페이지를 새로고침하면 반영됩니다', 'success');\n}\n\nfunction loadDefaultFirebase() {\n  if (!confirm('기본 Firebase 설정(hare-allergen1)으로 복원할까요?')) return;\n  localStorage.removeItem('reg_firebase_cfg');\n  loadFirebaseSettingsInputs();\n  toast('기본값으로 복원됨', 'success');\n}\n\n/* ══════════════════════════════════════════════════ */\n/*  EDIT MODAL                                        */\n/* ══════════════════════════════════════════════════ */\nlet editAllergenState = {};\nlet _editCurrentId = null;\nlet _editProductSnapshot = null;\n\n/* 상세 모달의 \"수정\" 버튼에서 호출 */\nfunction openEditModal() {\n  const id = _detailCurrentId;\n  if (!id) return;\n  closeProductDetail();\n  openEditById(id);\n}\n\n/* 목록 행/카드에서 직접 호출 */\nfunction openEditById(id) {\n  if (!db) return;\n  _editCurrentId = id;\n  db.ref('products/' + id).once('value', snap => {\n    const p = snap.val();\n    if (!p) { toast('데이터를 불러올 수 없습니다', 'error'); return; }\n    _editProductSnapshot = p;\n\n    /* 기본 정보 */\n    document.getElementById('editName').value  = p.제품이름 || '';\n    document.getElementById('editCat').value   = p.카테고리 || '일반빵';\n    document.getElementById('editPrice').value = p.판매금액 || '';\n    document.getElementById('editNote').value  = p.비고 || '';\n\n    /* 원산지 */\n    const o = p.원산지 || [];\n    document.getElementById('editO1').value = originDisplay(o[0]);\n    document.getElementById('editO2').value = originDisplay(o[1]);\n    document.getElementById('editO3').value = originDisplay(o[2]);\n\n    /* 판매 점포 */\n    setStoreSelection(editSelectedStores, 'editStoreGrid', getProductStoreNames(p));\n\n    /* 알레르기 */\n    editAllergenState = {};\n    ALLERGENS.forEach(a => { editAllergenState[a] = p[a] === 'Yes'; });\n    buildEditAllergenGrid();\n\n    document.getElementById('editModal').classList.add('open');\n  });\n}\n\nfunction buildEditAllergenGrid() {\n  const grid = document.getElementById('editAllergenGrid');\n  grid.innerHTML = '';\n  ALLERGENS.forEach(a => {\n    const div = document.createElement('div');\n    div.className = 'atag' + (editAllergenState[a] ? ' on' : '');\n    div.id = 'eatag-' + a;\n    div.innerHTML = `\u003cspan class=\"dot\">\u003c/span>${a}`;\n    div.onclick = () => toggleEditAllergen(a);\n    grid.appendChild(div);\n  });\n}\n\nfunction toggleEditAllergen(a) {\n  editAllergenState[a] = !editAllergenState[a];\n  const el = document.getElementById('eatag-' + a);\n  if (el) {\n    el.classList.toggle('on', editAllergenState[a]);\n    el.querySelector('.dot').style.background = editAllergenState[a] ? 'var(--danger)' : 'var(--border)';\n  }\n}\n\nfunction editClearAllergens() {\n  ALLERGENS.forEach(a => { editAllergenState[a] = false; });\n  buildEditAllergenGrid();\n}\n\nasync function saveEdit() {\n  const id = _editCurrentId;\n  if (!id || !db) return;\n\n  const name = document.getElementById('editName').value.trim();\n  if (!name) { toast('제품이름을 입력해주세요', 'error'); document.getElementById('editName').focus(); return; }\n\n  const o1t = document.getElementById('editO1').value.trim();\n  const o2t = document.getElementById('editO2').value.trim();\n  const o3t = document.getElementById('editO3').value.trim();\n  if (!o1t) { toast('원산지 1순위를 입력해주세요', 'error'); return; }\n  if (!o2t) { toast('원산지 2순위를 입력해주세요', 'error'); return; }\n  if (!o3t) { toast('원산지 3순위를 입력해주세요', 'error'); return; }\n\n  const btn = document.getElementById('editSaveBtn');\n  btn.disabled = true; btn.textContent = '⏳ 저장 중...';\n\n  try {\n    const origin = [\n      { rank:1, text:o1t },\n      { rank:2, text:o2t },\n      { rank:3, text:o3t },\n    ];\n    const storeSel = getSelectedStoreNames(editSelectedStores);\n    const newCat = document.getElementById('editCat').value;\n\n    // 쇼카드에서만 등록되어 \"카테고리 미등록\"으로 숨김 처리된 품목에\n    // 관리자가 여기서 정식 카테고리를 지정하면, 알러지 시스템 노출 숨김을\n    // 해제하고 정식 신제품으로 승격시킨다.\n    const wasUncategorized = !!(_editProductSnapshot && (_editProductSnapshot._hidden || _editProductSnapshot._showcardOriginOnly) && !(_editProductSnapshot.카테고리 || '').trim());\n    const promoting = wasUncategorized && !!newCat;\n\n    const updates = {\n      제품이름: name,\n      카테고리: newCat,\n      판매금액: parseFloat(document.getElementById('editPrice').value) || 0,\n      비고: document.getElementById('editNote').value.trim(),\n      원산지: origin,\n      판매점포: storeSel,\n    };\n    ALLERGENS.forEach(a => { updates[a] = editAllergenState[a] ? 'Yes' : 'No'; });\n    if (promoting) {\n      updates._hidden = false;\n      updates._showcardOriginOnly = false;\n      updates._newProduct = true;\n      updates.등록상태 = '신제품';\n    }\n\n    await db.ref('products/' + id).update(updates);\n    if (historyAdminUnlocked && _editProductSnapshot) {\n      const p = _editProductSnapshot;\n      const changes = [];\n\n      if ((p.제품이름 || '') !== updates.제품이름) changes.push('제품이름: ' + (p.제품이름 || '(없음)') + ' → ' + updates.제품이름);\n      if ((p.카테고리 || '') !== updates.카테고리) changes.push('카테고리: ' + (p.카테고리 || '(없음)') + ' → ' + updates.카테고리);\n      if ((Number(p.판매금액) || 0) !== updates.판매금액) changes.push('판매금액: ' + (Number(p.판매금액) || 0).toLocaleString('ko-KR') + ' → ' + updates.판매금액.toLocaleString('ko-KR'));\n      if ((p.비고 || '') !== updates.비고) changes.push('비고: ' + (p.비고 || '(없음)') + ' → ' + (updates.비고 || '(없음)'));\n      const previousStores = getProductStoreNames(p);\n      if (previousStores.join(',') !== storeSel.join(',')) changes.push('판매점포: ' + previousStores.join(', ') + ' → ' + storeSel.join(', '));\n\n      const oldOrigin = p.원산지 || [];\n      [0,1,2].forEach(i => {\n        const oldT = originDisplay(oldOrigin[i]);\n        const newT = origin[i].text;\n        if (oldT !== newT) {\n          changes.push('원산지 '+(i+1)+'순위: '+(oldT||'(없음)')+' → '+(newT||'(없음)'));\n        }\n      });\n\n      const addedAllergens = ALLERGENS.filter(a => editAllergenState[a] && p[a] !== 'Yes');\n      const removedAllergens = ALLERGENS.filter(a => !editAllergenState[a] && p[a] === 'Yes');\n      if (addedAllergens.length) changes.push('알레르기 추가: ' + addedAllergens.join(', '));\n      if (removedAllergens.length) changes.push('알레르기 제거: ' + removedAllergens.join(', '));\n\n      await db.ref('products/' + id + '/관리자확인로그').push({\n        adminName: '관리자',\n        date: nowStr(),\n        ts: Date.now(),\n        changes: changes.length ? changes : ['변경 없음 (관리자 모드 수정 저장)'],\n        memo: '등록 이력 관리자 모드에서 품목 수정',\n      });\n    }\n    toast(promoting ? '✅ 카테고리 지정 완료 — 알러지 시스템에 정식 노출됩니다' : '✅ 수정 완료!', 'success');\n    closeEditModal();\n    loadHistory();\n  } catch(e) {\n    toast('저장 실패: ' + e.message, 'error');\n  } finally {\n    btn.disabled = false; btn.textContent = '💾 저장하기';\n  }\n}\n\nfunction closeEditModal() {\n  document.getElementById('editModal').classList.remove('open');\n  _editCurrentId = null;\n  _editProductSnapshot = null;\n}\n\n\nlet shareProduct = null;\nfunction setupShare(product) { shareProduct = product; }\n\nfunction copyShareText() {\n  const p = shareProduct;\n  if (!p) {\n    // Firebase 설정 공유 텍스트 모드\n    const cfg = getSavedFirebaseCfg() || FB_CFG;\n    const text = `[신제품 등록 시스템 · Firebase 설정]\\nProject ID  : ${cfg.projectId}\\nAPI Key     : ${cfg.apiKey}\\nDatabase URL: ${cfg.databaseURL}\\nAuth Domain : ${cfg.authDomain}\\nApp ID      : ${cfg.appId}\\n\\n▶ 설정 탭에서 위 값을 입력하고 [저장 및 재연결] 클릭`;\n    if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('📋 공유 텍스트가 복사되었습니다', 'success'));\n    return;\n  }\n  const allergens = ALLERGENS.filter(a => p[a] === 'Yes');\n  const allergenStr = allergens.length > 0 ? allergens.join(', ') : '없음';\n  const originStr = (p.원산지||[]).map(o=>`${o.rank}순위 ${originDisplay(o)}`).join(' / ') || '미입력';\n  const storeStr = getProductStoreNames(p).map(displayStoreName).join(', ') || '판매 안 함';\n  const text = `🥐 신제품 등록 알림\\n\\n제품명: ${p.제품이름}\\n카테고리: ${p.카테고리}\\n판매가: ₩${Number(p.판매금액||0).toLocaleString('ko-KR')}\\n판매점포: ${storeStr}\\n\\n원산지: ${originStr}\\n알레르기: ${allergenStr}\\n\\n등록일시: ${p.등록일시}`;\n  if (navigator.clipboard) {\n    navigator.clipboard.writeText(text).then(() => {\n      toast('📋 복사됨! 카카오톡에 붙여넣기 하세요.', 'success');\n      const btn = document.getElementById('copyShareBtn');\n      if (btn) { btn.textContent = '✅ 복사됨!'; setTimeout(() => { btn.innerHTML = '📋 공유 내용 복사'; }, 2000); }\n    }).catch(() => fallbackCopy(text));\n  } else { fallbackCopy(text); }\n}\n\nfunction fallbackCopy(text) {\n  const ta = document.createElement('textarea');\n  ta.value = text; ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px';\n  document.body.appendChild(ta); ta.focus(); ta.select();\n  try { document.execCommand('copy'); toast('📋 복사됨!', 'success'); }\n  catch(e) { toast('복사 실패 — 직접 선택 후 복사해주세요', 'error'); }\n  document.body.removeChild(ta);\n}\n\n/* ══════════════════════════════════════════════════ */\n/*  GUIDE IMAGE (GitHub Pages static asset)           */\n/* ══════════════════════════════════════════════════ */\nlet guideImages = [{\n  _id: 'github-new-product-guide',\n  dataUrl: 'https://harebakery-cmd.github.io/hare-allergen/images/guide/new-product-01.jpg',\n  name: 'new-product-01.jpg'\n}];\n\nfunction loadGuideImages() {\n  renderOriginTipGuideImgs();\n  if (document.getElementById('page-settings')?.classList.contains('active')) {\n    renderGuideImgWrap();\n  }\n}\n\nfunction renderGuideImgWrap() {\n  const wrap = document.getElementById('guideImgWrap');\n  if (!wrap) return;\n  if (guideImages.length === 0) {\n    wrap.innerHTML = '\u003cdiv style=\"font-size:12px;color:var(--text3);padding:16px 0\">등록된 가이드 이미지가 없습니다\u003c/div>';\n    return;\n  }\n  wrap.innerHTML = guideImages.map((g, i) => `\n    \u003cdiv style=\"position:relative;width:110px;flex-shrink:0\">\n      \u003cimg src=\"${g.dataUrl}\" alt=\"가이드 이미지 ${i+1}\"\n        style=\"width:110px;height:110px;object-fit:cover;border-radius:var(--radius-sm);border:1.5px solid var(--border);cursor:pointer\"\n        onclick=\"viewGuideImg(${i})\" loading=\"lazy\" decoding=\"async\">\n      \u003cdiv style=\"font-size:10px;color:var(--text3);margin-top:4px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">${g.name || '이미지 '+(i+1)}\u003c/div>\n    \u003c/div>\n  `).join('');\n}\n\nfunction renderOriginTipGuideImgs() {\n  const area = document.getElementById('originGuideImgsArea');\n  const list = document.getElementById('originGuideImgList');\n  if (!area || !list) return;\n  if (guideImages.length === 0) { area.style.display = 'none'; return; }\n  area.style.display = 'block';\n  list.innerHTML = guideImages.map((g, i) => `\n    \u003cimg src=\"${g.dataUrl}\" alt=\"가이드 ${i+1}\" style=\"max-width:220px;border-radius:6px;border:1px solid rgba(255,255,255,.15)\" loading=\"lazy\" decoding=\"async\">\n  `).join('');\n}\n\nfunction addGuideImgSlot() {\n  toast('GitHub의 images/guide/new-product-01.jpg 파일을 교체해 주세요', 'error');\n}\n\nfunction removeGuideImg(id) {\n  toast('GitHub에서 images/guide/new-product-01.jpg 파일을 관리해 주세요', 'error');\n}\n\nfunction clearGuideImgs() {\n  toast('GitHub에서 images/guide/new-product-01.jpg 파일을 관리해 주세요', 'error');\n}\n\nfunction viewGuideImg(idx) {\n  const g = guideImages[idx]; if (!g) return;\n  zoomImg(g.dataUrl);\n}\n\n/* ══════════════════════════════════════════════════ */\n/*  TOAST                                             */\n/* ══════════════════════════════════════════════════ */\nfunction toast(msg, type = 'success') {\n  const tc = document.getElementById('tc');\n  const t = document.createElement('div');\n  t.className = 'toast ' + type;\n  t.textContent = msg;\n  tc.appendChild(t);\n  setTimeout(() => t.style.opacity = '0', 2800);\n  setTimeout(() => t.remove(), 3200);\n}\n\u003c/script>\n\n\u003c/body>\n\u003c/html>\n","showcard":"\u003c!DOCTYPE html>\r\n\u003chtml lang=\"ko\">\r\n\u003chead>\u003cbase href=\"https://harebakery-cmd.github.io/showcard/\">\r\n\u003cmeta charset=\"UTF-8\" />\r\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\r\n\u003ctitle>HARE,HARE — 쇼카드 출력 시스템\u003c/title>\r\n\r\n\u003c!-- Freesentation: matches the font family used in the uploaded 25_새이름표.ai reference design -->\r\n\u003cstyle>\r\n  @font-face{font-family:'Freesentation';font-weight:300;font-style:normal;font-display:swap;\r\n    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2404@1.0/Freesentation-3Light.woff2') format('woff2');}\r\n  @font-face{font-family:'Freesentation';font-weight:400;font-style:normal;font-display:swap;\r\n    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2404@1.0/Freesentation-4Regular.woff2') format('woff2');}\r\n  @font-face{font-family:'Freesentation';font-weight:500;font-style:normal;font-display:swap;\r\n    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2404@1.0/Freesentation-5Medium.woff2') format('woff2');}\r\n  @font-face{font-family:'Freesentation';font-weight:600;font-style:normal;font-display:swap;\r\n    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2404@1.0/Freesentation-6SemiBold.woff2') format('woff2');}\r\n  @font-face{font-family:'Freesentation';font-weight:700;font-style:normal;font-display:swap;\r\n    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2404@1.0/Freesentation-7Bold.woff2') format('woff2');}\r\n  @font-face{font-family:'Freesentation';font-weight:800;font-style:normal;font-display:swap;\r\n    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2404@1.0/Freesentation-8ExtraBold.woff2') format('woff2');}\r\n  @font-face{font-family:'Freesentation';font-weight:900;font-style:normal;font-display:swap;\r\n    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2404@1.0/Freesentation-9Black.woff2') format('woff2');}\r\n\u003c/style>\r\n\r\n\u003cscript crossorigin src=\"https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js\">\u003c/script>\r\n\u003cscript crossorigin src=\"https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js\">\u003c/script>\r\n\u003cscript src=\"https://unpkg.com/@babel/standalone@7.24.7/babel.min.js\">\u003c/script>\r\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js\">\u003c/script>\r\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js\">\u003c/script>\r\n\r\n\u003cstyle>\r\n  :root{\r\n    --background:#FFFDF8; --foreground:#231916; --card:#FFFFFF; --card-foreground:#231916;\r\n    --primary:#231916; --primary-foreground:#FFFFFF; --secondary:#F5F0E8; --secondary-foreground:#231916;\r\n    --muted:#F5F0E8; --muted-foreground:#8a7a6a; --accent:#C9926B; --accent-foreground:#FFFFFF;\r\n    --destructive:#c0392b; --border:#D9C7B8; --input-background:#FFFDF8; --ring:#C9926B;\r\n    --brand-orange:#C9926B; --brand-teal:#9ED1D7; --placeholder:#D9C7B8;\r\n  }\r\n  *{box-sizing:border-box;}\r\n  html,body{margin:0;padding:0;}\r\n  body{\r\n    background:var(--background); color:var(--foreground);\r\n    font-family:'Freesentation',-apple-system,BlinkMacSystemFont,sans-serif;\r\n    -webkit-font-smoothing:antialiased;\r\n  }\r\n  button{font-family:inherit; cursor:pointer;}\r\n  input,textarea{font-family:inherit;}\r\n  ::-webkit-scrollbar{width:5px;height:5px;}\r\n  ::-webkit-scrollbar-track{background:transparent;}\r\n  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}\r\n\r\n  .app{min-height:100vh; display:flex; flex-direction:column;}\r\n\r\n  /* ── Header ───────────────────────── */\r\n  .header{border-bottom:1px solid var(--border); background:var(--card); padding:12px 24px;\r\n    display:flex; align-items:center; justify-content:space-between; flex-shrink:0; gap:16px; flex-wrap:wrap;}\r\n  .header-left{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}\r\n  .logo-row{display:flex; align-items:center; gap:10px;}\r\n  .logo-badge{width:28px;height:28px;border-radius:6px;background:var(--brand-orange);\r\n    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:11px;letter-spacing:.15em;flex-shrink:0;}\r\n  .brand-name{font-size:13px;font-weight:900;letter-spacing:.1em;line-height:1.2;}\r\n  .brand-sub{font-size:9px;color:var(--muted-foreground);line-height:1.2;}\r\n  .maintabs{display:flex;border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-left:4px;}\r\n  .maintab-btn{display:flex;align-items:center;gap:6px;padding:7px 16px;font-size:12px;font-weight:700;\r\n    background:#fff;color:#5a4a3a;border:none;transition:all .15s;}\r\n  .maintab-btn.active{background:var(--primary);color:#fff;}\r\n  .maintab-btn:not(.active):hover{background:var(--secondary);}\r\n  .print-btn{display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:4px;font-size:12px;\r\n    font-weight:800;border:none;background:var(--primary);color:#fff;transition:all .15s;}\r\n  .print-btn:disabled{background:var(--secondary);color:#C4B49A;cursor:not-allowed;}\r\n  .print-btn:not(:disabled):hover{background:#3a2010;}\r\n  .print-btn:not(:disabled):active{transform:scale(.96);}\r\n\r\n  /* ── Layout ───────────────────────── */\r\n  .body{flex:1;display:flex;overflow:hidden;min-height:0;}\r\n  .aside{width:390px;flex-shrink:0;border-right:1px solid var(--border);background:var(--card);overflow-y:auto;}\r\n  .aside-inner{padding:20px;display:flex;flex-direction:column;gap:20px;}\r\n  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--background);}\r\n\r\n  .label-eyebrow{font-size:10px;font-weight:800;color:var(--muted-foreground);text-transform:uppercase;\r\n    letter-spacing:.14em;margin-bottom:8px;display:block;}\r\n  .divider{border-top:1px solid var(--border);}\r\n\r\n  /* card type chips */\r\n  .type-grid{display:flex;flex-wrap:wrap;gap:6px;}\r\n  .type-chip{padding:6px 12px;border-radius:4px;font-size:12px;font-weight:700;border:1px solid var(--border);\r\n    background:#fff;color:#5a4a3a;transition:all .15s;}\r\n  .type-chip.active{background:var(--primary);color:#fff;border-color:var(--primary);}\r\n  .type-chip:not(.active):hover{border-color:var(--primary);}\r\n  .type-chip .dim{opacity:.4;font-weight:400;font-size:9px;margin-left:4px;}\r\n\r\n  /* DB loader */\r\n  .db-wrap{position:relative;}\r\n  .db-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;\r\n    border:1px solid var(--border);border-radius:4px;font-size:12px;color:#5a4a3a;background:var(--input-background);transition:all .15s;}\r\n  .db-toggle:hover{border-color:var(--primary);}\r\n  .db-toggle-label{display:flex;align-items:center;gap:8px;}\r\n  .chev{transition:transform .2s;color:var(--muted-foreground);}\r\n  .chev.open{transform:rotate(180deg);}\r\n  .db-panel{position:absolute;top:calc(100% + 3px);left:0;right:0;z-index:30;background:#fff;\r\n    border:1px solid var(--border);border-radius:4px;box-shadow:0 8px 24px rgba(28,16,7,.12);overflow:hidden;}\r\n  .db-search{width:100%;padding:9px 12px;border:none;border-bottom:1px solid var(--border);font-size:12px;\r\n    outline:none;background:#FFFDF8;}\r\n  .db-list{max-height:240px;overflow-y:auto;}\r\n  .db-item{width:100%;text-align:left;padding:10px 14px;font-size:12px;background:none;border:none;\r\n    border-bottom:1px solid rgba(212,197,169,.5);display:flex;align-it tOriginLabelImageKey({ origin: normalized });\r\n    if (seen.has(key)) return;\r\n    seen.add(key);\r\n    keys.push({ key, origin: normalized });\r\n  }\r\n  if (variant && fullText) {\r\n    [...splitTopLevelList(fullText), fullText].forEach(text => {\r\n      const normalized = normalizeOriginLabelText(text);\r\n      if (!normalized) return;\r\n      const key = getOriginLabelImageKey({ origin: normalized, originLabelVariant: variant });\r\n      if (seen.has(key)) return;\r\n      seen.add(key);\r\n      keys.push({ key, origin: normalized, originLabelVariant: variant });\r\n    });\r\n  }\r\n  splitTopLevelList(fullText).forEach(addKey);\r\n  addKey(fullText);\r\n  return keys;\r\n}\r\nfunction makeOriginLabelVariantOption(key, data) {\r\n  return {\r\n    key,\r\n    origin: normalizeOriginLabelText(data && data.origin),\r\n    originLabelVariant: normalizeOriginLabelVariant(data && data.originLabelVariant),\r\n    images: Array.isArray(data && data.images) ? data.images.slice(0, 6) : [],\r\n  };\r\n}\r\nfunction originLabelVariantLabel(option) {\r\n  const variant = normalizeOriginLabelVariant(option && option.originLabelVariant);\r\n  return variant || \"공통 원라벨\";\r\n}\r\nfunction composeOriginLabelImages(selectedOption, sourceResults) {\r\n  const chunks = [];\r\n  if (selectedOption) chunks.push(selectedOption.images || []);\r\n  (sourceResults || []).forEach(result => {\r\n    if (selectedOption && result.source && result.source.origin === selectedOption.origin) return;\r\n    chunks.push(result.images || []);\r\n  });\r\n  const seen = new Set();\r\n  return chunks.flat().filter(img => {\r\n    const key = img && (img.src || img.id);\r\n    if (!key || seen.has(key)) return false;\r\n    seen.add(key);\r\n    return true;\r\n  }).slice(0, 6);\r\n}\r\nfunction readFileAsDataUrl(file) {\r\n  return new Promise((resolve, reject) => {\r\n    const reader = new FileReader();\r\n    reader.onload = () => resolve(reader.result);\r\n    reader.onerror = rejec ws[\"!cols\"] = headers.map((_, i) => ({ wch: i === 0 ? 18 : i \u003c= 2 ? 10 : i \u003c 3 + BULK_UPLOAD_MAX_ORIGIN_RANKS ? 20 : 28 }));\n\r\n  // Reference sheet so staff can copy exact allergen spelling — matching\r\n  // must be exact, since it maps 1:1 onto the fixed ALLERGENS key list.\r\n  const allergenSheet = XLSX.utils.aoa_to_sheet([\r\n    [\"사용 가능한 알레르기 유발물질 이름 (정확히 이 표기를 쉼표로 구분해 입력)\"],\r\n    ...ALLERGENS.map(a => [a]),\r\n  ]);\r\n  allergenSheet[\"!cols\"] = [{ wch: 40 }];\r\n\r\n  const wb = XLSX.utils.book_new();\r\n  XLSX.utils.book_append_sheet(wb, ws, \"제품 업로드 틀\");\r\n  XLSX.utils.book_append_sheet(wb, allergenSheet, \"알레르기 표기 목록\");\r\n  XLSX.writeFile(wb, \"쇼카드_제품_일괄업로드_틀.xlsx\");\r\n}\r\n\r\n// Reads the uploaded workbook into structured rows, without touching Firebase.\r\nasync function parseBulkUploadFile(file) {\r\n  const buf = await file.arrayBuffer();\r\n  const wb = XLSX.read(buf, { type: \"array\" });\r\n  const sheet = wb.Sheets[wb.SheetNames[0]];\r\n  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: \"\" });\r\n  if (rows.length \u003c 2) {\r\n    throw new Error(\"데이터가 없습니다. 다운로드한 틀의 헤더 행 아래에 제품을 입력해주세요.\");\r\n  }\r\n  const header = rows[0].map(h => String(h || \"\").trim());\r\n  const findCol = (aliases) => {\r\n    for (const a of aliases) {\r\n      const idx = header.findIndex(h => h === a);\r\n      if (idx !== -1) return idx;\r\n    }\r\n    return -1;\r\n  };\r\n  const nameIdx = findCol(BULK_UPLOAD_HEADERS.name);\n  const priceIdx = findCol(BULK_UPLOAD_HEADERS.price);\n  const setPriceIdx = findCol(BULK_UPLOAD_HEADERS.setPrice);\n  const allergenIdx = findCol(BULK_UPLOAD_HEADERS.allergen);\r\n  const originIdxs = Array.from({ length: BULK_UPLOAD_MAX_ORIGIN_RANKS }, (_, i) =>\r\n    header.findIndex(h => h === bulkOriginHeader(i + 1))\r\n  );\r\n  if (nameIdx === -1) {\r\n    throw new Error('헤더에서 \"제품명\" 열을 찾을 수 없습니다. 다운로드한 틀의 헤더 행을 그대로 사용해주세요.');\r\n  }\r\n\r\n  const parsedRows = [];\r\n  const skipped = [];\r\n  for (let i = 1; i \u003c rows.length; i++) {\r\n    const row = rows[i];\r\n    if (!row || row.every(c => String(c || \"\").trim() === \"\")) continue; // blank row\r\n    const name = String(row[nameIdx] || \"\").trim();\r\n    if (!name) { skipped.push({ row: i + 1, reason: \"제품명이 비어 있습니다\" }); continue; }\r\n\r\n    const priceRaw = priceIdx !== -1 ? String(row[priceIdx] || \"\").trim() : \"\";\n    const priceNum = priceRaw ? Number(priceRaw.replace(/[^0-9.]/g, \"\")) : NaN;\n    const setPriceRaw = setPriceIdx !== -1 ? String(row[setPriceIdx] || \"\").trim() : \"\";\n    const setPriceNum = setPriceRaw ? Number(setPriceRaw.replace(/[^0-9.]/g, \"\")) : NaN;\n\r\n    const originTexts = originIdxs\r\n      .map(idx => (idx !== -1 ? String(row[idx] || \"\").trim() : \"\"))\r\n      .filter(Boolean);\r\n\r\n    const allergenRaw = allergenIdx !== -1 ? String(row[allergenIdx] || \"\") : \"\";\r\n    const allergenNames = allergenRaw.split(/[,、，\\n]/).map(s => s.trim()).filter(Boolean);\r\n    const matchedAllergens = allergenNames.filter(a => ALLERGENS.includes(a));\r\n    const unknownAllergens = allergenNames.filter(a => !ALLERGENS.includes(a));\r\n\r\n    parsedRows.push({\r\n      row: i + 1,\r\n      name,\n      price: Number.isFinite(priceNum) && priceNum > 0 ? priceNum : null,\n      setPrice: Number.isFinite(setPriceNum) && setPriceNum > 0 ? setPriceNum : null,\n      originTexts,\r\n      matchedAllergens,\r\n      unknownAllergens,\r\n    });\r\n  }\r\n  return { parsedRows, skipped };\r\n}\r\n\r\n// Writes parsed rows to Firebase: creates/updates each product (matched to an\r\n// existing product by exact name) and adds any new origin phrases to the\r\n// shared origins list. Runs after the person confirms the parsed summary.\r\nasync function applyBulkUpload(parsedRows) {\r\n  const [productsSnap, originsSnap] = await Promise.all([\r\n    fetch(PRODUCT_DB_URL).then(r => r.json()).catch(() => ({})),\r\n    fetch(ORIGIN_DB_URL).then(r => r.json()).catch(() => ({})),\r\n  ]);\r\n\r\n  const nameToKey = new Map();\r\n  Object.entries(productsSnap || {}).forEach(([key, p]) => {\r\n    if (p && p[\"제품이름\"]) nameToKey.set(String(p[\"제품이름\"]).trim(), key);\r\n  });\r\n  const existingOrigins = new Set(Object.values(originsSnap || {}).filter(Boolean));\r\n\r\n  let created = 0, updated = 0, priceSkipped = 0;\r\n  const allergenWarnings = [];\r\n  const originsToAdd = new Set();\r\n\r\n  for (const row of parsedRows) {\r\n    const originArr = row.originTexts.map((t, i) => ({ rank: i + 1, text: t }));\r\n    row.originTexts.forEach(t => { if (!existingOrigins.has(t)) originsToAdd.add(t); });\r\n    if (row.unknownAllergens.length > 0) {\r\n      allergenWarnings.push(`${row.row}행 \"${row.name}\": 인식 안 된 알레르기 → ${row.unknownAllergens.join(\", \")}`);\r\n    }\r\n    if (row.price == null) priceSkipped++;\r\n\r\n    const update = { 제품이름: row.name, 원산지: originArr };\n    if (row.price != null) update.판매금액 = row.price;\n    if (row.setPrice != null) update.세트금액 = row.setPrice;\n    ALLERGENS.forEach(a => { update[a] = row.matchedAllergens.includes(a) ? \"Yes\" : \"No\"; });\r\n\r\n    const existingKey = nameToKey.get(row.name);\r\n    if (existingKey) {\r\n      await fetch(`${PRODUCT_DB_BASE_URL}/${existingKey}.json`, {\r\n        method: \"PATCH\",\r\n        headers: { \"Content-Type\": \"application/json\" },\r\n        body: JSON.stringify(update),\r\n      });\r\n      updated++;\r\n    } else {\r\n      const newId = \"bulk_\" + Date.now() + \"_\" + Math.random().toString(36).slice(2, 7);\r\n      await fetch(`${PRODUCT_DB_BASE_URL}/${newId}.json`, {\r\n        method: \"PUT\",\r\n        headers: { \"Content-Type\": \"application/json\" },\r\n        body: JSON.stringify({ _id: newId, _newProduct: true, 등록상태: \"신제품\", ...update }),\r\n      });\r\n      nameToKey.set(row.name, newId);\r\n      created++;\r\n    }\r\n  }\r\n\r\n  await Promise.all(\r\n    Array.from(originsToAdd).map(v =>\r\n      fetch(ORIGIN_DB_URL, {\r\n        method: \"POST\",\r\n        headers: { \"Content-Type\": \"application/json\" },\r\n        body: JSON.stringify(v),\r\n      })\r\n    )\r\n  );\r\n\r\n  return { created, updated, priceSkipped, allergenWarnings, originsAdded: originsToAdd.size };\r\n}\r\n\r\nfunction getStyleMode(type) {\r\n  return String(type || \"\").startsWith(\"season\") ? \"season\" : \"basic\";\r\n}\r\nfunction normalizeStyleProfile(profile, legacy = {}) {\r\n  const legacyColors = {};\r\n  if (legacy.descriptionColor) legacyColors.description = legacy.descriptionColor;\r\n  if (legacy.nameColor) legacyColors.name = legacy.nameColor;\r\n  if (legacy.priceColor) legacyColors.price = legacy.priceColor;\r\n  if (legacy.originColor) legacyColors.origin = legacy.originColor;\r\n  if (legacy.allergenColor) legacyColors.allergen = legacy.allergenColor;\r\n  return {\r\n    fonts: { ...DEFAULT_STYLE_PROFILE.fonts, ...(legacy.fonts || {}), ...((profile || {}).fonts || {}) },\r\n    lineHeights: { ...DEFAULT_STYLE_PROFILE.lineHeights, ...(legacy.lineHeights || {}), ...((profile || {}).lineHeights || {}) },\r\n    fontFamilies: { ...DEFAULT_STYLE_PROFILE.fontFamilies, ...(legacy.fontFamilies || {}), ...((profile || {}).fontFamilies || {}) },\r\n    colors: { ...DEFAULT_STYLE_PROFILE.colors, ...legacyColors, ...((profile || {}).colors || {}) },\r\n    alignments: { ...DEFAULT_STYLE_PROFILE.alignments, ...((profile || {}).alignments || {}) },\r\n  };\r\n}\r\nfunction getStyleProfile(settings, typeOrMode) {\r\n  const mode = getStyleMode(typeOrMode);\r\n  const saved = settings.styleProfiles && settings.styleProfiles[mode];\r\n  return normalizeStyleProfile(saved, settings);\r\n}\r\n\r\n// Resolve the CSS font-family string for a given text field based on the\r\n// active basic/season style profile and the shared uploaded-font library.\r\nfunction resolveFontFamily(fieldKey, settings, profile) {\r\n  const id = profile && profile.fontFamilies && profile.fontFamilies[fieldKey];\r\n  if (!id || id === \"freesentation\") return \"'Freesentation', sans-serif\";\r\n  if (id === \"system-sans\") return \"-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif\";\r\n  if (id === \"serif\") return \"Georgia, 'Times New Roman', serif\";\r\n  if (id === \"monospace\") return \"Consolas, 'Courier New', monospace\";\r\n  const cf = (settings.customFonts || []).find(f => f.id === id);\r\n  return cf ? `'${cf.family}'` : \"inherit\";\r\n}\r\n\r\n// Loads a TTF file the user uploads as a real web font (via the FontFace API),\r\n// registers it in settings.customFonts, and assigns it to the given field.\r\n// Also keeps a base64 copy (dataUrl) so the font can be restored after a\r\n// page reload / on another computer once \"변경 저장\" persists it to Firebase.\r\nasync function uploadCustomFont(file, fieldKey, setSettings, styleMode) {\r\n  try {\r\n    const buf = await file.arrayBuffer();\r\n    const family = \"CF\" + uid();\r\n    const face = new FontFace(family, buf);\r\n    await face.load();\r\n    document.fonts.add(face);\r\n    const dataUrl = await new Promise((res, rej) => {\r\n      const r = new FileReader();\r\n      r.onload = () => res(r.result);\r\n      r.onerror = () => rej(new Error(\"read failed\"));\r\n      r.readAsDataURL(file);\r\n    });\r\n    const id = uid();\r\n    const label = file.name.replace(/\\.[^.]+$/, \"\");\r\n    setSettings(s => ({\r\n      ...s,\r\n      customFonts: [...(s.customFonts || []), { id, label, family, dataUrl }],\r\n      styleProfiles: {\r\n        ...(s.styleProfiles || {}),\r\n        [styleMode]: {\r\n          ...getStyleProfile(s, styleMode),\r\n          fontFamilies: { ...getStyleProfile(s, styleMode).fontFamilies, [fieldKey]: id },\r\n        },\r\n      },\r\n    }));\r\n  } catch (err) {\r\n    console.error(err);\r\n    alert(\"폰트를 불러오지 못했습니다. TTF 파일인지 확인해 주세요.\");\r\n  }\r\n}\r\n\r\n// Re-registers every saved custom font as a real FontFace after settings are\r\n// loaded from Firebase e if (ch === \")\" || ch === \"]\" || ch === \"}\") depth = Math.max(0, depth - 1);\r\n    if ((ch === \",\" || ch === \"\\n\" || ch === \"\\r\") && depth === 0) {\r\n      if (cur.trim()) parts.push(cur.trim());\r\n      cur = \"\";\r\n    } else {\r\n      cur += ch;\r\n    }\r\n  }\r\n  if (cur.trim()) parts.push(cur.trim());\r\n  return parts.filter(Boolean);\r\n}\r\nfunction formatOriginText(value) {\r\n  return splitTopLevelList(value).join(\", \");\r\n}\r\n\r\n// Renders the individual amount first and the optional set amount second. A discount adds a\n// small red badge plus the original and discounted amount on the same row.\nfunction PriceBlock({ price, setPrice, priceLabel, setPriceLabel, discountPercent, priceColor, priceLabelColor, priceFamily, priceSize, priceLabelSize, priceLineHeight, priceAlign, px }) {\n  const flexAlign = priceAlign === \"left\" ? \"flex-start\" : priceAlign === \"right\" ? \"flex-end\" : \"center\";\n  const rows = [\n    { key: \"individual\", label: priceLabel == null ? \"낱개\" : priceLabel, value: price },\n    { key: \"set\", label: setPriceLabel == null ? \"세트\" : setPriceLabel, value: setPrice },\n  ].filter(row => String(row.value || \"\").trim() !== \"\");\n\n  if (rows.length > 0) {\n    return (\n      \u003cdiv style={{ display: \"flex\", flexDirection: \"column\", alignItems: flexAlign, gap: px(priceSize) * 0.16 }}>\n        {discountPercent > 0 && (\n          \u003cspan style={{ fontFamily: priceFamily, fontSize: px(priceLabelSize), fontWeight: 800, color: \"#D64545\", lineHeight: 1, whiteSpace: \"nowrap\" }}>\n            {discountPercent}%할인\n          \u003c/span>\n        )}\n        {rows.map(row => {\n          const rowOriginal = parsePriceNumber(row.value);\n          const rowHasDiscount = discountPercent > 0 && !isNaN(rowOriginal) && rowOriginal > 0;\n          const rowPrice = rowHasDiscount ? Math.round(rowOriginal * (100 - discountPercent) / 100) : row.value;\n          return (\n            \u003cdiv ke ent={card.discountPercent} priceColor={colors.price} priceLabelColor={colors.priceLabel} priceFamily={priceFamily} priceSize={f.priceSize} priceLabelSize={f.priceLabelSize} priceLineHeight={lh.price} priceAlign={align.price} px={px} />\n      \u003c/div>\r\n      {showOrigin && (\r\n        \u003cdiv style={{ ...absPosStyle(settings, type, \"allergen\"), fontFamily: allergenFamily, fontSize: px(f.allergenSize), color: colors.allergen, textAlign: align.allergen, lineHeight: lh.allergen,\r\n          borderTop: custom ? \"none\" : \"0.5px solid #e0d8cc\", paddingTop: custom ? 0 : px(f.allergenSize) * 0.5, minHeight: allergenText ? undefined : px(f.allergenSize) * lh.allergen }}>\r\n          {allergenText}\r\n        \u003c/div>\r\n      )}\r\n    \u003c/div>\r\n  );\r\n}\r\n\r\nfunction ShowCard({ card, settings, designs, scale = SCREEN_SCALE }) {\r\n  const { width: wMm, height: hMm } = settings.sizes[card.type];\r\n  const w = mmToPx(wMm, scale), h = mmToPx(hMm, scale);\r\n  const px = (pt) => ptToPx(pt, scale);\r\n  const isSeason = getStyleMode(card.type) === \"season\";\r\n  const design = designs && designs[card.type];\r\n  const custom = design && design.image;\r\n  const sw = Math.max(0.6, scale * 0.16);\r\n\r\n  return (\r\n    \u003cdiv style={{ width: w, height: h, position: \"relative\", background: \"white\", overflow: \"hidden\",\r\n      fontFamily: \"inherit\", userSelect: \"none\", flexShrink: 0 }}>\r\n      {custom ? (\r\n        \u003cimg src={custom} alt=\"\" style={{ position: \"absolute\", inset: 0, width: \"100%\", height: \"100%\", objectFit: \"fill\" }} />\r\n      ) : (\r\n        \u003c>\r\n          {isSeason && (\r\n            \u003cdiv style={{ position: \"absolute\", inset: 0, background: \"linear-gradient(135deg, #FFF9F0 0%, #FFF5E8 50%, #FFF9F0 100%)\", pointerEvents: \"none\" }} />\r\n          )}\r\n          \u003cCardFrame w={w} h={h} sw={sw} />\r\n        \u003c/>\r\n      )}\r\n      \u003cdiv style={{ position: \"absolute\", i
