<script>
(function(){
 const key='harehare.portal.theme',valid=['dark','light','system'];let mode='dark';
 try{const saved=localStorage.getItem(key);if(valid.includes(saved))mode=saved;}catch{}
 const media=window.matchMedia('(prefers-color-scheme: dark)');
 function apply(){const dark=mode==='dark'||(mode==='system'&&media.matches);const root=document.documentElement;root.classList.toggle('dark',dark);root.dataset.theme=dark?'dark':'light';root.dataset.themeMode=mode;root.style.colorScheme=dark?'dark':'light';window.dispatchEvent(new Event('hare-theme-change'));}
 window.HareTheme={refresh:apply,getMode:()=>mode,setMode(value){if(!valid.includes(value))return;mode=value;try{localStorage.setItem(key,mode);}catch{}apply();},isDark:()=>document.documentElement.classList.contains('dark')};
 if(media.addEventListener)media.addEventListener('change',()=>{if(mode==='system')apply();});else media.addListener(()=>{if(mode==='system')apply();});
 window.addEventListener('storage',e=>{if(e.key===key){mode=valid.includes(e.newValue)?e.newValue:'dark';apply();}});
 // The initial head script may run before the preview finishes mounting its DOM.
 // Reapply the same selected mode after mounting, not just the button highlight.
 function mounted(){apply();requestAnimationFrame(apply);}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mounted,{once:true});else mounted();
 window.addEventListener('pageshow',mounted);
 // Keep selected mode and root attributes consistent if a renderer rewrites them.
 const observer=new MutationObserver(()=>{
  const dark=mode==='dark'||(mode==='system'&&media.matches),theme=dark?'dark':'light',root=document.documentElement;
  if(root.classList.contains('dark')!==dark||root.dataset.theme!==theme||root.dataset.themeMode!==mode||root.style.colorScheme!==theme)apply();
 });
 observer.observe(document.documentElement,{attributes:true,attributeFilter:['class','data-theme','data-theme-mode','style']});
 apply();
})();
</script>

async function hash(password,salt){if(!crypto.subtle)throw Error('암호화 기능을 지원하는 브라우저에서 열어주세요.');const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);return hex(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:310000,hash:'SHA-256'},key,256)));}

 if(id==='hare01'){const fb=window.HareFirebase;if(!fb?.auth)throw Error('Firebase 연결을 시작하지 못했습니다. 인터넷 연결을 확인해주세요.');const credential=await fb.auth.signInWithEmailAndPassword(fb.adminEmail,password);if(credential.user.uid!==fb.adminUid){await fb.auth.signOut();throw Error('Firebase 관리자 계정 UID가 등록된 최고관리자와 다릅니다.');}if(!u||!u.active)throw Error('포털 최고관리자 계정을 찾을 수 없습니다.');}
 else {if(!u||!u.active||await hash(password,u.salt)!==u.hash)throw Error('아이디 또는 비밀번호를 확인해주세요.');if(window.HareFirebase?.auth?.currentUser)await window.HareFirebase.auth.signOut();}
 if(localStorage.getItem(KEY)!==expectedRaw)throw Error('계정이 변경되었습니다. 다시 로그인해주세요.');
 if(window.HareUnified&&!HareUnified.canLeave())return;
 if(!raw){const text=JSON.stringify(db);localStorage.setItem(KEY,text);raw=text;}
 session={id:u.id,hash:u.hash};close();$('local-admin-form').reset();emit();
 }catch(e){$('local-admin-error').textContent=e.message;}finally{b.disabled=false;}});

function publicAndRoles(){return `<div class="u-panel"><h3>누구나 · 비로그인 권한</h3><p class="u-notice">홈은 항상 공개됩니다. 발주표는 기본 공개이며 로그인 없이 작성할 수 있습니다. 아래 항목은 화면 이용 권한입니다. 제품 추가·숨김 해제·계정 관리 같은 관리자 기능은 공개되지 않습니다.</p><form id="public-permissions-form"><div class="u-checks">${[['view-order','제품 발주표 조회·작성'],...menus].map(([id,label])=>`<label><input type="checkbox" name="publicScreens" value="${id}" ${db.publicScreens.includes(id)?'checked':''} ${highest()?'':'disabled'}> ${label}</label>`).join('')}</div><div class="u-tools">${highest()?btn('save-public','누구나 권한 저장'):'최고관리자만 변경할 수 있습니다.'}</div><p id="public-message" role="status"></p></form></div>`;}

ed&&edit.id==='hare01'?'disabled':''}><option value="name-store-title" ${!allowed||!edit.displayStyle||edit.displayStyle==='name-store-title'?'selected':''}>사원명 / 소속 지점 / 직급</option><option value="name-role" ${allowed&&edit.displayStyle==='name-role'?'selected':''}>사원명 직급 · 홍길동 과장</option><option value="department-name" ${allowed&&edit.displayStyle==='department-name'?'selected':''}>소속 사원명 · 사무실 홍길동</option></select>${allowed&&edit.id==='hare01'?'<span class="u-muted">최고관리자는 항상 ‘관리자’로 표시됩니다.</span>':''}</label>${field('password',allowed?'새 비밀번호 · 비워두면 유지':'비밀번호','','type="password" minlength="4" autocomplete="new-password" '+(allowed?'':'required'))}<label class="u-checks"><input type="checkbox" name="active" ${!allowed||edit.active?'checked':''} ${allowed&&edit.id==='hare01'?'disabled':''}> 계정 사용</label></div><fieldset class="account-screen-permissions"><legend>화면 권한</legend><p class="u-footer">홈·발주표는 기본 이용 가능합니다. 추가로 사용할 화면을 선택하세요. 관리 메뉴는 관리자 이상에게만 표시됩니다.</p><div class="u-checks">${menus.map(([id,label])=>`<label><input type="checkbox" name="screenPermissions" value="${id}" ${allowed&&(edit.role==='super'||(edit.screenPermissions??db.permissions[edit.role]??[]).includes(id))?'checked':''} ${allowed&&edit.role==='super'?'disabled':''}> ${label}</label>`).join('')}</div></fieldset><div class="u-tools">${btn('save-user','계정 저장')}${btn('new-user','새 유저 입력')}</div><p id="account-message" role="status"></p></form></details>`;

function firebase(){const c=window.HareFirebase?.config||{};let problem='';try{localStorage.getItem(CONFIG);}catch{problem='브라우저가 설정 저장을 허용하지 않습니다.';}return heading('Firebase 연동','제품·발주·생산 데이터가 hare-workspace 프로젝트와 동기화됩니다.')+`<form id="firebase-form" class="u-panel"><p class="u-notice">프로젝트: hare-workspace · 데이터베이스: 싱가포르. 최고관리자 로그인은 Firebase 계정으로 인증합니다. 데이터베이스 규칙을 게시한 뒤 동기화가 시작됩니다.</p><div class="u-grid">${field('projectId','Project ID',c.projectId||'','required')}${field('apiKey','Web API Key',c.apiKey||'','required autocomplete="off"')}${field('authDomain','Auth Domain',c.authDomain||'','required placeholder="project.firebaseapp.com"')}${field('databaseURL','Realtime Database URL',c.databaseURL||'','required type="url" placeholder="https://…firebasedatabase.app"')}${field('appId','App ID',c.appId||'','required')}</div><div class="u-tools">${btn('save-firebase','연결 설정 저장')}</div><p id="firebase-message" role="status">${esc(problem)}</p></form>`;}

<script>(function(root){
'use strict';
const clone=x=>JSON.parse(JSON.stringify(x));
const qty=x=>{const n=Number(x);if(!Number.isSafeInteger(n)||n<0||n>1000000)throw Error('수량은 0~1,000,000 사이의 정수로 입력해주세요.');return n;};
function validate(s){
 if(!s||s.schema!==1||!Array.isArray(s.products)||!Array.isArray(s.stores)||!s.orders||!s.production)throw Error('통합 데이터 백업 형식이 아닙니다.');
 const object=v=>v&&typeof v==='object'&&!Array.isArray(v);
 const validId=id=>typeof id==='string'&&/^[a-zA-Z0-9-]+$/.test(id)&&!['constructor','prototype','__proto__'].includes(id);
 if(!object(s.orders)||!object(s.production)||!Number.isSafeInteger(s.revision)||s.revision<0||s.stores.length===0||s.stores.some(x=>!validId(x.id))||s.products.some(x=>!validId(x.id)))throw Error('데이터 구조 또는 식별자가 올바르지 않습니다.');
 const ids=new Set(),stores=new Set();
 s.stores.forEach(x=>{if(!x||typeof x.id!=='string'||!x.id||stores.has(x.id)||typeof x.name!=='string'||!x.name.trim())throw Error('지점 데이터가 올바르지 않습니다.');stores.add(x.id);});
 s.products.forEach(p=>{if(!p||typeof p.id!=='string'||!p.id||ids.has(p.id)||typeof p.name!=='string'||!p.name.trim()||!Array.isArray(p.storeIds)||p.storeIds.some(id=>!stores.has(id))||!Array.isArray(p.origins)||p.origins.length!==3||p.origins.some(v=>typeof v!=='string')||!Array.isArray(p.images)||p.images.length>6||p.images.some(v=>!safeImage(v))||typeof p.category!=='string'||!Number.isFinite(p.price)||p.price<0||typeof p.allergens!=='string'||typeof p.description!=='string'||typeof p.isNew!=='boolean'||typeof p.active!=='boolean')throw Error('제품 데이터가 올바르지 않습니다.');ids.add(p.id);});
 s.products.forEach(p=>{if(p.hiddenStoreIds!==undefined&&(!Array.isArray(p.hiddenStoreIds)||p.hiddenStoreIds.some(id=>!stores.has(id))))throw Error('지점별 숨김 설정이 올바르지 않습니다.');});
 for(const [date,day] of Object.entries(s.orders)){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!day||typeof day!=='object')throw Error('발주 날짜가 올바르지 않습니다.');for(const [sid,rows] of Object.entries(day)){if(!stores.has(sid)||!rows||typeof rows!=='object')throw Error('발주 지점이 올바르지 않습니다.');for(const [pid,n] of Object.entries(rows)){if(!ids.has(pid))throw Error('발주 제품을 찾을 수 없습니다.');qty(n);}}}
 for(const x of Object.values(s.production)){if(!x||!ids.has(x.productId)||!stores.has(x.storeId)||!/^\d{4}-\d{2}-\d{2}$/.test(x.date)||typeof x.worker!=='string'||typeof x.note!=='string')throw Error('생산일지 데이터가 올바르지 않습니다.');qty(x.made);qty(x.waste);if(x.waste>x.made)throw Error('폐기량은 생산량을 초과할 수 없습니다.');}
 return s;
}
function safeImage(v){try{const u=new URL(v);return u.protocol==='https:'&&!u.username&&!u.password&&v.length<=2000;}catch{return false;}}
function seed(catalog){return {schema:1,revision:0,updatedAt:null,stores:clone(catalog.stores),products:clone(catalog.products),orders:{},production:{}};}
function updateProduct(state,p){const next=clone(state);const name=p.name.trim();if(!name)throw Error('제품명을 입력해주세요.');if(next.products.some(x=>x.id!==p.id&&x.name.normalize('NFC').trim()===name.normalize('NFC')))throw Error('같은 이름의 제품이 있습니다. 기존 제품을 수정해주세요.');const item={...p,name,updatedAt:new Date().toISOString()};const index=next.products.findIndex(x=>x.id===item.id);if(index>=0)next.products[index]=item;else next.products.push(item);return validate(next);}
function updateOrders(state,date,changes){const next=clone(state);next.orders[date]??={};for(const c of changes){const p=next.products.find(x=>x.id===c.productId);if(!p||!p.active||!p.storeIds.includes(c.storeId))throw Error('판매 지점이나 제품 상태가 변경되었습니다. 화면을 새로 확인해주세요.');next.orders[date][c.storeId]??={};next.orders[date][c.storeId][c.productId]=qty(c.value);}return validate(next);}
function updateProduction(state,row){const next=clone(state);const key=[row.date,row.storeId,row.productId].join('|');next.production[key]={...row,made:qty(row.made),waste:qty(row.waste),updatedAt:new Date().toISOString()};return validate(next);}

function orderDiff(before,next,db){const writes=[],dates=new Set([...Object.keys(before.orders||{}),...Object.keys(next.orders||{})]);for(const date of dates){const stores=new Set([...Object.keys(before.orders?.[date]||{}),...Object.keys(next.orders?.[date]||{})]);for(const storeId of stores){const oldRows=before.orders?.[date]?.[storeId]||null,newRows=next.orders?.[date]?.[storeId]||null;if(JSON.stringify(oldRows)===JSON.stringify(newRows))continue;const author=next.orderAuthors?.[date]?.[storeId]||before.orderAuthors?.[date]?.[storeId]||null;const record={savedAt:author?.savedAt||new Date().toISOString(),rows:newRows||{},author,deleted:!newRows};writes.push(db.ref('hareharePortal/shared/orders/'+date+'/'+storeId).push().set(record));}}return writes;}

function applyCloudNode(node,part){if(!node||dirty)return;try{let next=M.clone(state);if(part==='catalog'){if(Array.isArray(node.stores)&&Array.isArray(node.products)){next.stores=node.stores;next.products=node.products;}}else if(part==='orders'){Object.assign(next,orderRecords(node));}else if(part==='production'){next.production=node||{};}next.revision=Math.max(next.revision||0,Number(node.revision)||0);M.validate(next);state=next;raw=JSON.stringify(next);localStorage.setItem(KEY,raw);home();if(current)render(current);}catch(err){notice('Firebase 자료 형식 확인 필요: '+err.message);}}
function startCloud(){const fb=window.HareFirebase,db=fb?.database;if(!db)return;const shared=db.ref('hareharePortal/shared');shared.child('catalog').on('value',s=>{if(s.exists())applyCloudNode(s.val(),'catalog');},e=>notice('Firebase 제품 자료 읽기 실패: '+e.message));shared.child('orders').on('value',s=>{if(s.exists())applyCloudNode(s.val(),'orders');},e=>notice('Firebase 발주 자료 읽기 실패: '+e.message));let privateRef=null;const bindPrivate=()=>{if(fb.isRoot()&&window.HareAdmin?.isLoggedIn()){if(!privateRef){privateRef=db.ref('hareharePortal/private/production');privateRef.on('value',s=>{if(s.exists())applyCloudNode(s.val(),'production');},e=>notice('생산일지 읽기 실패: '+e.message));}if(!cloudSeeded){cloudSeeded=true;db.ref('hareharePortal/shared/catalog').once('value').then(s=>{if(!s.exists()){const writes=[shared.child('catalog').set({stores:state.stores,products:state.products}),db.ref('hareharePortal/private/production').set(state.production)];for(const date of Object.keys(state.orders||{}))for(const storeId of Object.keys(state.orders[date]||{})){const author=state.orderAuthors?.[date]?.[storeId]||null;writes.push(shared.child('orders').child(date).child(storeId).push().set({savedAt:author?.savedAt||new Date().toISOString(),rows:state.orders[date][storeId],author,deleted:false}));}return Promise.all(writes);}}).catch(e=>notice('최초 자료 동기화 실패: '+e.message));}}else if(privateRef){privateRef.off();privateRef=null;const next=M.clone(state);if(Object.keys(next.production||{}).length){next.production={};state=next;raw=JSON.stringify(state);localStorage.setItem(KEY,raw);if(current)render(current);}}};let cloudSeeded=false;fb.auth?.onAuthStateChanged(bindPrivate);window.addEventListener('hare-admin-change',bindPrivate);}
startCloud();window.addEventListener('hare-admin-change',()=>{if(!dirty)render(current);});

0px; padding: 5px 12px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }\n.tag .x { cursor: pointer; color: var(--red); font-weight: 900; font-size: 14px; line-height: 1; }\n.tag .x:hover { opacity: 0.6; }\n.input-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }\n.text-input { flex: 1; min-width: 140px; background: var(--surface2); border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 13px; font-size: 13px; color: var(--text); font-family: 'Noto Sans KR', sans-serif; }\n.text-input:focus { outline: none; border-color: var(--accent); background: #fff; }\n.sel-input { background: var(--surface2); border: 1.5px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--text); font-family: 'Noto Sans KR', sans-serif; }\n.sel-input:focus { outline: none; border-color: var(--accent); }\n.field-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }\n.field-label { font-size: 12px; color: var(--text-dim); font-weight: 600; white-space: nowrap; }\n\n.drag-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; min-height: 32px; }\n.drag-item {\n  display: flex; align-items: center; gap: 8px;\n  background: var(--surface2); border: 1.5px solid var(--border);\n  border-radius: 9px; padding: 7px 12px;\n  font-size: 13px; font-weight: 500; cursor: default;\n  transition: box-shadow 0.15s, background 0.15s;\n  user-select: none;\n}\n.drag-item:hover { background: var(--accent-light); border-color: #c5d2f6; }\n.drag-item.dragging { opacity: 0.3; border-style: dashed; }\n.drag-item.drag-over { background: var(--accent-light); border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,91,219,0.2); }\n.drag-handle { cursor: grab; color: #adb5bd; font-size: 16px; line-height: 1; flex-shrink: 0; padding: 0 2px; }\n.drag-handle:active { cursor: grabbing; }\n.drag-handle:hover { color: var(--accent); }\n@media (hover: none) and (p  }\n\n.submit-bar {\n  position: sticky; bottom: 0; z-index: 100;\n  background: linear-gradient(135deg, #1e3a8a, #3b5bdb);\n  border-radius: 14px; padding: 16px 22px; margin-top: 4px; margin-bottom: 8px;\n  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;\n  box-shadow: 0 -4px 20px rgba(59,91,219,0.25);\n}\n.sb-title { font-size: 14px; font-weight: 800; color: #fff; }\n.sb-desc  { font-size: 11px; color: rgba(255,255,255,0.7); margin-top: 3px; }\n.btn-submit {\n  background: #fff; color: var(--accent); font-size: 14px; font-weight: 900;\n  padding: 11px 28px; border-radius: 10px; border: none; cursor: pointer;\n  box-shadow: 0 4px 14px rgba(0,0,0,0.15); transition: all 0.18s;\n  font-family: 'Noto Sans KR', sans-serif;\n}\n.btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.2); }\n.btn-submit:active { transform: translateY(0); }\n\n@media (max-width: 600px) {\n  .submit-bar { border-radius: 10px; padding: 13px 16px; }\n  .sb-title { font-size: 13px; }\n  .btn-submit { font-size: 13px; padding: 10px 20px; }\n}\n\n@keyframes toastIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }\n\n/* 총확인 탭 - 수정 버튼으로 변경된 셀만 분홍 강조 */\n.cell-modified { background: #fff0f6 !important; color: #c2255c !important; font-weight: 800 !important; }\n\n/* 품목별 수정 버튼 */\n.btn-edit-item {\n  padding: 4px 10px; font-size: 11px; font-weight: 700;\n  border-radius: 7px; border: 1.5px solid var(--border);\n  background: var(--surface2); color: var(--accent);\n  cursor: pointer; white-space: nowrap;\n  transition: all 0.15s; font-family: 'Noto Sans KR', sans-serif;\n  min-width: 44px; text-align: center;\n}\n.btn-edit-item:hover { background: var(--accent-light); border-color: var(--accent); }\n.btn-edit-item.saving { opacity: 0.5; pointer-events: none; }\n.btn-edit-item.done { background: #ebfbee; border-color: #8ce99a; color: #2f9e44; pointer-events: none; }\n.btn-hide-item {\n  width: 28px; height: 28px; border-radius: 7px; border: 1.5px solid var(--border);\n  background: var(--surface2); color: var(--text-dim); cursor: pointer;\n  display: inline-flex; align-items: center; justify-content: center;\n  font-size: 13px; flex-shrink: 0; transition: all 0.15s;\n}\n.btn-hide-item:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }\n.btn-hide-item.hidden { background: #fff5f5; border-color: #ffc9c9; color: #e03131; }\n.item-name-wrap { display: flex; align-items: center; justify-content: space-between; gap: 8px; }\n.item-hidden-name { color: #aaa; text-decoration: line-through; }\n@media (max-width: 600px) {\n  .btn-edit-item { padding: 5px 8px; min-height: 36px; }\n  .btn-hide-item { width: 34px; height: 34px; }\n}\n\n/* 스켈레톤 로더 */\n@keyframes skelShimmer {\n  0% { background-position: -400px 0; }\n  100% { background-position: 400px 0; }\n}\n.skel {\n  border-radius: 6px;\n  background: linear-gradient(90deg, #e9ecef 25%, #f1f3f5 50%, #e9ecef 75%);\n  background-size: 800px 100%;\n  animation: skelShimmer 1.4s infinite linear;\n}\n.skel-text { height: 14px; margin: 4px 0; }\n.skel-input { width: 68px; height: 32px; border-radius: 7px; margin: 0 auto; }\n\n@media (max-width: 600px) {\n  .header { padding: 0 10px; height: 52px; }\n  .logo { width: 30px; height: 30px; font-size: 12px; border-radius: 8px; }\n  .header-title { font-size: 13px; }\n  .header-sub { font-size: 9px; }\n  #fbStatus { font-size: 9px !important; }\n  .date-input { padding: 5px 8px; font-size: 12px; }\n  .tabs-bar { padding: 0 4px; top: 52px; }\n  .tab-btn { padding: 10px 12px; font-size: 11px; }\n  .main { padding: 10px 8px; max-width: 100%; }\n  .table-wrap { border-radius: 10px; }\n  .order-table.store-table { display: block; }\n  .order-table.store-table thead { display: none; }\n  .order-table.store-table tbody { display: flex; flex-direction: column; gap: 0; }\n  .order-table.store-table tbody tr {\n    display: flex; align-items: center; justify-content: space-between;\n    padding: 10px 14px; border-bottom: 1px solid #f0f2f7; gap: 8px;\n  }\n  .order-table.store-table tbody tr.cat-row {\n    background: #DBE2EF !important;\n    padding: 7px 14px !important;\n    display: block !important;\n  }\n  .order-table.store-table tbody tr.cat-row td {\n    font-size: 15px !important; font-weight: 800 !important;\n    color: #1B262C !important; text-align: left !important;\n    padding: 0 !important; box-shadow: none !important;\n    background: transparent !important;\n  }\n  .order-table.store-table tbody tr td:first-child {\n    position: static !important; box-shadow: none !important;\n    min-width: unset !important; font-size: 13px !important;\n    flex: 1; padding: 0 !important; background: transparent !important;\n  }\n  .order-table.store-table tbody tr td:last-child { padding: 0 4px !important; flex-shrink: 0; }\n  .order-table.store-table tbody tr:hover { background: #fafbff; }\n  .num-input {\n    width: 72px; height: 38px; font-size: 16px !important;\n    border-radius: 10px; padding: 6px 8px;\n    -webkit-text-size-adjust: none;\n  }\n  .order-table th { padding: 8px 4px; font-size: 13px; }\n  .order-table td { padding: 7px 4px; font-size: 12px; }\n  .order-table th:first-child { width: 28%; padding-left: 8px; }\n  .order-table td:first-child { padding-left: 8px; font-size: 12px; }\n  .summary-card { padding: 14px 16px; border-radius: 10px; }\n  .summary-card h2 { font-size: 15px; }\n  .summary-card p { font-size: 10px; }\n  .store-card { padding: 12px 14px; border-radius: 10px; gap: 8px; }\n  .store-name { font-size: 17px; }\n  .action-bar { padding: 10px 12px; border-radius: 10px; }\n  .notice-bar { padding: 8px 12px; font-size: 11px; border-radius: 8px; }\n  .btn { padding: 8px 12px; font-size: 11px; border-radius: 8px; }\n  .confirm-bar { padding: 12px 14px; border-radius: 10px; }\n  .confirm-bar .cb-title { font-size: 12px; }\n  .confirm-bar .cb-desc { font-size: 10px; }\n  .admin-section { padding: 16px 14px; border-radius: 10px; }\n  .admin-section h3 { font-size: 12px; }\n  .admin-save-footer { padding: 14px 16px; border-radius: 10px; }\n  .toast-wrap { bottom: 16px; right: 10px; left: 10px; }\n  .toast { font-size: 12px; padding: 10px 14px; text-align: center; }\n  .input-row { flex-direction: column; }\n  .input-row .text-input { min-width: unset; }\n  .locked-badge { padding: 4px 10px; font-size: 10px; }\n  .live-badge { padding: 4px 10px; font-size: 10px; }\n}\n\n@media (hover: none) and (pointer: coarse) {\n  .btn { min-height: 40px; }\n  .tab-btn { min-height: 44px; }\n  .num-input { min-height: 40px; }\n  .btn-primary:hover { transform: none; box-shadow: none; }\n  .order-table tbody tr:hover { background: transparent; }\n  .num-input { font-size: 16px !important; }\n  .text-input { font-size: 16px !important; }\n  .sel-input { font-size: 16px !important; }\n  .date-input { font-size: 16px !important; }\n}\n\n@supports (padding-bottom: env(safe-area-inset-bottom)) {\n  body { padding-bottom: env(safe-area-inset-bottom); }\n  .toast-wrap { bottom: calc(16px + env(safe-area-inset-bottom)); }\n}\n\u003c/style>\n\u003cscript src=\"https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js\">\u003c/script>\n\u003cscript src=\"https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js\">\u003c/script>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"header\">\n  \u003cdiv class=\"header-left\">\n    \u003cdiv class=\"logo\">발주\u003c/div>\n    \u003cdiv>\n      \u003cdiv class=\"header-title\">하레하레 발주 시스템\u003c/div>\n      \u003cdiv class=\"header-sub\" id=\"headerSub\">로딩중...\u003c/div>\n      \u003cdiv id=\"fbStatus\" style=\"font-size:10px;font-family:'DM Mono',monospace;margin-top:1px;color:#adb5bd\">⚡ 연결중...\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cinput type=\"date\" class=\"date-input\" id=\"globalDate\" onchange=\"onDateChange()\">\n\u003c/div>\n\n\u003cdiv class=\"tabs-bar\" id=\"tabsBar\">\u003c/div>\n\u003cdiv class=\"main\" id=\"mainContent\">\u003c/div>\n\u003cdiv class=\"toast-wrap\" id=\"toastWrap\">\u003c/div>\n\n\u003cscript>\n// ══════════════════════════════════════════════\n//  FIREBASE 초기화\n// ══════════════════════════════════════════════\nconst firebaseConfig = {\n  apiKey: \"AIzaSyCGzugccTwvFUcHzwumkPca0erVjXznKaA\",\n  authDomain: \"hare-order.firebaseapp.com\",\n  databaseURL: \"https://hare-order-default-rtdb.firebaseio.com\",\n  projectId: \"hare-order\",\n  storageBucket: \"hare-order.firebasestorage.app\",\n  messagingSenderId: \"119764747020\",\n  appId: \"1:119764747020:web:4b39a5f72c786b52e37f29\"\n};\nfirebase.initializeApp(firebaseConfig);\nconst db = firebase.database();\n\n// ══════════════════════════════════════════════\n//  날짜 키 — 생산/확인 기준일\n//\n//  발주 데이터는 \"입력한 날짜\"가 아니라 \"생산 기준일\"로 저장됨\n//  전날 오후 4시 ~ 당일 오후 3:59까지 같은 생산 기준일을 사용\n//\n//  오전 00:00 ~ 오후 3:59 → 오늘 생산분\n//  오후 4:00 ~ 23:59      → 내일 생산분\n// ══════════════════════════════════════════════\n// 로컬 날짜를 YYYY-MM-DD 문자열로 반환 (UTC 오류 방지)\nfunction localDateStr(date) {\n  const y = date.getFullYear();\n  const m = String(date.getMonth() + 1).padStart(2, '0');\n  const d = String(date.getDate()).padStart(2, '0');\n  return `${y}-${m}-${d}`;\n}\n\n// 오늘 로컬 날짜 문자열\nfunction todayLocal() { return localDateStr(new Date()); }\n\n// n일 후/전 로컬 날짜 문자열\nfunction offsetDate(n) {\n  const d = new Date(); d.setDate(d.getDate() + n); return localDateStr(d);\n}\n\nfunction getSummaryDateKey() {\n  const hour = new Date().getHours();\n  if (hour \u003c 16) {\n    // 자정~오후 3시: 오늘 생산분 확인/수정\n    return todayLocal();\n  } else {\n    // 오후 4시 이후: 내일 생산분 입력 시작\n    return offsetDate(+1);\n  }\n}\n\nfunction getDateKey() {\n  // 달력 선택값 항상 반영 (총 확인 탭 포함)\n  return document.getElementById('globalDate')?.value || getSummaryDateKey();\n}\n\n// ══════════════════════════════════════════════\n//  생산 기준일 라벨\n//\n//  [규칙]\n//  · 발주 데이터는 생산 기준일로 저장됨\n//  · 전날 오후 4시 ~ 당일 오후 3:59까지 같은 생산 기준일을 사용\n//\n//  예) 7월 3일 오후 4시 입력, 7월 4일 새벽 수정, 7월 4일 오전 확인\n//      → 모두 7월 4일 생산분\n// ══════════════════════════════════════════════\nfunction getOrderLabel(targetDateStr) {\n  // targetDateStr: 생산/확인 기준일\n\n  const today = todayLocal();\n  const tomorrow = offsetDate(+1);\n  const days = ['일','월','화','수','목','금','토'];\n\n  const prodDate = new Date(targetDateStr + 'T00:00:00');\n  const pm = `${prodDate.getMonth()+1}월 ${prodDate.getDate()}일(${days[prodDate.getDay()]})`;\n\n  const inputStart = new Date(targetDateStr + 'T00:00:00');\n  inputStart.setDate(inputStart.getDate() - 1);\n  const inputRange = `${inputStart.getMonth()+1}/${inputStart.getDate()} 오후~${prodDate.getMonth()+1}/${prodDate.getDate()} 오전`;\n\n  if (targetDateStr === today) {\n    return { text: `📦 오늘 생산분 · ${pm}`, detail: inputRange, color: '#2f9e44', bg: '#ebfbee', border: '#8ce99a' };\n  }\n  if (targetDateStr === tomorrow) {\n    return { text: `📦 내일 생산분 · ${pm}`, detail: inputRange, color: '#7950f2', bg: '#f3f0ff', border: '#b197fc' };\n  }\n  if (targetDateStr > today) {\n    return { text: `📦 ${pm} 생산분`, detail: inputRange, color: '#1971c2', bg: '#e7f5ff', border: '#74c0fc' };\n  }\n  return { text: `📦 ${pm} 생산분 (과거)`, detail: inputRange, color: '#868e96', bg: '#f8f9fa', border: '#dee2e6' };\n}\n\nfunction qtyRef()          { return db.ref('qty/' + getDateKey()); }  // 총 확인용\nfunction storeQtyRef(sid)  { return db.ref('qty/' + getStoreDate(sid) + '/' + sid); }  // 점포용\n\nfunction safeKey(p) {\n  return p.replace(/[.#$\\[\\]\\/]/g, '_');\n}\n\n// 점포 탭 전용 날짜: 기본은 생산 기준일\nfunction getStoreDate(sid) { return storeDateOverride[sid] || getSummaryDateKey(); }\n\nfunction getQ(sid, p)    { return qty[sid]?.[safeKey(p)] ?? 0; }\nfunction getSQ(sid, p)   { return summaryQty[sid]?.[safeKey(p)] ?? 0; }  // 총 확인 전용\nfunction getDraft(sid, p){ return draft[sid]?.[safeKey(p)] ?? null; }\nfunction setDraft(sid, p, v) {\n  if (!draft[sid]) draft[sid] = {};\n  const n = parseInt(v);\n  const k = safeKey(p);\n  draft[sid][k] = (isNaN(n) || n \u003c 0) ? 0 : n;\n  // updateSubmitBar는 onQtyInput의 디바운스에서 호출\n}\n\nfunction fbSubmitStore(sid) {\n  // 현재 DOM input 전체 값으로 저장\n  // (수정버튼으로 일부 저장 후 draft 일부 비어있어도 전체 반영)\n  const updates = {};\n\n  document.querySelectorAll(`.num-input[data-sid=\"${sid}\"]`).forEach(inp => {\n    const k = safeKey(inp.getAttribute('data-prod'));\n    if (inp.disabled) {\n      updates[k] = null;\n      return;\n    }\n    const n = parseInt(inp.value) || 0;\n    updates[k] = n > 0 ? n : null;\n  });\n\n  // DOM input이 없으면 (렌더 전) draft 기반으로 fallback\n  if (Object.keys(updates).length === 0) {\n    const d = draft[sid] || {};\n    Object.keys(d).forEach(k => {\n      const n = d[k] ?? 0;\n      updates[k] = n > 0 ? n : null;\n    });\n  }\n\n  if (Object.keys(updates).length === 0) return Promise.resolve();\n  return storeQtyRef(sid).update(updates);\n}\n\ndb.ref('.info/connected').on('value', snap => {\n  const el = document.getElementById('fbStatus');\n  if (!el) return;\n  if (snap.val()) {\n    el.textContent = '🟢 실시간 연결됨';\n    el.style.color = '#2f9e44';\n  } else {\n    el.textContent = '🔴 오프라인';\n    el.style.color = '#e03131';\n  }\n});\n\n// ══════════════════════════════════════════════\n//  리스너 — 총 확인 / 점포 완전 분리\n// ══════════════════════════════════════════════\n// 총 확인 전용 리스너\nlet summaryListener = null;\nlet summaryListenerDate = null;\n\n// 점포 전용 리스너\nlet qtyListener = null;\nlet qtyListenerSid = null;\nlet qtyListenerDate = null;\nlet qtyLoaded = false;\n\n// ── 총 확인 구독 (summaryQty에만 쓰고, qty 절대 건드리지 않음)\nfunction subscribeSummary() {\n  const dateKey = getDateKey();  // 생산 기준일\n  // 같은 날짜 구독 중이면 스킵\n  if (summaryListener && summaryListenerDate === dateKey) {\n    updateSummaryTable();  // 현재 summaryQty로 즉시 렌더\n    return;\n  }\n  // 이전 리스너 해제\n  if (summaryListener) {\n    db.ref('qty/' + summaryListenerDate).off('value', summaryListener);\n    summaryListener = null;\n  }\n  summaryListenerDate = dateKey;\n  summaryQty = {};\n  summaryListener = db.ref('qty/' + dateKey).on('value', snap => {\n    summaryQty = snap.val() || {};  // qty 변수 절대 건드리지 않음\n    if (currentTab === '__summary__') updateSummaryTable();\n  });\n}\n\n// ── 점포 구독 (qty[sid]에만 쓰고, summaryQty 절대 건드리지 않음)\nfunction subscribeStore(sid) {\n  const dateKey = getStoreDate(sid);\n\n  // 같은 점포+날짜 리스너가 이미 살아있고 데이터도 있으면 → 즉시 렌더만\n  if (qtyListener && qtyListenerSid === sid && qtyListenerDate === dateKey && qty[sid]) {\n    renderMain();\n    return;\n  }\n\n  // 이전 리스너 해제 (다른 점포/날짜였거나 데이터 없을 때)\n  if (qtyListener) {\n    db.ref('qty/' + qtyListenerDate + '/' + qtyListenerSid).off('value', qtyListener);\n    qtyListener = null; qtyListenerSid = null; qtyListenerDate = null;\n  }\n\n  qtyListenerSid = sid; qtyListenerDate = dateKey;\n  showStoreSkeleton(sid);\n  qtyLoaded = false;\n\n  qtyListener = db.ref('qty/' + dateKey + '/' + sid).on('value', snap => {\n    qty[sid] = snap.val() || {};  // summaryQty 절대 건드리지 않음\n    if (currentTab !== sid) return;\n    if (!qtyLoaded) {\n      qtyLoaded = true;\n      renderMain();\n    } else {\n      // 실시간 업데이트: 내 draft/포커스 칸 보호\n      document.querySelectorAll(`.num-input[data-sid=\"${sid}\"]`).forEach(inp => {\n        const k = safeKey(inp.getAttribute('data-prod'));\n        if (document.activeElement === inp) return;\n        if (draft[sid] && k in draft[sid]) return;\n        const newVal = qty[sid]?.[k] ?? 0;\n        inp.value = newVal > 0 ? newVal : '';\n      });\n    }\n  });\n}\n\n// 하위 호환 (configListener 등에서 호출)\nfunction subscribeQty() {\n  if (currentTab === '__summary__') subscribeSummary();\n  else if (currentTab !== '__admin__') subscribeStore(currentTab);\n}\n\nfunction showStoreSkeleton(sid) {\n  const store = stores.find(s => s.id === sid);\n  if (!store) return;\n  const el = document.getElementById('mainContent');\n  const skRows = Array(8).fill(0).map(() => `\n    \u003ctr>\n      \u003ctd>\u003cdiv class=\"skel skel-text\" style=\"width:${60+Math.random()*30|0}%\">\u003c/div>\u003c/td>\n      \u003ctd>\u003cdiv class=\"skel skel-input\">\u003c/div>\u003c/td>\n    \u003c/tr>`).join('');\n  el.innerHTML = `\n    \u003cdiv class=\"store-card\">\n      \u003cdiv>\n        \u003cdiv class=\"store-name\">🏪 ${store.label}\u003c/div>\n        \u003cdiv style=\"font-size:12px;color:var(--text-dim);margin-top:3px\">데이터 불러오는 중...\u003c/div>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"table-wrap\">\n      \u003ctable class=\"order-table store-table\" style=\"min-width:280px\">\n        \u003cthead>\u003ctr>\n          \u003cth style=\"text-align:left;padding-left:16px;min-width:150px\">품목\u003c/th>\n          \u003cth style=\"min-width:90px\">수량\u003c/th>\n          \u003cth style=\"min-width:60px\">\u003c/th>\n        \u003c/tr>\u003c/thead>\n        \u003ctbody>${skRows}\u003c/tbody>\n      \u003c/table>\n    \u003c/div>`;\n}\n\nfunction updateSummaryTable() {\n  const tbody = document.getElementById('summaryTbody');\n  if (!tbody) {\n    renderMain();\n    return;\n  }\n\n  const rows = tbody.querySelectorAll('tr[data-prod]');\n  rows.forEach(row => {\n    const p = row.getAttribute('data-prod');\n    let total = 0;\n    stores.forEach((s, i) => {\n      const q = getSQ(s.id, p);  // summaryQty 전용\n      total += q;\n      const cell = row.querySelector(`td[data-sid=\"${s.id}\"]`);\n      if (cell) {\n        const prev = cell.getAttribute('data-prev') || '0';\n        const cur = String(q);\n        if (prev !== cur) {\n          cell.textContent = q > 0 ? q : '-';\n          const _isMod = modifiedItems.has(s.id + '|' + safeKey(p));\n          cell.className = (q > 0 ? 'cell-has' : 'cell-zero') + (_isMod ? ' cell-modified' : '');\n          if (isDisabled(s.id, p)) cell.style.cssText = 'text-decoration:line-through;opacity:0.4';\n          cell.setAttribute('data-prev', cur);\n          row.classList.remove('row-flash');\n          void row.offsetWidth;\n          row.classList.add('row-flash');\n        }\n      }\n    });\n    const totalCell = row.querySelector('td.cell-total');\n    if (totalCell) {\n      totalCell.textContent = total > 0 ? total : '-';\n    }\n    if (!summaryShowAll) {\n      row.style.display = total === 0 ? 'none' : '';\n    } else {\n      row.style.display = '';\n    }\n  });\n\n  updateCatRowVisibility(tbody);\n}\n\nfunction updateCatRowVisibility(tbody) {\n  const catRows = tbody.querySelectorAll('tr.cat-row');\n  catRows.forEach(catRow => {\n    const cat = catRow.getAttribute('data-cat');\n    if (!cat) return;\n    let hasVisible = false;\n    let sibling = catRow.nextElementSibling;\n    while (sibling && !sibling.classList.contains('cat-row')) {\n      if (sibling.style.display !== 'none') { hasVisible = true; break; }\n      sibling = sibling.nextElementSibling;\n    }\n    catRow.style.display = (!summaryShowAll && !hasVisible) ? 'none' : '';\n  });\n}\n\n// config 실시간 구독\nlet configListener = null;\nfunction subscribeConfig(callback) {\n  if (configListener) { db.ref('config').off('value', configListener); }\n  let firstLoad = true;\n  configListener = db.ref('config').on('value', snap => {\n    const cfg = snap.val();\n    if (cfg) {\n      if (cfg.stores)   stores   = cfg.stores;\n      if (cfg.products) products = cfg.products;\n      if (cfg.masterCatOrder && cfg.masterProds) {\n        masterProducts = {};\n        cfg.masterCatOrder.forEach(cat => {\n          masterProducts[cat] = cfg.masterProds[cat] || [];\n        });\n      } else if (cfg.master) {\n        masterProducts = cfg.master;\n      } else {\n        masterProducts = buildMasterFromProducts();\n      }\n      if (cfg.disabled) {\n        disabled = {};\n        Object.entries(cfg.disabled).forEach(([sid, arr]) => {\n          disabled[sid] = {};\n          (arr || []).forEach(p => { disabled[sid][p] = true; });\n        });\n      }\n      if (cfg.hiddenCats) {\n        hiddenCats = {};\n        (cfg.hiddenCats || []).forEach(c => { hiddenCats[c] = true; });\n      } else {\n
